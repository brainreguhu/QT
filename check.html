<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>記錄送出</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4d;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #3d8bfd;
      --accent-hover: #5a9dff;
      --danger: #f87171;
      --ok: #4ade80;
      --btn-secondary-bg: #2a3038;
      --btn-secondary-hover: #383e4a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: radial-gradient(ellipse 120% 80% at 50% -20%, #1e3a5f 0%, var(--bg) 55%);
      color: var(--text);
      line-height: 1.5;
    }
    body.split-layout-active {
      overflow: hidden;
    }
    main {
      max-width: 400px;
      margin: 0 auto;
      padding: 8px 12px 0;
    }
    main.split-layout {
      max-width: min(1200px, 100%);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding-bottom: 8px;
    }
    main.split-layout #auth-status {
      flex: 0 0 auto;
    }
    .page-layout {
      display: flex;
      flex-direction: column;
    }
    .page-layout-form,
    .page-layout-query {
      min-width: 0;
    }
    main.split-layout .page-layout {
      flex: 1 1 auto;
      min-height: 0;
      flex-direction: row;
      align-items: stretch;
      gap: 12px;
    }
    main.split-layout .page-layout-query {
      flex: 1 1 0;
      order: 1;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }
    main.split-layout .page-layout-form {
      flex: 1 1 0;
      order: 2;
      max-width: 400px;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }
    main.split-layout .query-card {
      margin-top: 0;
    }
    form {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 8px 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    select, textarea, input[readonly], input[type="file"] {
      width: 100%;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
    }
    select, textarea, input[readonly] {
      padding: 10px 12px;
      font-size: 16px;
    }
    input[type="file"] {
      padding: 8px;
      font-size: 14px;
      border-style: dashed;
    }
    input[type="file"].visually-hidden-file {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .photo-picker-row {
      display: flex;
      align-items: stretch;
      gap: 6px;
    }
    .photo-picker-btn {
      flex: 1 1 0;
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      background: var(--btn-secondary-bg);
      color: var(--text);
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
    .photo-picker-btn:hover {
      background: var(--btn-secondary-hover);
      border-color: var(--accent);
      color: #fff;
    }
    .photo-selected-name {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
      word-break: break-all;
    }
    .select-with-reset {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .select-with-reset > select {
      flex: 1 1 auto;
      min-width: 0;
    }
    .vendor-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .vendor-row > select {
      flex: 1 1 0;
      min-width: 0;
      width: auto;
    }
    .vendor-row > .select-reset-btn {
      flex: 0 0 auto;
    }
    .select-reset-btn {
      flex: 0 0 auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      background: var(--btn-secondary-bg);
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
    .select-reset-btn:hover {
      background: var(--btn-secondary-hover);
      border-color: var(--accent);
      color: #fff;
    }
    select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(61, 139, 253, 0.25);
    }
    textarea { height: 64px; resize: none; }
    /* 標題左緣與 select/textarea/input 左邊界切齊（不另縮排） */
    .section-title {
      font-size: 16px;
      color: var(--muted);
      margin: 0 0 2px 0;
      padding-left: 0;
      font-weight: 600;
    }
    p.section-title {
      margin-top: 0;
      margin-bottom: 2px;
    }
    label.section-title {
      display: block;
      margin: 0 0 2px 0;
    }
    .serial-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .serial-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .serial-header-actions {
      display: inline-flex;
      align-items: center;
      gap: 20px;
      flex-shrink: 0;
      margin-left: auto;
    }
    .header-toggle {
      display: inline-flex;
      align-items: center;
      padding: 3px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.16);
      cursor: pointer;
      user-select: none;
    }
    .header-toggle:hover {
      border-color: rgba(120, 160, 220, 0.55);
    }
    .header-toggle-input {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .header-toggle-track {
      width: 42px;
      height: 24px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      position: relative;
      flex-shrink: 0;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }
    .header-toggle-track::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      transform: translateY(-50%);
      background: rgba(220, 232, 250, 0.9);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
      transition: left 160ms ease, background 160ms ease;
    }
    .header-toggle-input:checked + .header-toggle-track {
      background: rgba(61, 139, 253, 0.25);
      border-color: rgba(90, 160, 255, 0.75);
    }
    .header-toggle-input:checked + .header-toggle-track::after {
      left: 20px;
      background: rgba(255, 255, 255, 0.95);
    }
    .header-toggle-input:focus-visible + .header-toggle-track {
      outline: none;
      box-shadow: 0 0 0 3px rgba(61, 139, 253, 0.28);
    }
    .serial-header .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-left: 0;
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      background: var(--btn-secondary-bg);
      font-family: inherit;
      white-space: nowrap;
    }
    .serial-header .back-btn:hover {
      background: var(--btn-secondary-hover);
      border-color: var(--accent);
      color: #fff;
    }
    .serial-number-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
    }
    .serial-number-row .section-title {
      display: inline-block;
      margin: 0;
      padding-left: 0;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .serial-number-row #serial {
      flex: 1 1 auto;
      width: auto;
      min-width: 12ch;
      box-sizing: border-box;
    }
    .work-zone-inline {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .serial-header .section-title {
      margin: 0;
    }
    .work-zone-inline .work-zone-heading {
      margin-right: 0;
    }
    .serial-header .work-zone-tag {
      color: #fff;
      font-weight: 700;
      font-size: 30px;
      line-height: 1.2;
      flex-shrink: 0;
      min-width: 2em;
    }
    #submit-btn {
      margin-top: 14px;
    }
    button[type="submit"] {
      margin-bottom: 0;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    button[type="submit"]:hover:not(:disabled) { background: var(--accent-hover); }
    button[type="submit"]:disabled { opacity: 0.55; cursor: not-allowed; }
    #status {
      min-height: 1em;
      font-size: 14px;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    #status.error { color: var(--danger); }
    #status.success { color: var(--ok); }
    #auth-status {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 6px;
      min-height: 1.5em;
    }
    #auth-status.hidden { display: none; }
    .query-card {
      margin-top: 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 10px 12px;
    }
    #query-missing-btn {
      width: 100%;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    #query-missing-btn:hover:not(:disabled) { background: var(--accent-hover); }
    #query-missing-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    #query-warning {
      display: none;
      margin: 5px 0 0;
      color: var(--danger);
      font-size: 14px;
      text-align: center;
    }
    #query-warning:not(:empty) {
      display: block;
    }
    .missing-result-row {
      margin: 5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0px;
    }
    .missing-result-row[hidden] {
      display: none;
    }
    #missing-result {
      margin: 0;
      min-height: 1.2em;
      color: var(--ok);
      font-size: 14px;
    }
    .missing-hint {
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }
    .missing-result-actions {
      display: flex;
      align-items: center;
      gap: 30px;
    }
    .missing-toggle-btn {
      border: none;
      background: none;
      padding: 0;
      color: var(--accent);
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .missing-toggle-btn:hover {
      color: var(--accent-hover);
    }
    .missing-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .missing-item {
      position: relative;
      border: 1px solid rgba(70, 92, 128, 0.5);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.12);
      padding: 8px 10px 8px 8px;
    }
    .missing-item-main {
      min-width: 0;
      padding-right: 44px;
      line-height: 1.45;
      word-break: break-word;
      font-size: 14px;
    }
    .missing-item-row {
      margin: 0;
    }
    .missing-item-row + .missing-item-row {
      margin-top: 4px;
    }
    .missing-item-row--check {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    .missing-item-check-label {
      font-weight: 600;
      color: rgba(210, 223, 242, 0.92);
    }
    .missing-item-check {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
    }
    .missing-check {
      width: 30px;
      height: 30px;
      cursor: pointer;
      accent-color: var(--accent);
    }
    .missing-photo-link {
      color: #9ac7ff;
      text-decoration: underline;
      text-underline-offset: 2px;
      font-weight: 600;
    }
    .missing-photo-link:hover {
      color: #fff;
    }
    .photo-modal[hidden] { display: none; }
    .photo-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .photo-modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
    }
    .photo-modal-dialog {
      position: relative;
      z-index: 1;
      width: min(92vw, 720px);
      max-height: 90vh;
      background: #0f1419;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .photo-modal-img-wrap {
      min-height: 120px;
      max-height: calc(90vh - 90px);
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(70, 92, 128, 0.45);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.25);
      padding: 6px;
    }
    .photo-modal-img {
      max-width: 100%;
      height: auto;
      display: block;
    }
    .photo-modal-close {
      align-self: center;
      width: 80px;
      border: none;
      border-radius: 8px;
      padding: 8px 0;
      font-size: 16px;
      font-weight: 700;
      background: var(--btn-secondary-bg);
      color: #fff;
      cursor: pointer;
    }
    .photo-modal-close:hover { background: var(--btn-secondary-hover); }
  </style>
</head>
<body>
  <main id="app-main">
    <p id="auth-status" role="status" aria-live="polite">驗證登入中…</p>
    <div class="page-layout">
      <div class="page-layout-form">
    <form id="record-form" inert novalidate>
      <div class="serial-block">
        <div class="serial-header">
          <div class="work-zone-inline">
            <span class="section-title work-zone-heading">工區</span>
            <span class="work-zone-tag" id="work-zone-display" title="工區">67</span>
          </div>
          <div class="serial-header-actions">
            <label class="header-toggle" for="header-toggle" title="分割檢視：左側查詢列表、右側新增表單">
              <input id="header-toggle" class="header-toggle-input" type="checkbox" role="switch" aria-checked="false" />
              <span class="header-toggle-track" aria-hidden="true"></span>
            </label>
            <a class="back-btn" href="./index.html">↩ 返回</a>
          </div>
        </div>
        <input type="hidden" id="work-zone" name="workZone" value="67" />
        <div class="serial-number-row">
          <label for="serial" class="section-title">編號</label>
          <input id="serial" name="serial" type="text" readonly />
        </div>
      </div>

      <div>
        <p class="section-title">樓層</p>
        <div class="select-with-reset">
          <select id="floor" name="floor" required>
            <option value="" disabled selected>請選擇</option>
          </select>
          <button type="button" id="clear-floor-btn" class="select-reset-btn">清除</button>
        </div>
      </div>

      <div>
        <p class="section-title">位置</p>
        <div class="select-with-reset">
          <select id="loc1" name="loc1" required>
            <option value="" disabled selected>請選擇</option>
          </select>
          <button type="button" id="clear-loc1-btn" class="select-reset-btn">清除</button>
        </div>
        <div style="margin-top:5px;">
          <select id="loc2" name="loc2" required disabled>
            <option value="" disabled selected>請先選擇 位置1</option>
          </select>
        </div>
        <div style="margin-top:5px;">
          <select id="loc3" name="loc3" required disabled>
            <option value="" disabled selected>請先選擇 位置2</option>
          </select>
        </div>
      </div>

      <div>
        <p class="section-title">廠商</p>
        <div class="vendor-row">
          <select id="vendor1" name="vendor1" required>
            <option value="" disabled selected>請選擇</option>
          </select>
          <select id="vendor2" name="vendor2" required disabled>
            <option value="" disabled selected>請先選擇 廠商1</option>
          </select>
          <button type="button" id="clear-vendor2-btn" class="select-reset-btn">清除</button>
        </div>
      </div>

      <div>
        <label for="description" class="section-title">說明</label>
        <textarea id="description" name="description" placeholder="請輸入說明..." required></textarea>
      </div>
      <div>
        <label for="category" class="section-title">分類</label>
        <div class="select-with-reset">
          <select id="category" name="category" required>
            <option value="" disabled selected>請選擇</option>
          </select>
          <button type="button" id="clear-category-btn" class="select-reset-btn">清除</button>
        </div>
      </div>
      <div>
        <p class="section-title">照片</p>
        <input type="file" id="photo-camera" class="visually-hidden-file" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true" />
        <input type="file" id="photo-gallery" class="visually-hidden-file" accept="image/*" tabindex="-1" aria-hidden="true" />
        <div class="photo-picker-row">
          <button type="button" id="photo-camera-btn" class="photo-picker-btn">拍照</button>
          <button type="button" id="photo-gallery-btn" class="photo-picker-btn">從相簿選擇</button>
        </div>
        <p id="photo-selected-name" class="photo-selected-name" aria-live="polite">尚未選擇照片</p>
      </div>
      <button type="submit" id="submit-btn">送出至 Supabase</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
      </div>
    <section class="query-card page-layout-query" aria-label="查詢缺失卡片">
      <button type="button" id="query-missing-btn">查詢缺失</button>
      <p id="query-warning" role="status" aria-live="polite"></p>
      <div id="missing-result-row" class="missing-result-row" hidden>
        <p id="missing-result" role="status" aria-live="polite"></p>
        <div class="missing-result-actions">
          <button type="button" id="toggle-completed-btn" class="missing-toggle-btn">隱藏完成項目</button>
          <span class="missing-hint">完成請打勾</span>
        </div>
      </div>
      <ol id="missing-list" class="missing-list"></ol>
    </section>
    </div>
  </main>
  <div id="photo-modal" class="photo-modal" hidden aria-hidden="true">
    <div class="photo-modal-backdrop" aria-hidden="true"></div>
    <div class="photo-modal-dialog" role="dialog" aria-modal="true" aria-label="照片預覽">
      <div class="photo-modal-img-wrap">
        <img id="photo-modal-img" class="photo-modal-img" alt="照片預覽" />
      </div>
      <button type="button" id="photo-modal-close" class="photo-modal-close">X</button>
    </div>
  </div>

      const html = visibleRows

          const from = String(r[DB_COLUMNS.from] ?? "").trim() || "未知來源";
          const checkUser = String(r[DB_COLUMNS.check1User] ?? "").trim();
          const checkDateDisplay = formatDateYMD(r[DB_COLUMNS.check1Time]);
          const done = isRowDone(r);
          const checkActionLabel = done ? "勾選" : "取消勾選";
          const photoHtml = photo
            ? `<a class="missing-photo-link" href="${escapeHtml(photo)}" target="_blank" rel="noopener noreferrer">照片</a>`

          const checkHtml = serialKey

            : `<input type="checkbox" class="missing-check" disabled title="缺少編號，無法寫回" aria-label="完成" />`;
          const checkBottomHtml = `<p class="missing-item-row missing-item-row--check"><span class="missing-item-check-label">完成</span>${escapeHtml(checkUser || "（無）")} : ${escapeHtml(checkActionLabel)} : ${escapeHtml(checkDateDisplay || "（無）")}</p>`;
          return `<li class="missing-item"><div class="missing-item-main"><p class="missing-item-row"><strong>${escapeHtml(serial)}</strong></p><p class="missing-item-row">${escapeHtml(category)} | ${escapeHtml(vendor2)} | ${escapeHtml(from)}</p><p class="missing-item-row">${escapeHtml(locDisplay || "（無位置）")} | ${photoHtml}</p><p class="missing-item-row">${escapeHtml(desc)}</p>${checkBottomHtml}</div><div class="missing-item-check">${checkHtml}</div></li>`;

    function formatDateYMD(value) {
      if (value === null || value === undefined || value === "") return "";
      const s = String(value).trim();
      const isoMatch = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (isoMatch) return `${isoMatch[1]}/${isoMatch[2]}/${isoMatch[3]}`;
      const d = new Date(s);
      if (Number.isNaN(d.getTime())) return s;
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}/${m}/${day}`;
    }
    function getNowDateTimeISO() {

    async function getSessionUserName() {
      if (cachedUserName) return cachedUserName;
      const {
        data: { session },
      } = await supabase.auth.getSession();
      if (!session) return "未知使用者";
      const { data: profile } = await supabase
        .from(PROFILE_TABLE)
        .select("username")
        .eq("id", session.user.id)
        .maybeSingle();
      const meta = session.user.user_metadata || {};
      cachedUserName =
        (profile?.username && String(profile.username).trim()) ||
        (meta.full_name && String(meta.full_name).trim()) ||
        (meta.name && String(meta.name).trim()) ||
        session.user.email?.trim() ||
        "未知使用者";
      return cachedUserName;
    }
    function escapeHtml(str) {

        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");

      return `${now.getFullYear()}${p2(now.getMonth() + 1)}${p2(now.getDate())}${p2(now.getSeconds())}${p3(now.getMilliseconds())}${getFileExt(file)}`;
    }

    function generateSerialNumber() {

      const now = new Date();
      const p2 = (n) => String(n).padStart(2, "0");
      const yy = p2(now.getFullYear() % 100);
      const mm = p2(now.getMonth() + 1);
      const dd = p2(now.getDate());
      const rnd3 = String(Math.floor(Math.random() * 1000)).padStart(3, "0");
      const letter = () => String.fromCharCode(65 + Math.floor(Math.random() * 26));
      return `${tag}-${yy}${mm}${dd}-${rnd3}${letter()}${letter()}`;
    }

    queryMissingBtn.addEventListener("click", async () => {

      const vendor2 = vendor2Select.value.trim();
      const category = categorySelect.value.trim();
      const hasAnyFilter = Boolean(floor || loc1 || loc2 || loc3 || vendor2 || category);
      if (!hasAnyFilter) {
        showQueryWarning("請設置條件");
        return;
      }

      queryMissingBtn.disabled = true;
      queryWarningEl.textContent = "";
      showMissingResultRow(false);
      clearMissingList();

      updateToggleCompletedLabel();

      let query = supabase.from("records").select("編號, 分類, 樓層, 位置1, 位置2, 位置3, 廠商2, 說明, 照片, 來自, 勾選1, 勾選人1, 勾選時間1"); //清單資料輸出

      if (category) query = query.eq(DB_COLUMNS.category, category);

    missingListEl.addEventListener("change", async (e) => {
      const target = e.target;
      if (!(target instanceof HTMLInputElement) || !target.classList.contains("missing-check")) return;
      const rowSerial = (target.dataset.rowSerial || "").trim();
      if (!rowSerial) return;
      const checked = target.checked;
      target.disabled = true;
      const userName = await getSessionUserName();
      const operatedAt = getNowDateTimeISO();
      const patch = {
        勾選1: checked,
        [DB_COLUMNS.check1User]: userName,
        [DB_COLUMNS.check1Time]: operatedAt,
      };
      const { error } = await supabase.from("records").update(patch).eq(DB_COLUMNS.serial, rowSerial);
      target.disabled = false;
      if (error) {
        target.checked = !checked;
        setMissingStatus(`更新完成狀態失敗：${error.message || "未知錯誤"}`);
        return;
      }
      const cachedRow = missingRowsCache.find((r) => String(r[DB_COLUMNS.serial] ?? "").trim() === rowSerial);
      if (cachedRow) {
        cachedRow["勾選1"] = checked;
        cachedRow[DB_COLUMNS.check1User] = userName;
        cachedRow[DB_COLUMNS.check1Time] = operatedAt;
      }
      renderMissingList();
      setMissingStatus(checked ? "已更新為完成。" : "已取消完成。");
    });
    photoModalCloseEl.addEventListener("click", closePhotoModal);
    photoModalEl.addEventListener("click", (e) => {
      const target = e.target;
      if (target instanceof HTMLElement && target.classList.contains("photo-modal-backdrop")) closePhotoModal();
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const {
        data: { session },
      } = await supabase.auth.getSession();
      if (!session) {
        setStatus("請先登入。", "error");
        redirectToLogin();
        return;
      }

      const workZone = getWorkZoneTag();
      const serial = generateSerialNumber();
      serialInput.value = serial;
      const floor = floorSelect.value.trim();
      const category = categorySelect.value.trim();
      const loc1 = loc1Select.value.trim();
      const loc2 = loc2Select.value.trim();
      const loc3 = loc3Select.value.trim();
      const vendor1 = vendor1Select.value.trim();
      const vendor2 = vendor2Select.value.trim();
      const description = descriptionEl.value.trim();
      const photoFile = selectedPhotoFile;

      if (!floor || !category || !loc1 || !loc2 || !loc3 || !vendor1 || !vendor2 || !description) {
        setStatus("請完成樓層、分類、位置、廠商與說明。", "error");
        return;
      }
      if (!photoFile) {
        setStatus("請拍照或從相簿選擇照片。", "error");
        return;
      }

      submitBtn.disabled = true;
      startLoadingStatus("上傳照片中");
      const objectPath = `${STORAGE_OBJECT_PREFIX}/${generatePhotoObjectName(photoFile)}`;
      const { error: uploadError } = await supabase.storage.from(STORAGE_BUCKET).upload(objectPath, photoFile, {
        contentType: photoFile.type || "image/*",
        upsert: false,
      });
      stopLoadingStatus();
      if (uploadError) {
        submitBtn.disabled = false;
        setStatus(
          `【照片上傳】${uploadError.message || "失敗"}（若為 RLS，請在 Supabase 執行 storage_public_rls.sql）`,
          "error"
        );
        return;
      }

      const { data } = supabase.storage.from(STORAGE_BUCKET).getPublicUrl(objectPath);

      const { data: profile, error: profileError } = await supabase
        .from(PROFILE_TABLE)
        .select("username")
        .eq("id", session.user.id)
        .maybeSingle();

      if (profileError) {
        submitBtn.disabled = false;
        setStatus(`讀取使用者名稱失敗：${profileError.message}`, "error");
        return;
      }

      const meta = session.user.user_metadata || {};
      const userName =
        (profile?.username && String(profile.username).trim()) ||
        (meta.full_name && String(meta.full_name).trim()) ||
        (meta.name && String(meta.name).trim()) ||
        session.user.email?.trim() ||
        "未知使用者";

      const payload = {
        [DB_COLUMNS.serial]: serial,
        [DB_COLUMNS.work_zone]: workZone,
        [DB_COLUMNS.floor]: floor,
        [DB_COLUMNS.category]: category,
        [DB_COLUMNS.loc1]: loc1,
        [DB_COLUMNS.loc2]: loc2,
        [DB_COLUMNS.loc3]: loc3,
        [DB_COLUMNS.vendor1]: vendor1,
        [DB_COLUMNS.vendor2]: vendor2,
        [DB_COLUMNS.description]: description,
        [DB_COLUMNS.photo]: data?.publicUrl || objectPath,
        [DB_COLUMNS.from]: userName,
      };

      startLoadingStatus("送出中");
      const { error: insertError } = await supabase.from("records").insert([payload]);
      stopLoadingStatus();
      submitBtn.disabled = false;
      if (insertError) {
        setStatus(
          `【資料庫寫入】${insertError.message || "失敗"}（請確認已執行 records_rls.sql 且為登入狀態）`,
          "error"
        );
        return;
      }

      setStatus("已成功儲存。", "success");
      form.reset();
      clearPhotoInputs();
      resetSelect(loc2Select, "請先選擇 位置1");
      resetSelect(loc3Select, "請先選擇 位置2");
      resetSelect(vendor2Select, "請先選擇 廠商1");
      loc2Select.disabled = true;
      loc3Select.disabled = true;
      vendor2Select.disabled = true;
      serialInput.value = generateSerialNumber();
    });
  </script>
</body>
</html>
