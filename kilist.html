<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kilist</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4d;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #3d8bfd;
      --accent-hover: #5a9dff;
      --danger: #f87171;
      --ok: #4ade80;
      --pin: #f59e0b;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: radial-gradient(ellipse 120% 100% at 50% -20%, #1e3a5f 0%, var(--bg) 55%);
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      font-family: "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      font-size: 16px;
      color: var(--text);
      line-height: 1.5;
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    .page-header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      min-height: 38px;
    }

    .page-title {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-align: center;
    }

    .back-btn {
      position: absolute;
      left: 0;
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      background: transparent;
      font-family: inherit;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }

    .back-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
      background: rgba(61, 139, 253, 0.12);
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }

    .field-grid {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr) max-content minmax(0, 1fr) minmax(0, 4fr) max-content;
      column-gap: 10px;
      align-items: center;
    }

    .field-row {
      display: grid;
      grid-template-columns: subgrid;
      grid-column: 1 / -1;
      align-items: center;
      margin-bottom: 14px;
    }

    .field-row.filter-row {
      margin-bottom: 14px;
      border-top: 1px dashed var(--border);
      padding-top: 12px;
    }

    .filter-actions {
      grid-column: 5 / -1;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .filter-actions .checked-toggle-btn {
      margin-left: 0;
    }

    .clear-filter-btn {
      flex-shrink: 0;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      line-height: 1.2;
      height: 34px;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
    }

    .clear-filter-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(61, 139, 253, 0.12);
    }

    .checked-toggle-btn {
      flex-shrink: 0;
      margin-left: auto;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      line-height: 1.2;
      height: 34px;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
      white-space: nowrap;
    }

    .checked-toggle-btn:hover {
      border-color: var(--ok);
      color: var(--ok);
      background: rgba(74, 222, 128, 0.1);
    }

    .checked-toggle-btn.is-on {
      border-color: var(--ok);
      color: var(--ok);
      background: rgba(74, 222, 128, 0.12);
    }

    .vendor-edit-btn {
      flex-shrink: 0;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: transparent;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      line-height: 1.2;
      height: 34px;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
    }

    .vendor-edit-btn:hover {
      border-color: var(--accent);
      background: rgba(61, 139, 253, 0.12);
    }

    .vendor-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.55);
    }

    .vendor-modal.is-open {
      display: flex;
    }

    .vendor-modal-panel {
      width: min(420px, 100%);
      height: 80vh;
      max-height: calc(100vh - 32px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
    }

    .vendor-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .vendor-modal-header h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
    }

    .vendor-modal-close {
      width: 32px;
      height: 32px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
    }

    .vendor-modal-close:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    .vendor-modal-add {
      display: flex;
      gap: 8px;
    }

    .vendor-modal-add input {
      flex: 1;
      min-width: 0;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
    }

    .vendor-modal-add input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(61, 139, 253, 0.25);
    }

    .vendor-modal-add button {
      flex-shrink: 0;
      padding: 8px 14px;
      border: 1px solid var(--accent);
      border-radius: 10px;
      background: rgba(61, 139, 253, 0.12);
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
    }

    .vendor-modal-add button:hover {
      background: rgba(61, 139, 253, 0.25);
      color: #fff;
    }

    .vendor-modal-list {
      flex: 1;
      min-height: 0;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 2px;
    }

    .vendor-modal-empty {
      padding: 24px 8px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .vendor-modal-hint {
      margin: -4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .vendor-modal-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      user-select: none;
    }

    .vendor-modal-item.is-dragging {
      border-color: var(--accent);
      background: rgba(61, 139, 253, 0.16);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28);
    }

    .vendor-drag-handle {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: grab;
      touch-action: none;
    }

    .vendor-drag-handle svg {
      display: block;
      fill: currentColor;
    }

    .vendor-drag-handle:hover,
    .vendor-modal-item.is-dragging .vendor-drag-handle {
      color: var(--accent);
      background: rgba(61, 139, 253, 0.12);
    }

    .vendor-drag-handle:active,
    .vendor-modal-item.is-dragging .vendor-drag-handle {
      cursor: grabbing;
    }

    .vendor-modal-item span {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      word-break: break-word;
    }

    .vendor-delete-btn {
      flex-shrink: 0;
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--danger);
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
    }

    .vendor-delete-btn:hover {
      border-color: var(--danger);
      background: rgba(248, 113, 113, 0.12);
    }

    .field-row label {
      flex-shrink: 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
    }

    .field-row select,
    .field-row input[type="text"] {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
    }

    .field-row select {
      padding: 8px 12px;
      font-size: 13px;
      line-height: 1.2;
      height: 34px;
    }

    .field-row input[type="text"] {
      padding: 8px 12px;
      font-size: 13px;
      line-height: 1.2;
      height: 34px;
    }

    .field-row select:focus,
    .field-row input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(61, 139, 253, 0.25);
    }

    .field-row select:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .record-btn {
      flex-shrink: 0;
      padding: 8px 18px;
      border: 1px solid var(--accent);
      border-radius: 10px;
      background: rgba(61, 139, 253, 0.12);
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      line-height: 1.2;
      height: 34px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .record-btn:hover {
      background: rgba(61, 139, 253, 0.25);
      color: #fff;
    }

    @media (max-width: 560px) {
      .field-grid,
      .field-row {
        display: flex;
        flex-wrap: wrap;
      }

      .field-row select,
      .field-row input[type="text"] {
        flex: 1 1 140px;
        width: auto;
      }

      .filter-actions {
        flex: 1 1 auto;
        justify-content: flex-start;
      }
    }

    .empty-hint {
      padding: 32px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .record-board {
      position: relative;
    }

    .record-links {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
      z-index: 1;
    }

    .record-list {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-left: 28px;
      margin-right: 128px;
    }

    .record-order {
      position: absolute;
      top: 50%;
      left: 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      gap: 1px;
      transform: translate(calc(-100% - 6px), -50%);
    }

    .order-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 14px;
      padding: 0;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.55);
      cursor: pointer;
    }

    .order-btn:hover:not(:disabled) {
      color: #fff;
    }

    .order-btn:disabled {
      opacity: 0.22;
      cursor: default;
    }

    .record-item {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 4px 5px 4px 25px;
      border: 2px solid #636363; /*資料外框顏色*/
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      font-size: 15px;
      line-height: 1.3;
    }

    .link-dot {
      position: absolute;
      top: 50%;
      right: 0;
      width: 14px;
      height: 14px;
      margin: 0;
      padding: 0;
      appearance: none;
      border: 1.5px solid rgba(255, 255, 255, 0.55);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.16);
      box-shadow: none;
      transform: translate(50%, -50%);
      cursor: pointer;
      z-index: 3;
      transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
    }

    .link-dot:hover {
      background: rgba(255, 255, 255, 0.88);
      border-color: #fff;
      box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.18);
      transform: translate(50%, -50%) scale(1.2);
    }

    .link-dot.is-linked {
      background: rgba(255, 255, 255, 0.4);
      border-color: rgba(255, 255, 255, 0.92);
    }

    .link-dot.is-source,
    .link-dot.is-source:hover {
      background: #fff;
      border-color: #fff;
      box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.32);
      transform: translate(50%, -50%) scale(1.15);
    }

    .record-item.is-pinned {
      border-color: var(--pin);
      box-shadow: 0 0 0 1px rgba(245, 158, 11, 0.35);
    }

    .record-item.is-remind {
      border-color: var(--danger);
      box-shadow: 0 0 0 1px rgba(248, 113, 113, 0.35);
    }

    .record-item.is-checked {
      border-color: var(--ok);
    }

    .record-main {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 5px;
    }

    .record-item .record-content {
      flex: 1;
      min-width: 160px;
      word-break: break-word;
      font-weight: 600;
      text-align: left;
    }

    .record-item .record-time {
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .record-item .record-check-info {
      font-size: 12px;
      color: var(--ok);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .record-item .check-btn {
      flex-shrink: 0;
      align-self: center;
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
    }

    .record-item .check-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(61, 139, 253, 0.1);
    }

    .record-item .check-btn.is-checked {
      border-color: var(--ok);
      color: var(--ok);
      background: rgba(74, 222, 128, 0.12);
    }

    .record-item .edit-btn,
    .record-item .delete-btn,
    .record-item .remind-btn,
    .record-item .pin-btn {
      flex-shrink: 0;
      align-self: center;
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      line-height: 1.2;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
    }

    .record-item .edit-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(61, 139, 253, 0.12);
    }

    .record-item .remind-btn:hover,
    .record-item .remind-btn.is-on {
      border-color: var(--danger);
      color: var(--danger);
      background: rgba(248, 113, 113, 0.12);
    }

    .record-item .pin-btn:hover,
    .record-item .pin-btn.is-on {
      border-color: var(--pin);
      color: var(--pin);
      background: rgba(245, 158, 11, 0.14);
    }

    .record-item .delete-btn:hover {
      border-color: var(--danger);
      color: var(--danger);
      background: rgba(248, 113, 113, 0.12);
    }

    .record-edit-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      width: 100%;
      align-items: center;
    }

    .record-edit-row select,
    .record-edit-row input[type="text"] {
      min-width: 0;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.2;
      font-family: inherit;
      height: 34px;
    }

    .record-edit-row .edit-person,
    .record-edit-row .edit-item {
      flex: 1 1 0;
    }

    .record-edit-row .edit-note {
      flex: 4 1 0;
    }

    .record-edit-row .edit-save-btn,
    .record-edit-row .edit-cancel-btn {
      flex-shrink: 0;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
    }

    .record-edit-row .edit-save-btn {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .record-edit-row .edit-cancel-btn {
      background: transparent;
      color: var(--muted);
    }

    .record-notes {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .record-note-line {
      display: flex;
      align-items: flex-start;
      gap: 4px 12px;
      padding: 8px;
      border-left: 3px solid var(--border);
      font-size: 14px;
      line-height: 1.25;
    }

    .record-note-line.is-editing {
      flex-wrap: wrap;
    }

    .record-note-line .note-editor {
      flex: 1;
      min-width: 180px;
    }

    .record-note-line .note-edit-btn,
    .record-note-line .note-remove-btn {
      align-self: center;
    }

    .record-note-line + .record-note-line {
      border-top: 1px solid var(--border);
    }

    .record-note-line .note-meta {
      flex-shrink: 0;
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      padding-top: 1px;
    }

    .record-note-line .note-text {
      flex: 1;
      min-width: 0;
      color: #fff;
      text-align: left;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .notes-toggle-btn {
      align-self: flex-start;
      margin-left: 10px;
      padding: 2px 0;
      border: none;
      background: transparent;
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }

    .notes-toggle-btn:hover {
      text-decoration: underline;
    }

    .note-add-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      align-self: center;
    }

    .note-add-label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }

    .note-add-btn {
      width: 26px;
      height: 26px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(61, 139, 253, 0.18);
      color: var(--accent);
      font-size: 18px;
      font-weight: 700;
      font-family: inherit;
      line-height: 1;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
    }

    .note-add-btn:hover {
      background: var(--accent);
      color: #fff;
      transform: scale(1.08);
    }

    .note-add-actions {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 8px 18px;
    }

    .note-add-actions .open-item-draft {
      flex: 1;
      min-width: 0;
    }

    .note-add-btn.is-open {
      background: rgba(74, 222, 128, 0.18);
      color: var(--ok);
    }

    .note-add-btn.is-open:hover {
      background: var(--ok);
      color: #06210f;
    }

    .open-items {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin: 2px 0 2px 2px;
    }

    .open-item,
    .open-item-draft {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 28px;
    }

    .open-item-check {
      appearance: none;
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      margin: 0;
      flex-shrink: 0;
      border: 1px solid var(--muted);
      border-radius: 3px;
      background: var(--muted);
      cursor: pointer;
      display: inline-grid;
      place-content: center;
    }

    .open-item-check:checked {
      border-color: var(--ok);
      background: var(--ok);
    }

    .open-item-check:checked::after {
      content: "";
      width: 4px;
      height: 8px;
      margin-top: -2px;
      border: solid #06210f;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .open-item-check:disabled {
      cursor: default;
    }

    .open-item-text {
      flex: 1;
      min-width: 0;
      color: var(--muted);
      font-size: 14px;

</head>
<body>
  <div class="page">
    <header class="page-header">
      <a class="back-btn" href="./index.html">↩ 返回</a>
      <h1 class="page-title" id="page-title">Kilist</h1>
    </header>
    <div class="card">
      <div class="field-grid">
      <div class="field-row">
        <label for="person-select">承辦</label>
        <select id="person-select" disabled>
          <option value="">載入中…</option>
        </select>
        <label for="vendor-select">廠商</label>
        <select id="vendor-select" aria-label="廠商">
          <option value="">請選擇廠商</option>
        </select>
        <input type="text" id="note-input" placeholder="輸入內容" aria-label="輸入內容">
        <button type="button" id="record-btn" class="record-btn">紀錄</button>
      </div>
      <div class="field-row filter-row">
        <label for="filter-person">篩選承辦</label>
        <select id="filter-person" aria-label="篩選承辦">
          <option value="">全部承辦</option>
        </select>
        <label for="filter-vendor">篩選廠商</label>
        <select id="filter-vendor" aria-label="篩選廠商">
          <option value="">全部廠商</option>
        </select>
        <div class="filter-actions">
          <button type="button" id="clear-filter-btn" class="clear-filter-btn">清除篩選</button>
          <button type="button" id="vendor-edit-btn" class="vendor-edit-btn">編輯清單</button>
          <button type="button" id="checked-toggle-btn" class="checked-toggle-btn" aria-pressed="false">
            顯示已勾核
          </button>
        </div>
      </div>
      </div>
      <div class="record-board" id="record-board">
        <svg id="record-links" class="record-links" aria-hidden="true">
          <defs>
            <marker id="record-link-arrow" viewBox="0 0 16 16" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="14.5" refY="8" orient="auto">
              <path d="M1,3.2 L14.5,8 L1,12.8" fill="none" stroke="rgba(255,255,255,0.92)" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="miter"></path>
            </marker>
            <radialGradient id="record-link-grain" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="1"></stop>
              <stop offset="35%" stop-color="#ffffff" stop-opacity="0.9"></stop>
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0"></stop>
            </radialGradient>
          </defs>
          <g id="record-link-paths"></g>
        </svg>
        <div id="list" class="empty-hint">目前尚無資料</div>
      </div>
    </div>
  </div>

  <div id="vendor-modal" class="vendor-modal" aria-hidden="true">
    <div class="vendor-modal-panel" role="dialog" aria-modal="true" aria-labelledby="vendor-modal-title">
      <div class="vendor-modal-header">
        <h2 id="vendor-modal-title">編輯廠商清單</h2>
        <button type="button" id="vendor-modal-close" class="vendor-modal-close" aria-label="關閉">×</button>
      </div>
      <div class="vendor-modal-add">
        <input type="text" id="vendor-modal-input" placeholder="輸入廠商名稱" aria-label="廠商名稱">
        <button type="button" id="vendor-modal-add-btn">新增</button>
      </div>
      <p id="vendor-modal-hint" class="vendor-modal-hint" hidden>拖動左側把手可調整順序</p>
      <div id="vendor-modal-list" class="vendor-modal-list"></div>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://clcqnbnbbtzzuctaspfn.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_1PJYZvRhU8qgCnwit6EG7Q_xjKq49oD";
    const PROFILE_TABLE = "profiles";
    const KILIST_TABLE = "kilist_records";
    const KILIST_LINKS_TABLE = "kilist_links";
    const KILIST_COLUMNS = "id, work_zone, person_id, person_name, item, note, checked_by, checked_at, notes, is_remind, is_pinned, sort_order, created_at";

    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    });

    const pageTitleEl = document.getElementById("page-title");
    const personSelectEl = document.getElementById("person-select");
    const vendorSelectEl = document.getElementById("vendor-select");
    const filterPersonEl = document.getElementById("filter-person");
    const filterVendorEl = document.getElementById("filter-vendor");
    const clearFilterBtnEl = document.getElementById("clear-filter-btn");
    const vendorEditBtnEl = document.getElementById("vendor-edit-btn");
    const vendorModalEl = document.getElementById("vendor-modal");
    const vendorModalCloseEl = document.getElementById("vendor-modal-close");
    const vendorModalInputEl = document.getElementById("vendor-modal-input");
    const vendorModalAddBtnEl = document.getElementById("vendor-modal-add-btn");
    const vendorModalHintEl = document.getElementById("vendor-modal-hint");
    const vendorModalListEl = document.getElementById("vendor-modal-list");
    const checkedToggleBtnEl = document.getElementById("checked-toggle-btn");
    const noteInputEl = document.getElementById("note-input");
    const recordBtnEl = document.getElementById("record-btn");
    const listEl = document.getElementById("list");
    const recordBoardEl = document.getElementById("record-board");
    const recordLinksEl = document.getElementById("record-links");
    const recordLinkPathsEl = document.getElementById("record-link-paths");

    let showCheckedRecords = false;

    function syncCheckedToggleBtn() {
      checkedToggleBtnEl.textContent = showCheckedRecords ? "隱藏已勾核" : "顯示已勾核";
      checkedToggleBtnEl.classList.toggle("is-on", showCheckedRecords);
      checkedToggleBtnEl.setAttribute("aria-pressed", showCheckedRecords ? "true" : "false");
    }

    const VENDOR_STORAGE_KEY = "kilist:vendors";

    const workZone = String(new URLSearchParams(window.location.search).get("zone") || "").trim();
    const LINK_STORAGE_KEY = `kilist:links:${workZone || "_"}`;
    const ORDER_STORAGE_KEY = `kilist:order:${workZone || "_"}`;
    let recordLinks = [];
    let linkSourceId = "";

    function loadRecordLinks() {
      try {
        const parsed = JSON.parse(localStorage.getItem(LINK_STORAGE_KEY) || "[]");
        recordLinks = Array.isArray(parsed)
          ? parsed.filter((link) => link && link.from && link.to && link.from !== link.to)
          : [];
      } catch {
        recordLinks = [];
      }
    }

    function saveRecordLinks() {
      try {
        localStorage.setItem(LINK_STORAGE_KEY, JSON.stringify(recordLinks));
      } catch (err) {
        console.warn("儲存清單連線失敗", err);
      }
    }

    function clearLocalRecordLinks() {
      try {
        localStorage.removeItem(LINK_STORAGE_KEY);
      } catch (_) {}
    }

    let linksSupported = true;
    let savingLink = false;

    function validRecordLinks(links) {
      const ids = new Set(records.map((record) => record.id));
      return links.filter((link) => link && ids.has(link.from) && ids.has(link.to) && link.from !== link.to);
    }

    async function uploadRecordLinks(links) {
      if (!linksSupported) throw new Error("kilist_links");
      if (!workZone || !links.length) return;
      const rows = links.map((link) => ({
        work_zone: workZone,
        from_id: link.from,
        to_id: link.to
      }));
      const { error } = await sb
        .from(KILIST_LINKS_TABLE)
        .upsert(rows, { onConflict: "work_zone,from_id,to_id", ignoreDuplicates: true });
      if (error) throw new Error(error.message);
    }

    async function syncRecordLinks() {
      if (!workZone && !viewerAllZones) return;
      let linkQuery = sb.from(KILIST_LINKS_TABLE).select("from_id, to_id");
      if (!(viewerAllZones && (!workZone || workZone === "0"))) {
        linkQuery = linkQuery.eq("work_zone", workZone);
      }
      const query = await linkQuery;
      if (query.error) {
        const message = query.error.message || "";
        if (/kilist_links|42P01|PGRST205/i.test(message)) {
          linksSupported = false;
          if (recordLinks.length) {
            alert("弧線尚未同步到伺服器，請至 Supabase Dashboard → SQL Editor 執行 SQL/kilist_records.sql");
          }
          return;
        }
        console.error("讀取弧線失敗", query.error);
        return;
      }
      linksSupported = true;
      const serverLinks = validRecordLinks((query.data || []).map((row) => ({
        from: String(row.from_id || ""),
        to: String(row.to_id || "")
      })));
      const localLinks = validRecordLinks(recordLinks);
      if (!serverLinks.length && localLinks.length) {
        recordLinks = localLinks;
        try {
          await uploadRecordLinks(localLinks);
          clearLocalRecordLinks();
        } catch (err) {
          console.error("上傳既有弧線失敗", err);
          alert(`上傳既有弧線失敗：${formatSupabaseError(err)}`);
          saveRecordLinks();
        }
        return;
      }
      recordLinks = serverLinks;
      clearLocalRecordLinks();
    }

    let recordOrder = [];
    let sortOrderSupported = true;
    let movingRecord = false;

    function loadRecordOrder() {
      try {
        const parsed = JSON.parse(localStorage.getItem(ORDER_STORAGE_KEY) || "[]");
        recordOrder = Array.isArray(parsed) ? parsed.filter((id) => typeof id === "string" && id) : [];
      } catch {
        recordOrder = [];
      }
    }

    function clearLocalRecordOrder() {
      recordOrder = [];
      try {
        localStorage.removeItem(ORDER_STORAGE_KEY);
      } catch (_) {}
    }

    function orderTier(record) {
      if (record?.isPinned) return 2;
      if (isRemindHighlight(record)) return 1;
      return 0;
    }

    function compareRecords(a, b) {
      const tierA = orderTier(a);
      const tierB = orderTier(b);
      if (tierA !== tierB) return tierB - tierA;
      const orderA = Number.isFinite(a.sortOrder) ? a.sortOrder : null;
      const orderB = Number.isFinite(b.sortOrder) ? b.sortOrder : null;
      if (orderA == null && orderB == null) {
        return new Date(a.createdAt || 0).getTime() - new Date(b.createdAt || 0).getTime();
      }
      if (orderA == null) return 1;
      if (orderB == null) return -1;
      if (orderA !== orderB) return orderA - orderB;
      return new Date(a.createdAt || 0).getTime() - new Date(b.createdAt || 0).getTime();
    }

    async function uploadSortOrders(list) {
      if (!sortOrderSupported) {
        throw new Error("sort_order");
      }
      await Promise.all(list.map(async (record) => {
        const { error } = await sb
          .from(KILIST_TABLE)
          .update({ sort_order: record.sortOrder })
          .eq("id", record.id);
        if (error) throw new Error(error.message);
      }));
    }

    async function moveRecord(index, delta) {
      if (movingRecord) return;
      const entries = getFilteredRecordEntries();
      const pos = entries.findIndex((entry) => entry.index === index);
      const nextPos = pos + delta;
      if (pos < 0 || nextPos < 0 || nextPos >= entries.length) return;
      const current = entries[pos].r;
      const neighbor = entries[nextPos].r;
      if (!current || !neighbor || orderTier(current) !== orderTier(neighbor)) return;
      const previous = records.map((record) => record.sortOrder);
      const ordered = [...records].sort(compareRecords);
      if (ordered.some((record) => !Number.isFinite(record.sortOrder))) {
        ordered.forEach((record, orderIndex) => {
          record.sortOrder = (orderIndex + 1) * 10;
        });
      }
      const currentOrder = current.sortOrder;
      current.sortOrder = neighbor.sortOrder;
      neighbor.sortOrder = currentOrder;
      renderRecords();
      movingRecord = true;
      try {
        const changed = ordered.filter((record, orderIndex) => record.sortOrder !== previous[records.indexOf(record)]);
        const payload = changed.length ? changed : [current, neighbor];
        await uploadSortOrders(payload);
        clearLocalRecordOrder();
      } catch (err) {
        console.error("上傳清單順序失敗", err);
        alert(`上傳清單順序失敗：${formatSupabaseError(err)}`);
        records.forEach((record, recordIndex) => {
          record.sortOrder = previous[recordIndex];
        });
        renderRecords();
      } finally {
        movingRecord = false;
      }
    }

    function recordHasLink(id) {
      return recordLinks.some((link) => link.from === id || link.to === id);
    }

    function pruneRecordLinks() {
      const ids = new Set(records.map((record) => record.id));
      const next = recordLinks.filter((link) => ids.has(link.from) && ids.has(link.to));
      if (linkSourceId && !ids.has(linkSourceId)) linkSourceId = "";
      if (next.length === recordLinks.length) return;
      const removed = recordLinks.filter((link) => !ids.has(link.from) || !ids.has(link.to));
      recordLinks = next;
      if (!linksSupported || !workZone) {
        saveRecordLinks();
        return;
      }
      removed.forEach((link) => {
        sb.from(KILIST_LINKS_TABLE)
          .delete()
          .eq("work_zone", workZone)
          .eq("from_id", link.from)
          .eq("to_id", link.to)
          .then(({ error }) => {
            if (error) console.warn("刪除失效弧線失敗", error);
          });
      });
    }
    if (workZone && workZone !== "0") {
      pageTitleEl.textContent = `Kilist（工區 ${workZone}）`;
      document.title = `Kilist（工區 ${workZone}）`;
    }

    let zonePersons = [];
    let vendorList = [];

    function loadVendorList() {
      try {
        const raw = localStorage.getItem(VENDOR_STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        vendorList = Array.isArray(parsed)
          ? parsed.map((v) => String(v || "").trim()).filter(Boolean)
          : [];
      } catch {
        vendorList = [];
      }
    }

    function saveVendorList() {
      try {
        localStorage.setItem(VENDOR_STORAGE_KEY, JSON.stringify(vendorList));
      } catch (err) {
        console.warn("儲存廠商清單失敗", err);
      }
    }

    function mergeVendorsFromRecords(rows) {
      const known = new Set(vendorList);
      let changed = false;
      (rows || []).forEach((row) => {
        const name = String(row.item || "").trim();
        if (name && !known.has(name)) {
          known.add(name);
          vendorList.push(name);
          changed = true;
        }
      });
      if (changed) saveVendorList();
    }

    function fillVendorSelect(selectEl, selectedValue, options = {}) {
      const {
        placeholder = "請選擇廠商",
        allowEmpty = true
      } = options;
      const prev = selectedValue != null ? String(selectedValue) : selectEl.value;
      selectEl.innerHTML = "";
      if (allowEmpty) {
        const first = document.createElement("option");
        first.value = "";
        first.textContent = placeholder;
        selectEl.appendChild(first);
      }
      vendorList.forEach((name) => {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        selectEl.appendChild(option);
      });
      if (prev && [...selectEl.options].some((o) => o.value === prev)) {
        selectEl.value = prev;
      } else {
        selectEl.value = "";
      }
    }

    function refreshVendorSelects(preserveFilter = true) {
      const filterPrev = preserveFilter ? filterVendorEl.value : "";
      fillVendorSelect(vendorSelectEl, vendorSelectEl.value, {
        placeholder: "請選擇廠商"
      });
      fillVendorSelect(filterVendorEl, filterPrev, {
        placeholder: "全部廠商"
      });
    }

    function renderVendorModalList() {
      if (vendorModalHintEl) vendorModalHintEl.hidden = !vendorList.length;
      if (!vendorList.length) {
        vendorModalListEl.innerHTML = `<div class="vendor-modal-empty">目前尚無廠商，請於上方新增</div>`;
        return;
      }
      vendorModalListEl.innerHTML = vendorList
        .map(
          (name, index) => `
          <div class="vendor-modal-item" data-vendor-name="${escapeHtml(name)}">
            <button type="button" class="vendor-drag-handle" draggable="true" aria-label="拖動排序「${escapeHtml(name)}」">
              <svg width="14" height="18" viewBox="0 0 14 18" aria-hidden="true" focusable="false">
                <circle cx="4" cy="3.2" r="1.35"></circle>
                <circle cx="10" cy="3.2" r="1.35"></circle>
                <circle cx="4" cy="9" r="1.35"></circle>
                <circle cx="10" cy="9" r="1.35"></circle>
                <circle cx="4" cy="14.8" r="1.35"></circle>
                <circle cx="10" cy="14.8" r="1.35"></circle>
              </svg>
            </button>
            <span>${escapeHtml(name)}</span>
            <button type="button" class="vendor-delete-btn" data-vendor-index="${index}">刪除</button>
          </div>`
        )
        .join("");
    }

    let vendorDrag = null;

    function commitVendorOrderFromDom() {
      const names = [...vendorModalListEl.querySelectorAll(".vendor-modal-item")]
        .map((item) => item.dataset.vendorName || "");
      if (!names.length || names.length !== vendorList.length || names.some((name) => !name)) return;
      if (names.every((name, index) => name === vendorList[index])) return;
      vendorList = names;
      saveVendorList();
      refreshVendorSelects();
      vendorModalListEl.querySelectorAll(".vendor-delete-btn").forEach((btn, index) => {
        btn.dataset.vendorIndex = String(index);
      });
    }

    function moveVendorDragItem(clientY) {
      if (!vendorDrag) return;
      const item = vendorDrag.item;
      const listRect = vendorModalListEl.getBoundingClientRect();
      if (clientY < listRect.top + 32) vendorModalListEl.scrollTop -= 16;
      else if (clientY > listRect.bottom - 32) vendorModalListEl.scrollTop += 16;

      const items = [...vendorModalListEl.querySelectorAll(".vendor-modal-item")];
      const dragIndex = items.indexOf(item);
      if (dragIndex < 0 || !items.length) return;
      const firstRect = items[0].getBoundingClientRect();
      const lastRect = items[items.length - 1].getBoundingClientRect();
      let targetIndex = dragIndex;
      if (clientY <= firstRect.top) {
        targetIndex = 0;
      } else if (clientY >= lastRect.bottom) {
        targetIndex = items.length - 1;
      } else {
        for (let i = 0; i < items.length; i += 1) {
          if (i === dragIndex) continue;
          const rect = items[i].getBoundingClientRect();
          const mid = rect.top + rect.height / 2;
          if (i < dragIndex && clientY < mid) {
            targetIndex = i;
            break;
          }
          if (i > dragIndex && clientY > mid) targetIndex = i;
        }
      }
      if (targetIndex === dragIndex) return;
      const target = items[targetIndex];
      if (dragIndex < targetIndex) target.after(item);
      else target.before(item);
    }

    async function loadRecords() {
      if (!workZone && !viewerAllZones) {
        renderRecords();

      try {
        let columns = KILIST_COLUMNS;
        let query = await scopeKilistZone(
          sb.from(KILIST_TABLE).select(columns)
        ).order("created_at", { ascending: true });
        if (query.error && /sort_order/i.test(query.error.message || "")) {
          sortOrderSupported = false;
          columns = KILIST_COLUMNS.replace(", sort_order", "");
          query = await scopeKilistZone(
            sb.from(KILIST_TABLE).select(columns)
          ).order("created_at", { ascending: true });
        }
        if (query.error) throw new Error(query.error.message);
        records.length = 0;
        (query.data || []).forEach((row) => records.push(normalizeRow(row)));
        const importedLocalOrder = applyImportedLocalOrder();
        mergeVendorsFromRecords(records);
        refreshVendorSelects();
        await syncRecordLinks();
        renderRecords();
        if (importedLocalOrder && sortOrderSupported) {
          try {
            await uploadSortOrders(records);
            clearLocalRecordOrder();
          } catch (err) {
            console.error("上傳既有清單順序失敗", err);
            alert(`上傳既有清單順序失敗：${formatSupabaseError(err)}`);
