        console.error("讀取紀錄失敗", err);
        listEl.className = "empty-hint";
        listEl.textContent = `紀錄載入失敗：${formatSupabaseError(err)}`;
      }
    }

    function applyImportedLocalOrder() {
      if (!recordOrder.length || records.some((record) => Number.isFinite(record.sortOrder))) {
        if (records.some((record) => Number.isFinite(record.sortOrder))) clearLocalRecordOrder();
        return false;
      }
      const byId = new Map(records.map((record) => [record.id, record]));
      const sequence = [];
      const seen = new Set();
      recordOrder.forEach((id) => {
        const record = byId.get(id);
        if (!record || seen.has(record)) return;
        sequence.push(record);
        seen.add(record);
      });
      records
        .filter((record) => !seen.has(record))
        .sort((a, b) => new Date(a.createdAt || 0).getTime() - new Date(b.createdAt || 0).getTime())
        .forEach((record) => sequence.push(record));
      sequence.forEach((record, index) => {
        record.sortOrder = (index + 1) * 10;
      });
      return true;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function pad2(n) {
      return n < 10 ? "0" + n : String(n);
    }

    function formatTime(date) {
      return `${date.getFullYear()}/${pad2(date.getMonth() + 1)}/${pad2(date.getDate())} ${pad2(date.getHours())}:${pad2(date.getMinutes())}`;
    }

    function formatTs(iso) {
      if (!iso) return "";
      const date = new Date(iso);
      return Number.isNaN(date.getTime()) ? "" : formatTime(date);
    }

    let linkDrawFrame = 0;
    let linkParticleFrame = 0;

    function scheduleDrawLinks() {
      window.cancelAnimationFrame(linkDrawFrame);
      linkDrawFrame = window.requestAnimationFrame(drawRecordLinks);
    }

    function linkPoint(dot, boardRect) {
      const rect = dot.getBoundingClientRect();
      return {
        x: rect.left + rect.width / 2 - boardRect.left,
        y: rect.top + rect.height / 2 - boardRect.top
      };
    }

    function shortenToward(from, to, distance) {
      const dx = to.x - from.x;
      const dy = to.y - from.y;
      const length = Math.hypot(dx, dy) || 1;
      return {
        x: to.x - (dx / length) * distance,
        y: to.y - (dy / length) * distance
      };
    }

    function circleArc(start, through, end) {
      const ax = start.x;
      const ay = start.y;
      const bx = through.x;
      const by = through.y;
      const cx = end.x;
      const cy = end.y;
      const d = 2 * (ax * (by - cy) + bx * (cy - ay) + cx * (ay - by));
      if (!Number.isFinite(d) || Math.abs(d) < 0.01) {
        return `L ${cx.toFixed(1)} ${cy.toFixed(1)}`;
      }
      const a2 = ax * ax + ay * ay;
      const b2 = bx * bx + by * by;
      const c2 = cx * cx + cy * cy;
      const ux = (a2 * (by - cy) + b2 * (cy - ay) + c2 * (ay - by)) / d;
      const uy = (a2 * (cx - bx) + b2 * (ax - cx) + c2 * (bx - ax)) / d;
      const radius = Math.hypot(ax - ux, ay - uy);
      const cross = (bx - ax) * (cy - ay) - (by - ay) * (cx - ax);
      const sweep = cross > 0 ? 1 : 0;
      return `A ${radius.toFixed(1)} ${radius.toFixed(1)} 0 0 ${sweep} ${cx.toFixed(1)} ${cy.toFixed(1)}`;
    }

    function drawRecordLinks() {
      if (!recordLinkPathsEl || !recordBoardEl) return;
      if (!listEl.classList.contains("record-list")) {
        recordLinkPathsEl.innerHTML = "";
        window.cancelAnimationFrame(linkParticleFrame);
        return;
      }
      const boardRect = recordBoardEl.getBoundingClientRect();
      const points = new Map();
      listEl.querySelectorAll(".link-dot").forEach((dot) => {
        if (dot.dataset.id) points.set(dot.dataset.id, linkPoint(dot, boardRect));
      });
      const drawable = [];
      recordLinks.forEach((link) => {
        const start = points.get(link.from);
        const end = points.get(link.to);
        if (!start || !end) return;
        const dy = Math.abs(end.y - start.y);
        drawable.push({ start, end, dy });
      });
      const nearestDy = drawable.reduce((min, link) => link.dy > 0 ? Math.min(min, link.dy) : min, Infinity);
      const baseRight = Number.isFinite(nearestDy) ? nearestDy * 0.1 : 0;
      recordLinkPathsEl.innerHTML = drawable.map((link) => {
        const origin = { x: link.start.x, y: link.start.y };
        const target = { x: link.end.x, y: link.end.y };
        const scale = nearestDy > 0 && link.dy > 0 ? link.dy / nearestDy : 1;
        const right = Math.min(baseRight * scale * 1.5, 345);
        const through = {
          x: (origin.x + target.x) / 2 + right,
          y: (origin.y + target.y) / 2
        };
        const tip = shortenToward(through, target, 7);
        const path = `M ${origin.x.toFixed(1)} ${origin.y.toFixed(1)} ${circleArc(origin, through, tip)}`;
        return `<path class="record-link-line" d="${path}" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.6" marker-end="url(#record-link-arrow)"></path><circle class="record-link-particle" r="2.6" fill="url(#record-link-grain)"></circle><circle class="record-link-particle" r="2.6" fill="url(#record-link-grain)"></circle>`;
      }).join("");
      window.cancelAnimationFrame(linkParticleFrame);
      const particles = [...recordLinkPathsEl.querySelectorAll(".record-link-particle")];
      const motions = [...recordLinkPathsEl.querySelectorAll(".record-link-line")].map((line, index) => {
        const pair = particles.slice(index * 2, index * 2 + 2);
        const length = line.getTotalLength();
        return pair.length === 2 && length ? { line, particles: pair, length, duration: Math.max(1200, length * 4.5) * 4 } : null;
      }).filter(Boolean);
      if (!motions.length) return;
      const started = performance.now();
      const moveParticles = (now) => {
        motions.forEach((item) => {
          item.particles.forEach((particle, index) => {
            if (!particle.isConnected) return;
            const progress = ((now - started) / item.duration + index * 0.5) % 1;
            const point = item.line.getPointAtLength(item.length * progress);
            particle.setAttribute("cx", point.x.toFixed(1));
            particle.setAttribute("cy", point.y.toFixed(1));
          });
        });
        if (motions.some((item) => item.particles.some((particle) => particle.isConnected))) {
          linkParticleFrame = window.requestAnimationFrame(moveParticles);
        }
      };
      linkParticleFrame = window.requestAnimationFrame(moveParticles);
    }

    function refreshLinkDots() {
      listEl.querySelectorAll(".link-dot").forEach((dot) => {
        const id = dot.dataset.id || "";
        const isSource = id === linkSourceId;
        dot.classList.toggle("is-source", isSource);
        dot.classList.toggle("is-linked", recordHasLink(id));
        dot.setAttribute("aria-pressed", isSource ? "true" : "false");
        if (isSource) dot.title = "再點一次可取消選取";
        else if (linkSourceId) dot.title = "點此完成連線";
        else dot.title = "點此開始連線";
      });
    }

    async function toggleRecordLink(id) {
      if (!id || savingLink) return;
      if (!linkSourceId) {
        linkSourceId = id;
        refreshLinkDots();
        return;
      }
      if (linkSourceId === id) {
        linkSourceId = "";
        refreshLinkDots();
        return;
      }
      const from = linkSourceId;
      const existing = recordLinks.findIndex((link) => link.from === from && link.to === id);
      const removed = existing >= 0;
      if (removed) recordLinks.splice(existing, 1);
      else recordLinks.push({ from, to: id });
      linkSourceId = "";
      refreshLinkDots();
      scheduleDrawLinks();
      if (!workZone || !linksSupported) {
        saveRecordLinks();
        if (workZone && !linksSupported) {
          alert("弧線尚未同步到伺服器，請至 Supabase Dashboard → SQL Editor 執行 SQL/kilist_records.sql");
        }
        return;
      }
      savingLink = true;
      try {
        if (removed) {
          const { error } = await sb
            .from(KILIST_LINKS_TABLE)
            .delete()
            .eq("work_zone", workZone)
            .eq("from_id", from)
            .eq("to_id", id);
          if (error) throw new Error(error.message);
        } else {
          const { error } = await sb
            .from(KILIST_LINKS_TABLE)
            .insert({ work_zone: workZone, from_id: from, to_id: id });
          if (error) throw new Error(error.message);
        }
        clearLocalRecordLinks();
      } catch (err) {
        console.error("上傳弧線失敗", err);
        if (removed) recordLinks.push({ from, to: id });
        else {
          const index = recordLinks.findIndex((link) => link.from === from && link.to === id);
          if (index >= 0) recordLinks.splice(index, 1);
        }
        refreshLinkDots();
        scheduleDrawLinks();
        alert(`上傳弧線失敗：${formatSupabaseError(err)}`);
      } finally {
        savingLink = false;
      }
    }

    const NOTE_PENCIL_SVG = `<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M9.7 2.3 13.7 6.3 5.1 14.9 1.1 15.3 1.5 11.3 9.7 2.3Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path><path d="M8.4 3.6 12.4 7.6" fill="none" stroke="currentColor" stroke-width="1.4"></path></svg>`;

    function buildNoteEditorHtml(index, noteIndex = -1) {
      const editing = noteIndex >= 0;
      const inputClass = editing ? "note-input note-edit-input" : "note-input";
      const confirmClass = editing ? "note-confirm-btn note-edit-confirm" : "note-confirm-btn";
      const cancelClass = editing ? "note-cancel-btn note-edit-cancel" : "note-cancel-btn";
      const noteAttr = editing ? ` data-note-index="${noteIndex}"` : "";
      return `<div class="note-editor">
        <div class="note-toolbar" role="toolbar" aria-label="文字格式">
          <label class="note-tool-size" title="文字大小">Aa
            <select class="note-size" aria-label="文字大小">
              <option value="200%">+100%</option>
              <option value="175%">+75%</option>
              <option value="150%">+50%</option>
              <option value="125%">+25%</option>
              <option value="100%" selected>+0%</option>
            </select>
          </label>
          <button type="button" data-cmd="bold" aria-label="粗體" title="粗體" aria-pressed="false"><b>B</b></button>
          <button type="button" data-cmd="italic" aria-label="斜體" title="斜體" aria-pressed="false"><i>I</i></button>
          <button type="button" data-cmd="underline" aria-label="底線" title="底線" aria-pressed="false"><u>U</u></button>
          <label class="note-tool-color" title="顏色">
            <span class="note-color-mark" aria-hidden="true">A</span>
            <input type="color" class="note-color" value="#ffffff" aria-label="顏色">
          </label>
          <button type="button" data-cmd="outdent" aria-label="減少縮排" title="減少縮排">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
              <path d="M6 3h8M6 8h8M6 13h8M4 5.2 1.6 8 4 10.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </button>
          <button type="button" data-cmd="indent" aria-label="增加縮排" title="增加縮排">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
              <path d="M2 3h8M2 8h8M2 13h8M12 5.2 14.4 8 12 10.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </button>
        </div>
        <div class="note-add-row">
          <div class="${inputClass}" contenteditable="true" role="textbox" aria-multiline="true" data-index="${index}"${noteAttr} data-empty="true" data-placeholder="輸入補充說明（可換行，Ctrl+Enter 送出）" aria-label="補充說明"></div>
          <div class="note-actions">
            <button type="button" class="${confirmClass}" data-index="${index}"${noteAttr}>確定</button>
            <button type="button" class="${cancelClass}" data-index="${index}"${noteAttr}>取消</button>
          </div>
        </div>
      </div>`;
    }

    function renderRecords() {
      if (!records.length) {
        listEl.className = "empty-hint";
        listEl.textContent = "目前尚無資料";
        scheduleDrawLinks();
        return;
      }
      const entries = getFilteredRecordEntries();
      if (!entries.length) {
        listEl.className = "empty-hint";
        listEl.textContent = "沒有符合篩選條件的資料";
        scheduleDrawLinks();
        return;
      }
      pruneRecordLinks();
      listEl.className = "record-list";
      listEl.innerHTML = entries
        .map(({ r, index }) => {
          const content = [r.person, r.item, r.note].filter(Boolean).join(" | ");
          const checkInfo = r.checkedBy
            ? `<span class="record-check-info">✓ ${escapeHtml(r.checkedBy)} ${escapeHtml(formatTs(r.checkedAt))}</span>`
            : "";
          const displayNotes = notesNewestFirst(supplementalNotes(r.notes));
          const NOTES_PREVIEW = 3;
          const hasMoreNotes = displayNotes.length > NOTES_PREVIEW;
          const visibleNotes = r.notesExpanded || !hasMoreNotes
            ? displayNotes
            : displayNotes.slice(0, NOTES_PREVIEW);
          const hiddenCount = displayNotes.length - NOTES_PREVIEW;
          const notesToggleHtml = hasMoreNotes
            ? `<button type="button" class="notes-toggle-btn" data-index="${index}">
                ${r.notesExpanded ? "收合" : `展開其餘 ${hiddenCount} 筆`}
              </button>`
            : "";
          const notesHtml = displayNotes.length
            ? `<div class="record-notes">${visibleNotes
                .map((note) => {
                  const sourceIndex = r.notes.indexOf(note);
                  const editingNote = r.editingNoteIndex === sourceIndex;
                  return `
                  <div class="record-note-line${editingNote ? " is-editing" : ""}">
                    <span class="note-meta">${escapeHtml(note.by || "")} ${escapeHtml(formatTs(note.at))}</span>
                    ${editingNote
                      ? buildNoteEditorHtml(index, sourceIndex)
                      : `<span class="note-text">${renderNoteText(note.text)}</span>
                         <button type="button" class="note-edit-btn" data-index="${index}" data-note-index="${sourceIndex}" aria-label="編輯補充說明" title="編輯補充說明">${NOTE_PENCIL_SVG}</button>`}
                    <button type="button" class="note-remove-btn" data-index="${index}" data-note-index="${sourceIndex}" aria-label="刪除補充說明">×</button>
                  </div>`;
                })
                .join("")}${notesToggleHtml}</div>`
            : "";
          const noteEditor = r.isAddingNote
            ? buildNoteEditorHtml(index)
            : `<div class="note-add-actions">
                <div class="note-add-wrap">
                  <button type="button" class="note-add-btn" data-index="${index}" aria-label="新增補充說明">＋</button>
                  <span class="note-add-label">補充說明</span>
                </div>
                ${r.isAddingOpen
                  ? `<div class="open-item-draft">
                      <input type="checkbox" class="open-item-check" disabled aria-hidden="true">
                      <input type="text" class="open-item-input" data-index="${index}" placeholder="輸入開項說明" aria-label="開項說明">
                      <button type="button" class="note-confirm-btn open-item-confirm" data-index="${index}">確定</button>
                      <button type="button" class="note-cancel-btn open-item-cancel" data-index="${index}">取消</button>
                    </div>`
                  : `<div class="note-add-wrap">
                      <button type="button" class="note-add-btn is-open open-add-btn" data-index="${index}" aria-label="新增開項">＋</button>
                      <span class="note-add-label">新增開項</span>
                    </div>`}
              </div>`;

          const openItems = openItemsOf(r.notes);
          const openItemsHtml = openItems.length
            ? `<div class="open-items">${openItems.map((item) => {
                const editingItem = r.editingOpenId === item.id;
                const openId = escapeHtml(item.id || "");
                return `
                <div class="open-item${item.checked ? " is-checked" : ""}">
                  <input type="checkbox" class="open-item-check" data-index="${index}" data-open-id="${openId}" ${item.checked ? "checked" : ""} ${editingItem ? "disabled" : ""} aria-label="勾核開項">
                  ${editingItem
                    ? `<input type="text" class="open-item-input open-item-edit-input" data-index="${index}" data-open-id="${openId}" value="${escapeHtml(item.text || "")}" aria-label="編輯開項說明">
                       <button type="button" class="note-confirm-btn open-item-edit-confirm" data-index="${index}" data-open-id="${openId}">確定</button>
                       <button type="button" class="note-cancel-btn open-item-edit-cancel" data-index="${index}" data-open-id="${openId}">取消</button>`
                    : `<span class="open-item-text">${escapeHtml(item.text || "")}</span>
                       ${item.checked ? `<span class="open-item-check-info">${escapeHtml(item.checkedBy || "")} ${escapeHtml(formatTs(item.checkedAt))}</span>` : ""}
                       <button type="button" class="open-item-edit" data-index="${index}" data-open-id="${openId}" aria-label="編輯開項" title="編輯開項">
                         <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M9.7 2.3 13.7 6.3 5.1 14.9 1.1 15.3 1.5 11.3 9.7 2.3Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path><path d="M8.4 3.6 12.4 7.6" fill="none" stroke="currentColor" stroke-width="1.4"></path></svg>
                       </button>`}
                  <button type="button" class="open-item-remove" data-index="${index}" data-open-id="${openId}" aria-label="刪除開項">×</button>
                </div>`;
              }).join("")}</div>`
            : "";

          const mainContent = r.isEditing
            ? `<div class="record-edit-row">
                <select class="edit-person" data-index="${index}" aria-label="承辦">${buildPersonOptionsHtml(r.personId, r.person)}</select>
                <select class="edit-item" data-index="${index}" aria-label="廠商">${buildVendorOptionsHtml(r.item)}</select>
                <input type="text" class="edit-note" data-index="${index}" value="${escapeHtml(r.note)}" placeholder="內容" aria-label="內容">
                <button type="button" class="edit-save-btn" data-index="${index}">儲存</button>
                <button type="button" class="edit-cancel-btn" data-index="${index}">取消</button>
              </div>`
            : `<span class="record-content">${escapeHtml(content)}</span>
              <span class="record-time">${escapeHtml(formatTs(r.createdAt))}</span>
              ${checkInfo}
              <button type="button" class="edit-btn" data-index="${index}">編輯</button>
              <button type="button" class="check-btn ${r.checkedBy ? "is-checked" : ""}" data-index="${index}">
                ${r.checkedBy ? "已勾核" : "勾核"}
              </button>
              <button type="button" class="remind-btn ${r.isRemind ? "is-on" : ""}" data-index="${index}">
                ${r.isRemind ? "取消提醒" : "提醒"}
              </button>
              ${canPinRecords()
                ? `<button type="button" class="pin-btn ${r.isPinned ? "is-on" : ""}" data-index="${index}">
                    ${r.isPinned ? "取消置頂" : "置頂"}
                  </button>`
                : ""}
              ${canDeleteRecords() ? `<button type="button" class="delete-btn" data-index="${index}">刪除</button>` : ""}`;

          const itemClass = [
            "record-item",
            r.isPinned ? "is-pinned" : "",
            isRemindHighlight(r) ? "is-remind" : "",
            r.checkedBy ? "is-checked" : ""
          ].filter(Boolean).join(" ");

          const pos = entries.findIndex((entry) => entry.index === index);
          const canUp = pos > 0 && orderTier(entries[pos - 1].r) === orderTier(r);
          const canDown = pos >= 0 && pos < entries.length - 1 && orderTier(entries[pos + 1].r) === orderTier(r);
          const linkTitle = linkSourceId === r.id
            ? "再點一次可取消選取"
            : linkSourceId
              ? "點此完成連線"
              : "點此開始連線";
          return `
          <div class="${itemClass}">
            <div class="record-order">
              <button type="button" class="order-btn order-up" data-index="${index}" aria-label="上移" title="上移" ${canUp ? "" : "disabled"}>
                <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3.2 10.2 8 5.2 12.8 10.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
              </button>
              <button type="button" class="order-btn order-down" data-index="${index}" aria-label="下移" title="下移" ${canDown ? "" : "disabled"}>
                <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3.2 5.8 8 10.8 12.8 5.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
              </button>
            </div>
            <button type="button" class="${linkDotClass(r.id)}" data-id="${escapeHtml(r.id)}" aria-label="連線" aria-pressed="${linkSourceId === r.id ? "true" : "false"}" title="${escapeHtml(linkTitle)}"></button>
            <div class="record-main">
              ${mainContent}
            </div>
            ${openItemsHtml}
            ${notesHtml}
            ${r.isEditing ? "" : noteEditor}
          </div>`;
        })
        .join("");
      scheduleDrawLinks();
    }

    function linkDotClass(id) {
      const classes = ["link-dot"];
      if (id === linkSourceId) classes.push("is-source");
      if (recordHasLink(id)) classes.push("is-linked");
      return classes.join(" ");
    }

    const NOTE_FONT_SIZES = new Set(["100%", "125%", "150%", "175%", "200%"]);
    const noteSelectionMap = new WeakMap();

    function normalizeNoteColor(value) {
      const raw = String(value || "").trim();
      if (/^#(?:[0-9a-f]{3}|[0-9a-f]{6})$/i.test(raw)) return raw;
      const rgb = raw.match(/^rgba?\(\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})/i);
      if (!rgb) return "";
      const nums = rgb.slice(1, 4).map(Number);
      if (nums.some((n) => n > 255)) return "";
      return `rgb(${nums.join(", ")})`;
    }

    function sanitizeNoteHtml(html) {
      const template = document.createElement("template");
      template.innerHTML = String(html || "");
      const allowed = new Set(["B", "STRONG", "I", "EM", "U", "SPAN", "DIV", "P", "BR", "BLOCKQUOTE", "FONT"]);
      const dropped = new Set(["SCRIPT", "STYLE", "IFRAME", "OBJECT", "EMBED", "LINK", "META"]);
      const clean = (node) => {
        [...node.childNodes].forEach((child) => {
          if (child.nodeType === Node.TEXT_NODE) {
            child.textContent = child.textContent.replace(/\u200b/g, "");
            return;
          }
          if (child.nodeType !== Node.ELEMENT_NODE) {
            child.remove();
            return;
          }
          if (dropped.has(child.tagName)) {
            child.remove();
            return;
          }
          clean(child);
          if (!allowed.has(child.tagName)) {
            const parent = child.parentNode;
            while (child.firstChild) parent.insertBefore(child.firstChild, child);
            child.remove();
            return;
          }
          const style = {};
          const fontSize = child.style?.fontSize || "";
          if (NOTE_FONT_SIZES.has(fontSize)) style.fontSize = fontSize;
          const color = normalizeNoteColor(child.style?.color || child.getAttribute("color") || "");
          if (color) style.color = color;
          const weight = child.style?.fontWeight || "";
          if (weight === "bold" || weight === "700") style.fontWeight = "700";
          if (child.style?.fontStyle === "italic") style.fontStyle = "italic";
          const decoration = `${child.style?.textDecoration || ""} ${child.style?.textDecorationLine || ""}`;
          if (decoration.includes("underline")) style.textDecoration = "underline";
          const margin = child.style?.marginLeft || "";
          if (/^\d+(?:\.\d+)?px$/.test(margin)) {
            const amount = Number.parseFloat(margin);
            if (amount > 0 && amount <= 240) style.marginLeft = `${amount}px`;
          }
          [...child.attributes].forEach((attr) => child.removeAttribute(attr.name));
          Object.entries(style).forEach(([key, value]) => {
            child.style[key] = value;
          });
        });
      };
      clean(template.content);
      return template.innerHTML.replace(/\u200b/g, "").trim();
    }

    function notePlainText(html) {
      const holder = document.createElement("div");
      holder.innerHTML = String(html || "");
      return (holder.textContent || "").replace(/\u200b/g, "").trim();
    }

    function decodeHtmlEntities(value) {
      const holder = document.createElement("textarea");
      holder.innerHTML = String(value || "");
      return holder.value;
    }

    function renderNoteText(text) {
      const raw = String(text || "");
      if (!/<\/?(b|strong|i|em|u|span|div|p|br|blockquote|font)\b/i.test(raw)) {
        return escapeHtml(decodeHtmlEntities(raw));
      }
      return sanitizeNoteHtml(raw);
    }

    let noteSelectionLock = false;
    let noteSelectionFrozen = false;

    function rememberNoteSelection(editor) {
      if (noteSelectionLock || noteSelectionFrozen) return;
      const selection = window.getSelection();
      if (!selection || !selection.rangeCount || !editor) return;
      const range = selection.getRangeAt(0);
      if (range.commonAncestorContainer !== editor && !editor.contains(range.commonAncestorContainer)) return;
      noteSelectionMap.set(editor, range.cloneRange());
    }

    function focusNoteEditor(editor) {
      if (!editor) return;
      const range = noteSelectionMap.get(editor);
      noteSelectionLock = true;
      editor.focus();
      if (range) {
        try {
          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
        } catch (_) {
          noteSelectionMap.delete(editor);
        }
      }
      noteSelectionLock = false;
    }

    function syncNoteToolbar(editor) {
      const toolbar = editor?.closest(".note-editor")?.querySelector(".note-toolbar");
      if (!toolbar) return;
      ["bold", "italic", "underline"].forEach((command) => {
        const button = toolbar.querySelector(`[data-cmd="${command}"]`);
        let active = false;
        try {
          active = document.queryCommandState(command);
        } catch (_) {}
        button?.classList.toggle("is-on", active);
        button?.setAttribute("aria-pressed", active ? "true" : "false");
      });
    }

    function applyNoteFontSize(editor, size) {
      if (!editor || !NOTE_FONT_SIZES.has(size)) return;
      focusNoteEditor(editor);
      const selection = window.getSelection();
      if (!selection || !selection.rangeCount) return;
      const range = selection.getRangeAt(0);
      if (range.commonAncestorContainer !== editor && !editor.contains(range.commonAncestorContainer)) return;
      const span = document.createElement("span");
      span.style.fontSize = size;
      if (range.collapsed) {
        span.appendChild(document.createTextNode("\u200b"));
        range.insertNode(span);
        const caret = document.createRange();
        caret.setStart(span.firstChild, 1);
        caret.collapse(true);
        selection.removeAllRanges();
        selection.addRange(caret);
      } else {
        span.appendChild(range.extractContents());
        range.insertNode(span);
        selection.removeAllRanges();
        const next = document.createRange();
        next.selectNodeContents(span);
        next.collapse(false);
        selection.addRange(next);
      }
      editor.dataset.empty = notePlainText(editor.innerHTML) ? "false" : "true";
      rememberNoteSelection(editor);
    }

    function savedNoteRange(editor) {
      const saved = editor ? noteSelectionMap.get(editor) : null;
      if (!saved) return null;
      try {
        const range = saved.cloneRange();
        if (range.commonAncestorContainer !== editor && !editor.contains(range.commonAncestorContainer)) return null;
        return range;
      } catch (_) {
        noteSelectionMap.delete(editor);
        return null;
      }
    }

    function rangeCoversElement(range, element) {
      const probe = document.createRange();
      probe.selectNodeContents(element);
      return range.compareBoundaryPoints(Range.START_TO_START, probe) === 0
        && range.compareBoundaryPoints(Range.END_TO_END, probe) === 0;
    }

    function holdNoteSelection(editor) {
      if (!editor) return;
      const selection = window.getSelection();
      if (selection && selection.rangeCount) {
        const range = selection.getRangeAt(0);
        const inside = range.commonAncestorContainer === editor || editor.contains(range.commonAncestorContainer);
        if (inside && !range.collapsed) noteSelectionMap.set(editor, range.cloneRange());
      }
      noteSelectionFrozen = true;
    }

    function restoreNoteSelection(editor) {
      const range = savedNoteRange(editor);
      if (!editor || !range) return;
      noteSelectionLock = true;
      editor.focus();
      try {
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        noteSelectionMap.set(editor, range.cloneRange());
      } catch (_) {
        noteSelectionMap.delete(editor);
      }
      noteSelectionLock = false;
    }

    function applyNoteColor(editor, color) {
      const normalized = normalizeNoteColor(color);
      if (!editor || !normalized) return;
      const range = savedNoteRange(editor);
      if (!range || range.collapsed) return;
      const ancestor = range.commonAncestorContainer.nodeType === 1
        ? range.commonAncestorContainer
        : range.commonAncestorContainer.parentElement;
      if (ancestor?.dataset?.noteColor === "1" && rangeCoversElement(range, ancestor)) {
        ancestor.style.color = normalized;
      } else {
        const span = document.createElement("span");
        span.dataset.noteColor = "1";
        span.style.color = normalized;
        span.appendChild(range.extractContents());
        range.insertNode(span);
        const next = document.createRange();
        next.selectNodeContents(span);
        noteSelectionMap.set(editor, next.cloneRange());
      }
      editor.dataset.empty = notePlainText(editor.innerHTML) ? "false" : "true";
    }

    function applyNoteCommand(editor, command, value) {
      if (!editor) return;
      if (command === "color") {
        applyNoteColor(editor, value);
        return;
      }
      focusNoteEditor(editor);
      if (command === "bold" || command === "italic" || command === "underline" || command === "indent" || command === "outdent") {
        document.execCommand("styleWithCSS", false, false);
        document.execCommand(command, false, null);
      }
      editor.dataset.empty = notePlainText(editor.innerHTML) ? "false" : "true";
      rememberNoteSelection(editor);
      syncNoteToolbar(editor);
    }

    function cancelNote(index) {
      const record = records[index];
      if (!record) return;
      record.isAddingNote = false;
      renderRecords();
    }

    async function confirmNote(index) {
      const record = records[index];
      if (!record) return;
      const input = listEl.querySelector(`.note-input[data-index="${index}"]:not(.note-edit-input)`);
      const html = sanitizeNoteHtml(input?.innerHTML || "");
      const text = notePlainText(html);
      if (text) {
        if (!currentUsername) {
          alert("無法取得人員，請先至 login.html 登入。");
          return;
        }
        const nextNotes = [{
          text: html,
          by: currentUsername,
          at: new Date().toISOString()
        }, ...record.notes];
        try {
          const { error } = await sb
            .from(KILIST_TABLE)
            .update({ notes: nextNotes })
            .eq("id", record.id);
          if (error) throw new Error(error.message);
          record.notes = nextNotes;
        } catch (err) {
          console.error("儲存文字說明失敗", err);
          alert(`儲存文字說明失敗：${formatSupabaseError(err)}`);
          return;
        }
      }
      record.isAddingNote = false;
      record.editingNoteIndex = -1;
      renderRecords();
    }

    function startEditNote(index, noteIndex) {
      const record = records[index];
      const note = record?.notes?.[noteIndex];
      if (!record || !note || note.kind === "open") return;
      records.forEach((r) => {
        r.editingNoteIndex = -1;
        r.isAddingNote = false;
        r.isAddingOpen = false;
        r.editingOpenId = "";
      });
      record.editingNoteIndex = noteIndex;
      record.notesExpanded = true;
      renderRecords();
      const input = listEl.querySelector(`.note-edit-input[data-index="${index}"]`);
      if (!input) return;
      input.innerHTML = renderNoteText(note.text);
      input.dataset.empty = notePlainText(input.innerHTML) ? "false" : "true";
      input.focus();
    }

    function cancelEditNote(index) {
      const record = records[index];
      if (!record) return;
      record.editingNoteIndex = -1;
      renderRecords();
    }

    async function saveNoteEdit(index, noteIndex) {
      const record = records[index];
      const note = record?.notes?.[noteIndex];
      if (!record || !note || note.kind === "open") return;
      const input = listEl.querySelector(`.note-edit-input[data-index="${index}"]`);
      const html = sanitizeNoteHtml(input?.innerHTML || "");
      const text = notePlainText(html);
      if (!text) {
        input?.focus();
        return;
      }
      const nextNotes = record.notes.map((item, itemIndex) => (
        itemIndex === noteIndex ? { ...item, text: html } : item
      ));
      try {
        await saveNotes(record, nextNotes);
      } catch (err) {
        console.error("編輯補充說明失敗", err);
        alert(`編輯補充說明失敗：${formatSupabaseError(err)}`);
        return;
      }
      record.editingNoteIndex = -1;
      renderRecords();
    }

    async function removeNote(index, noteIndex) {
      const record = records[index];
      const note = record?.notes?.[noteIndex];
      if (!record || !note || note.kind === "open") return;
      const nextNotes = record.notes.filter((_, itemIndex) => itemIndex !== noteIndex);
      try {
        await saveNotes(record, nextNotes);
      } catch (err) {
        console.error("刪除補充說明失敗", err);
        alert(`刪除補充說明失敗：${formatSupabaseError(err)}`);
        return;
      }
      record.editingNoteIndex = -1;
      renderRecords();
    }

    async function saveNotes(record, nextNotes) {
      const { error } = await sb
        .from(KILIST_TABLE)
        .update({ notes: nextNotes })
        .eq("id", record.id);
      if (error) throw new Error(error.message);
      record.notes = nextNotes;
    }

    function cancelOpenItem(index) {
      const record = records[index];
      if (!record) return;
      record.isAddingOpen = false;
      record.editingOpenId = "";
      renderRecords();
    }

    async function confirmOpenItem(index) {
      const record = records[index];
      if (!record) return;
      const input = listEl.querySelector(`.open-item-input[data-index="${index}"]:not(.open-item-edit-input)`);
      const text = String(input?.value || "").trim();
      if (!text) {
        input?.focus();
        return;
      }
      if (!currentUsername) {
        alert("無法取得人員，請先至 login.html 登入。");
        return;
      }
      const nextNotes = [...record.notes, {
        kind: "open",
        id: crypto.randomUUID(),
        text,
        checked: false,
        by: currentUsername,
        at: new Date().toISOString()
      }];
      try {
        await saveNotes(record, nextNotes);
      } catch (err) {
        console.error("儲存補充開項失敗", err);
        alert(`儲存補充開項失敗：${formatSupabaseError(err)}`);
        return;
      }
      record.isAddingOpen = false;
      record.editingOpenId = "";
      renderRecords();
    }

    function startEditOpenItem(index, openId) {
      const record = records[index];
      if (!record || !openId) return;
      records.forEach((r) => {
        r.editingOpenId = "";
        r.isAddingOpen = false;
      });
      record.editingOpenId = openId;
      renderRecords();
      const input = listEl.querySelector(`.open-item-edit-input[data-open-id="${CSS.escape(openId)}"]`);
      input?.focus();
      input?.select();
    }

    function cancelEditOpenItem(index) {
      const record = records[index];
      if (!record) return;
      record.editingOpenId = "";
      renderRecords();
    }

    async function saveOpenItemEdit(index, openId) {
      const record = records[index];
      if (!record || !openId) return;
      const input = listEl.querySelector(`.open-item-edit-input[data-open-id="${CSS.escape(openId)}"]`);
      const text = String(input?.value || "").trim();
      if (!text) {
        input?.focus();
        return;
      }
      const nextNotes = record.notes.map((note) => (
        note?.kind === "open" && note.id === openId ? { ...note, text } : note
      ));
      try {
        await saveNotes(record, nextNotes);
      } catch (err) {
        console.error("編輯補充開項失敗", err);
        alert(`編輯補充開項失敗：${formatSupabaseError(err)}`);
        return;
      }
      record.editingOpenId = "";
      renderRecords();
    }

    async function toggleOpenItem(index, openId, checked) {
      const record = records[index];
      if (!record || !openId) return;
      if (checked && !currentUsername) {
        alert("無法取得勾核人員，請先至 login.html 登入。");
        renderRecords();
        return;
      }
      const nextNotes = record.notes.map((note) => {
        if (!(note?.kind === "open" && note.id === openId)) return note;
        if (!checked) return { ...note, checked: false, checkedBy: "", checkedAt: "" };
        return {
          ...note,
          checked: true,
          checkedBy: currentUsername,
          checkedAt: new Date().toISOString()
        };
      });
      try {
        await saveNotes(record, nextNotes);
      } catch (err) {
        console.error("更新補充開項失敗", err);
        alert(`更新補充開項失敗：${formatSupabaseError(err)}`);
      }
      renderRecords();
    }

    async function removeOpenItem(index, openId) {
      const record = records[index];
      if (!record || !openId) return;
      const nextNotes = record.notes.filter((note) => !(note?.kind === "open" && note.id === openId));
      try {
        await saveNotes(record, nextNotes);
      } catch (err) {
        console.error("刪除補充開項失敗", err);
        alert(`刪除補充開項失敗：${formatSupabaseError(err)}`);
        return;
      }
      renderRecords();
    }

    async function saveEdit(index) {
      const record = records[index];
      if (!record) return;
      const personSelect = listEl.querySelector(`.edit-person[data-index="${index}"]`);
      const itemSelect = listEl.querySelector(`.edit-item[data-index="${index}"]`);
      const noteInput = listEl.querySelector(`.edit-note[data-index="${index}"]`);
      const personId = personSelect?.value || "";
      const personName = personId
        ? (personSelect.selectedOptions[0]?.textContent || "").trim()
        : (personSelect?.selectedOptions[0]?.textContent || record.person || "").trim();
      if (!personName || personName === "請選擇承辦") {
        alert("請選擇承辦。");
        personSelect?.focus();
        return;
      }
      const item = (itemSelect?.value || "").trim();
      const note = (noteInput?.value || "").trim();
      try {
        const { error } = await sb
          .from(KILIST_TABLE)
          .update({
            person_id: personId || null,
            person_name: personName,
            item,
            note
          })
          .eq("id", record.id);
        if (error) throw new Error(error.message);
        record.personId = personId;
        record.person = personName;
        record.item = item;
        record.note = note;
        record.isEditing = false;
        if (item && !vendorList.includes(item)) {
          vendorList.push(item);
          saveVendorList();
          refreshVendorSelects();
        }
        renderRecords();
      } catch (err) {
        console.error("儲存編輯失敗", err);
        alert(`儲存編輯失敗：${formatSupabaseError(err)}`);
      }
    }

    function cancelEdit(index) {
      const record = records[index];
      if (!record) return;
      record.isEditing = false;
      renderRecords();
    }

    async function toggleCheck(index) {
      const record = records[index];
      if (!record) return;
      let payload;
      if (record.checkedBy) {
        payload = { checked_by: "", checked_at: null };
      } else {
        if (!currentUsername) {
          alert("無法取得勾核人員，請先至 login.html 登入。");
          return;
        }
        payload = { checked_by: currentUsername, checked_at: new Date().toISOString() };
      }
      try {
        const { error } = await sb
          .from(KILIST_TABLE)
          .update(payload)
          .eq("id", record.id);
        if (error) throw new Error(error.message);
        record.checkedBy = payload.checked_by;
        record.checkedAt = payload.checked_at || "";
        renderRecords();
      } catch (err) {
        console.error("勾核更新失敗", err);
        alert(`勾核更新失敗：${formatSupabaseError(err)}`);
      }
    }

    async function toggleRemind(index) {
      const record = records[index];
      if (!record) return;
      const next = !record.isRemind;
      try {
        const { error } = await sb
          .from(KILIST_TABLE)
          .update({ is_remind: next })
          .eq("id", record.id);
        if (error) throw new Error(error.message);
        record.isRemind = next;
        renderRecords();
      } catch (err) {
        console.error("提醒更新失敗", err);
        alert(`提醒更新失敗：${formatSupabaseError(err)}`);
      }
    }

    async function togglePin(index) {
      const record = records[index];
      if (!record) return;
      if (!canPinRecords()) {
        alert("僅權限等級 0 或 1 的使用者可操作置頂。");
        return;
      }
      const next = !record.isPinned;
      try {
        const { error } = await sb
          .from(KILIST_TABLE)
          .update({ is_pinned: next })
          .eq("id", record.id);
        if (error) throw new Error(error.message);
        record.isPinned = next;
        renderRecords();
      } catch (err) {
        console.error("置頂更新失敗", err);
        alert(`置頂更新失敗：${formatSupabaseError(err)}`);
      }
    }

    async function deleteRecord(index) {
      const record = records[index];
      if (!record) return;
      if (!canDeleteRecords()) {
        alert("僅權限等級 0 或 1 的使用者可刪除紀錄。");
        return;
      }
      const label = [record.person, record.item, record.note].filter(Boolean).join(" | ");
      if (!confirm(`確定要刪除「${label}」嗎？此動作無法復原。`)) return;
      try {
        const { error } = await sb
          .from(KILIST_TABLE)
          .delete()
          .eq("id", record.id);
        if (error) throw new Error(error.message);
        records.splice(index, 1);
        recordLinks = recordLinks.filter((link) => link.from !== record.id && link.to !== record.id);
        if (linkSourceId === record.id) linkSourceId = "";
        if (linksSupported) clearLocalRecordLinks();
        else saveRecordLinks();
        renderRecords();
      } catch (err) {
        console.error("刪除紀錄失敗", err);
        alert(`刪除紀錄失敗：${formatSupabaseError(err)}`);
      }
    }

    listEl.addEventListener("click", (e) => {
      const linkDot = e.target.closest(".link-dot");
      if (linkDot) {
        e.preventDefault();
        toggleRecordLink(linkDot.dataset.id || "");
        return;
      }
      const orderBtn = e.target.closest(".order-btn");
      if (orderBtn) {
        if (orderBtn.disabled) return;
        moveRecord(Number(orderBtn.dataset.index), orderBtn.classList.contains("order-up") ? -1 : 1);
        return;
      }
      const checkBtn = e.target.closest(".check-btn");
      if (checkBtn) {
        toggleCheck(Number(checkBtn.dataset.index));
        return;
      }
      const remindBtn = e.target.closest(".remind-btn");
      if (remindBtn) {
        toggleRemind(Number(remindBtn.dataset.index));
        return;
      }
      const pinBtn = e.target.closest(".pin-btn");
      if (pinBtn) {
        togglePin(Number(pinBtn.dataset.index));
        return;
      }
      const editBtn = e.target.closest(".edit-btn");
      if (editBtn) {
        const idx = Number(editBtn.dataset.index);
        const record = records[idx];
        if (!record) return;
        records.forEach((r) => {
          r.isEditing = false;
          r.isAddingNote = false;
          r.isAddingOpen = false;
          r.editingNoteIndex = -1;
          r.editingOpenId = "";
        });
        record.isEditing = true;
        renderRecords();
        listEl.querySelector(`.edit-item[data-index="${idx}"]`)?.focus();
        return;
      }
      const saveBtn = e.target.closest(".edit-save-btn");
      if (saveBtn) {
        saveEdit(Number(saveBtn.dataset.index));
        return;
      }
      const cancelBtn = e.target.closest(".edit-cancel-btn");
      if (cancelBtn) {
        cancelEdit(Number(cancelBtn.dataset.index));
        return;
      }
      const deleteBtn = e.target.closest(".delete-btn");
      if (deleteBtn) {
        deleteRecord(Number(deleteBtn.dataset.index));
        return;
      }
      const notesToggleBtn = e.target.closest(".notes-toggle-btn");
      if (notesToggleBtn) {
        const record = records[Number(notesToggleBtn.dataset.index)];
        if (!record) return;
        record.notesExpanded = !record.notesExpanded;
        renderRecords();
        return;
      }
      const openAddBtn = e.target.closest(".open-add-btn");
      if (openAddBtn) {
        const record = records[Number(openAddBtn.dataset.index)];
        if (!record) return;
        if (record.isAddingOpen) {
          listEl.querySelector(`.open-item-input[data-index="${openAddBtn.dataset.index}"]`)?.focus();
          return;
        }
        records.forEach((r) => {
          r.isAddingOpen = false;
          r.isAddingNote = false;
          r.isEditing = false;
          r.editingNoteIndex = -1;
          r.editingOpenId = "";
        });
        record.isAddingOpen = true;
        renderRecords();
        listEl.querySelector(`.open-item-input[data-index="${openAddBtn.dataset.index}"]`)?.focus();
        return;
      }
      const openConfirmBtn = e.target.closest(".open-item-confirm");
      if (openConfirmBtn) {
        confirmOpenItem(Number(openConfirmBtn.dataset.index));
        return;
      }
      const openCancelBtn = e.target.closest(".open-item-cancel");
      if (openCancelBtn) {
        cancelOpenItem(Number(openCancelBtn.dataset.index));
        return;
      }
      const openEditBtn = e.target.closest(".open-item-edit");
      if (openEditBtn) {
        startEditOpenItem(Number(openEditBtn.dataset.index), openEditBtn.dataset.openId || "");
        return;
      }
      const openEditConfirmBtn = e.target.closest(".open-item-edit-confirm");
      if (openEditConfirmBtn) {
        saveOpenItemEdit(Number(openEditConfirmBtn.dataset.index), openEditConfirmBtn.dataset.openId || "");
        return;
      }
      const openEditCancelBtn = e.target.closest(".open-item-edit-cancel");
      if (openEditCancelBtn) {
        cancelEditOpenItem(Number(openEditCancelBtn.dataset.index));
        return;
      }
      const openRemoveBtn = e.target.closest(".open-item-remove");
      if (openRemoveBtn) {
        removeOpenItem(Number(openRemoveBtn.dataset.index), openRemoveBtn.dataset.openId || "");
        return;
      }
      const noteEditBtn = e.target.closest(".note-edit-btn");
      if (noteEditBtn) {
        startEditNote(Number(noteEditBtn.dataset.index), Number(noteEditBtn.dataset.noteIndex));
        return;
      }
      const noteEditConfirmBtn = e.target.closest(".note-edit-confirm");
      if (noteEditConfirmBtn) {
        saveNoteEdit(Number(noteEditConfirmBtn.dataset.index), Number(noteEditConfirmBtn.dataset.noteIndex));
        return;
      }
      const noteEditCancelBtn = e.target.closest(".note-edit-cancel");
      if (noteEditCancelBtn) {
        cancelEditNote(Number(noteEditCancelBtn.dataset.index));
        return;
      }
      const noteRemoveBtn = e.target.closest(".note-remove-btn");
      if (noteRemoveBtn) {
        removeNote(Number(noteRemoveBtn.dataset.index), Number(noteRemoveBtn.dataset.noteIndex));
        return;
      }
      const addBtn = e.target.closest(".note-add-btn");
      if (addBtn) {
        const record = records[Number(addBtn.dataset.index)];
        if (!record) return;
        records.forEach((r) => {
          r.isAddingNote = false;
          r.isAddingOpen = false;
          r.isEditing = false;
          r.editingNoteIndex = -1;
          r.editingOpenId = "";
        });
        record.isAddingNote = true;
        renderRecords();
        listEl.querySelector(`.note-input[data-index="${addBtn.dataset.index}"]:not(.note-edit-input)`)?.focus();
        return;
      }
      const confirmBtn = e.target.closest(".note-confirm-btn");
      if (confirmBtn) {
        confirmNote(Number(confirmBtn.dataset.index));
        return;
      }
      const noteCancelBtn = e.target.closest(".note-cancel-btn");
      if (noteCancelBtn) {
        cancelNote(Number(noteCancelBtn.dataset.index));
        return;
      }
      const colorControl = e.target.closest(".note-tool-color");
      if (colorControl) {
        openNoteColorPicker(colorControl.querySelector(".note-color"));
        return;
      }
      const formatBtn = e.target.closest(".note-toolbar [data-cmd]");
      if (formatBtn) {
        const editor = formatBtn.closest(".note-editor")?.querySelector(".note-input");
        applyNoteCommand(editor, formatBtn.dataset.cmd);
      }
    });

    function openNoteColorPicker(input) {
      if (!input) return;
      input.focus({ preventScroll: true });
      try {
        if (typeof input.showPicker === "function") input.showPicker();
      } catch (_) {}
    }

    listEl.addEventListener("pointerdown", (e) => {
      const colorControl = e.target.closest(".note-tool-color");
      if (!colorControl || !listEl.contains(colorControl)) return;
      holdNoteSelection(colorControl.closest(".note-editor")?.querySelector(".note-input"));
    }, true);

    listEl.addEventListener("mousedown", (e) => {
      const editor = e.target.closest(".note-editor")?.querySelector(".note-input");
      if (e.target.closest(".note-tool-color")) {
        const picker = e.target.closest(".note-tool-color")?.querySelector(".note-color");
        if (picker && typeof picker.showPicker === "function") e.preventDefault();
        holdNoteSelection(editor);
        return;
      }
      if (editor && e.target.closest(".note-toolbar")) rememberNoteSelection(editor);
      if (e.target.closest(".note-toolbar button")) e.preventDefault();
    });

    listEl.addEventListener("change", (e) => {
      const colorInput = e.target.closest(".note-color");
      if (colorInput) {
        const editor = colorInput.closest(".note-editor")?.querySelector(".note-input");
        applyNoteColor(editor, colorInput.value);
        noteSelectionFrozen = false;
        restoreNoteSelection(editor);
        return;
      }
      const sizeSelect = e.target.closest(".note-size");
      if (!sizeSelect) return;
      const editor = sizeSelect.closest(".note-editor")?.querySelector(".note-input");
      applyNoteFontSize(editor, sizeSelect.value);
    });

    listEl.addEventListener("input", (e) => {
      const colorInput = e.target.closest(".note-color");
      if (colorInput) {
        const editor = colorInput.closest(".note-editor")?.querySelector(".note-input");
        applyNoteColor(editor, colorInput.value);
        return;
      }
      const editor = e.target.closest(".note-input");
      if (!editor) return;
      editor.dataset.empty = notePlainText(editor.innerHTML) ? "false" : "true";
    });

    listEl.addEventListener("focusout", (e) => {
      if (!e.target.closest?.(".note-color")) return;
      window.setTimeout(() => {
        noteSelectionFrozen = false;
      }, 0);
    });

    document.addEventListener("selectionchange", () => {
      const selection = window.getSelection();
      if (!selection || !selection.rangeCount) return;
      const anchor = selection.anchorNode;
      const element = anchor?.nodeType === 1 ? anchor : anchor?.parentElement;
      const editor = element?.closest?.(".note-input");
      if (!editor || !listEl.contains(editor)) return;
      rememberNoteSelection(editor);
      syncNoteToolbar(editor);
    });

    listEl.addEventListener("change", (e) => {
      const check = e.target.closest(".open-item-check");
      if (!check || check.disabled) return;
      toggleOpenItem(Number(check.dataset.index), check.dataset.openId || "", check.checked);
    });

    listEl.addEventListener("keydown", (e) => {
      const openEditInput = e.target.closest(".open-item-edit-input");
      if (openEditInput) {
        if (e.key === "Enter") {
          e.preventDefault();
          saveOpenItemEdit(Number(openEditInput.dataset.index), openEditInput.dataset.openId || "");
        } else if (e.key === "Escape") {
          e.preventDefault();
          cancelEditOpenItem(Number(openEditInput.dataset.index));
        }
        return;
      }
      const openInput = e.target.closest(".open-item-input");
      if (openInput) {
        if (e.key === "Enter") {
          e.preventDefault();
          confirmOpenItem(Number(openInput.dataset.index));
        } else if (e.key === "Escape") {
          e.preventDefault();
          cancelOpenItem(Number(openInput.dataset.index));
        }
        return;
      }
      if (e.key !== "Enter" || !(e.ctrlKey || e.metaKey)) return;
      const editInput = e.target.closest(".note-edit-input");
      if (editInput) {
        e.preventDefault();
        saveNoteEdit(Number(editInput.dataset.index), Number(editInput.dataset.noteIndex));
        return;
      }
      const input = e.target.closest(".note-input");
      if (!input) return;
      e.preventDefault();
      confirmNote(Number(input.dataset.index));
    });

    let addingRecord = false;

    async function addRecord() {
      if (addingRecord) return;
      const personOption = personSelectEl.selectedOptions[0];
      const person = personSelectEl.value ? personOption.textContent : "";
      if (!person) {
        alert("請先選擇承辦。");
        personSelectEl.focus();
        return;
      }
      if (!currentUserId) {
        alert("請先至 login.html 登入後再新增紀錄。");
        return;
      }
      const item = vendorSelectEl.value || "";
      const note = noteInputEl.value.trim();
      const maxSortOrder = records.reduce((max, record) => (
        Number.isFinite(record.sortOrder) ? Math.max(max, record.sortOrder) : max
      ), null);
      const payload = {
        work_zone: workZone,
        person_id: personSelectEl.value || null,
        person_name: person,
        item,
        note,
        created_by: currentUserId
      };
      if (sortOrderSupported && maxSortOrder != null) payload.sort_order = maxSortOrder + 10;

      addingRecord = true;
      recordBtnEl.disabled = true;
      try {
        const { data, error } = await sb
          .from(KILIST_TABLE)
          .insert(payload)
          .select(sortOrderSupported ? KILIST_COLUMNS : KILIST_COLUMNS.replace(", sort_order", ""))
          .single();
        if (error) throw new Error(error.message);
        records.push(normalizeRow(data));
        renderRecords();
        listEl.querySelector(`.link-dot[data-id="${CSS.escape(data.id)}"]`)?.closest(".record-item")?.scrollIntoView({ block: "nearest" });
        noteInputEl.value = "";
        noteInputEl.focus();
      } catch (err) {
        console.error("新增紀錄失敗", err);
        alert(`新增紀錄失敗：${formatSupabaseError(err)}`);
      } finally {
        addingRecord = false;
        recordBtnEl.disabled = false;
      }
    }

    recordBtnEl.addEventListener("click", addRecord);
    noteInputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        addRecord();
      }
    });

    filterPersonEl.addEventListener("change", renderRecords);
    filterVendorEl.addEventListener("change", renderRecords);
    clearFilterBtnEl.addEventListener("click", () => {
      filterPersonEl.value = "";
      filterVendorEl.value = "";
      renderRecords();
    });
    checkedToggleBtnEl.addEventListener("click", () => {
      showCheckedRecords = !showCheckedRecords;
      syncCheckedToggleBtn();
      renderRecords();
    });
    syncCheckedToggleBtn();

    loadRecordLinks();
    loadRecordOrder();
    if (recordBoardEl && typeof ResizeObserver !== "undefined") {
      const linkObserver = new ResizeObserver(() => scheduleDrawLinks());
      linkObserver.observe(recordBoardEl);
    }
    window.addEventListener("resize", scheduleDrawLinks);

    async function bootstrap() {
      listEl.className = "empty-hint";
      listEl.textContent = "載入中…";
      loadVendorList();
      refreshVendorSelects();
      await loadCurrentUsername();
      await Promise.all([loadZonePersons(), loadRecords()]);
    }

    bootstrap();
  </script>
</body>
</html>
