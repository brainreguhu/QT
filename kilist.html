<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kilist</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4d;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #3d8bfd;
      --accent-hover: #5a9dff;
      --danger: #f87171;
      --ok: #4ade80;
      --pin: #f59e0b;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: radial-gradient(ellipse 120% 100% at 50% -20%, #1e3a5f 0%, var(--bg) 55%);
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      font-family: "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      font-size: 16px;
      color: var(--text);
      line-height: 1.5;
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    .page-header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      min-height: 38px;
    }

    .page-title {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-align: center;
    }

    .back-btn {
      position: absolute;
      left: 0;
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      background: transparent;
      font-family: inherit;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }

    .back-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
      background: rgba(61, 139, 253, 0.12);
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }

    .field-grid {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr) max-content minmax(0, 1fr) minmax(0, 4fr) max-content;
      column-gap: 10px;
      align-items: center;
    }

    .field-row {
      display: grid;
      grid-template-columns: subgrid;
      grid-column: 1 / -1;
      align-items: center;
      margin-bottom: 14px;
    }

    .field-row.filter-row {
      margin-bottom: 14px;
      border-top: 1px dashed var(--border);
      padding-top: 12px;
    }

    .filter-actions {
      grid-column: 5 / -1;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .filter-actions .checked-toggle-btn {
      margin-left: 0;
    }

    .clear-filter-btn {
      flex-shrink: 0;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      line-height: 1.2;
      height: 34px;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
    }

    .clear-filter-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(61, 139, 253, 0.12);
    }

    .checked-toggle-btn {
      flex-shrink: 0;
      margin-left: auto;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      line-height: 1.2;
      height: 34px;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
      white-space: nowrap;
    }

    .checked-toggle-btn:hover {
      border-color: var(--ok);
      color: var(--ok);
      background: rgba(74, 222, 128, 0.1);
    }

    .checked-toggle-btn.is-on {
      border-color: var(--ok);
      color: var(--ok);
      background: rgba(74, 222, 128, 0.12);
    }

    .vendor-edit-btn {
      flex-shrink: 0;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: transparent;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      line-height: 1.2;
      height: 34px;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
    }

    .vendor-edit-btn:hover {
      border-color: var(--accent);
      background: rgba(61, 139, 253, 0.12);
    }

    .vendor-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.55);
    }

    .vendor-modal.is-open {
      display: flex;
    }

    .vendor-modal-panel {
      width: min(420px, 100%);
      height: 80vh;
      max-height: calc(100vh - 32px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
    }

    .vendor-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .vendor-modal-header h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
    }

    .vendor-modal-close {
      width: 32px;
      height: 32px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
    }

    .vendor-modal-close:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    .vendor-modal-add {
      display: flex;
      gap: 8px;
    }

    .vendor-modal-add input {
      flex: 1;
      min-width: 0;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
    }

    .vendor-modal-add input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(61, 139, 253, 0.25);
    }

    .vendor-modal-add button {
      flex-shrink: 0;
      padding: 8px 14px;
      border: 1px solid var(--accent);
      border-radius: 10px;
      background: rgba(61, 139, 253, 0.12);
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
    }

    .vendor-modal-add button:hover {
      background: rgba(61, 139, 253, 0.25);
      color: #fff;
    }

    .vendor-modal-list {
      flex: 1;
      min-height: 0;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 2px;
    }

    .vendor-modal-empty {
      padding: 24px 8px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .vendor-modal-hint {
      margin: -4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .vendor-modal-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      user-select: none;
    }

    .vendor-modal-item.is-dragging {
      border-color: var(--accent);
      background: rgba(61, 139, 253, 0.16);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28);
    }

    .vendor-drag-handle {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: grab;
      touch-action: none;
    }

    .vendor-drag-handle svg {
      display: block;
      fill: currentColor;
    }

    .vendor-drag-handle:hover,
    .vendor-modal-item.is-dragging .vendor-drag-handle {
      color: var(--accent);
      background: rgba(61, 139, 253, 0.12);
    }

    .vendor-drag-handle:active,
    .vendor-modal-item.is-dragging .vendor-drag-handle {
      cursor: grabbing;
    }

    .vendor-modal-item span {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      word-break: break-word;
    }

    .vendor-delete-btn {
      flex-shrink: 0;
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--danger);
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
    }

    .vendor-delete-btn:hover {
      border-color: var(--danger);
      background: rgba(248, 113, 113, 0.12);
    }

    .field-row label {
      flex-shrink: 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
    }

    .field-row select,
    .field-row input[type="text"] {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
    }

    .field-row select {
      padding: 8px 12px;
      font-size: 13px;
      line-height: 1.2;
      height: 34px;
    }

    .field-row input[type="text"] {
      padding: 8px 12px;
      font-size: 13px;
      line-height: 1.2;
      height: 34px;
    }

    .field-row select:focus,
    .field-row input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(61, 139, 253, 0.25);
    }

    .field-row select:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .record-btn {
      flex-shrink: 0;
      padding: 8px 18px;
      border: 1px solid var(--accent);
      border-radius: 10px;
      background: rgba(61, 139, 253, 0.12);
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      line-height: 1.2;
      height: 34px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .record-btn:hover {
      background: rgba(61, 139, 253, 0.25);
      color: #fff;
    }

    @media (max-width: 560px) {
      .field-grid,
      .field-row {
        display: flex;
        flex-wrap: wrap;
      }

      .field-row select,
      .field-row input[type="text"] {
        flex: 1 1 140px;
        width: auto;
      }

      .filter-actions {
        flex: 1 1 auto;
        justify-content: flex-start;
      }
    }

    .empty-hint {
      padding: 32px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .record-board {
      position: relative;
    }

    .record-links {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
      z-index: 1;
    }

    .record-list {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-left: 28px;
      margin-right: 128px;
    }

    .record-order {
      position: absolute;
      top: 50%;
      left: 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      gap: 1px;
      transform: translate(calc(-100% - 6px), -50%);
    }

    .order-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 14px;
      padding: 0;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.55);
      cursor: pointer;
    }

    .order-btn:hover:not(:disabled) {
      color: #fff;
    }

    .order-btn:disabled {
      opacity: 0.22;
      cursor: default;
    }

    .record-item {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 4px 5px 4px 25px;
      border: 2px solid #636363; /*資料外框顏色*/
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      font-size: 15px;
      line-height: 1.3;
    }

    .link-dot {
      position: absolute;
      top: 50%;
      right: 0;
      width: 14px;
      height: 14px;
      margin: 0;
      padding: 0;
      appearance: none;
      border: 1.5px solid rgba(255, 255, 255, 0.55);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.16);
      box-shadow: none;
      transform: translate(50%, -50%);
      cursor: pointer;
      z-index: 3;
      transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
    }

    .link-dot:hover {
      background: rgba(255, 255, 255, 0.88);
      border-color: #fff;
      box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.18);
      transform: translate(50%, -50%) scale(1.2);
    }

    .link-dot.is-linked {
      background: rgba(255, 255, 255, 0.4);
      border-color: rgba(255, 255, 255, 0.92);
    }

    .link-dot.is-source,
    .link-dot.is-source:hover {
      background: #fff;
      border-color: #fff;
      box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.32);
      transform: translate(50%, -50%) scale(1.15);
    }

    .record-item.is-pinned {
      border-color: var(--pin);
      box-shadow: 0 0 0 1px rgba(245, 158, 11, 0.35);
    }

    .record-item.is-remind {
      border-color: var(--danger);
      box-shadow: 0 0 0 1px rgba(248, 113, 113, 0.35);
    }

    .record-item.is-checked {
      border-color: var(--ok);
    }

    .record-main {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 5px;
    }

    .record-item .record-content {
      flex: 1;
      min-width: 160px;
      word-break: break-word;
      font-weight: 600;
      text-align: left;
    }

    .record-item .record-time {
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .record-item .record-check-info {
      font-size: 12px;
      color: var(--ok);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .record-item .check-btn {
      flex-shrink: 0;
      align-self: center;
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
    }

    .record-item .check-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(61, 139, 253, 0.1);
    }

    .record-item .check-btn.is-checked {
      border-color: var(--ok);
      color: var(--ok);
      background: rgba(74, 222, 128, 0.12);
    }

    .record-item .edit-btn,
    .record-item .delete-btn,
    .record-item .remind-btn,
    .record-item .pin-btn {
      flex-shrink: 0;
      align-self: center;
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      line-height: 1.2;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
    }

    .record-item .edit-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(61, 139, 253, 0.12);
    }

    .record-item .remind-btn:hover,
    .record-item .remind-btn.is-on {
      border-color: var(--danger);
      color: var(--danger);
      background: rgba(248, 113, 113, 0.12);
    }

    .record-item .pin-btn:hover,
    .record-item .pin-btn.is-on {
      border-color: var(--pin);
      color: var(--pin);
      background: rgba(245, 158, 11, 0.14);
    }

    .record-item .delete-btn:hover {
      border-color: var(--danger);
      color: var(--danger);
      background: rgba(248, 113, 113, 0.12);
    }

    .record-edit-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      width: 100%;
      align-items: center;
    }

    .record-edit-row select,
    .record-edit-row input[type="text"] {
      min-width: 0;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.2;
      font-family: inherit;
      height: 34px;
    }

    .record-edit-row .edit-person,
    .record-edit-row .edit-item {
      flex: 1 1 0;
    }

    .record-edit-row .edit-note {
      flex: 4 1 0;
    }

    .record-edit-row .edit-save-btn,
    .record-edit-row .edit-cancel-btn {
      flex-shrink: 0;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
    }

    .record-edit-row .edit-save-btn {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .record-edit-row .edit-cancel-btn {
      background: transparent;
      color: var(--muted);
    }

    .record-notes {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .record-note-line {
      display: flex;
      align-items: flex-start;
      gap: 4px 12px;
      padding: 8px;
      border-left: 3px solid var(--border);
      font-size: 14px;
      line-height: 1.25;
    }

    .record-note-line.is-editing {
      flex-wrap: wrap;
    }

    .record-note-line .note-editor {
      flex: 1;
      min-width: 180px;
    }

    .record-note-line .note-edit-btn,
    .record-note-line .note-remove-btn {
      align-self: center;
    }

    .record-note-line + .record-note-line {
      border-top: 1px solid var(--border);
    }

    .record-note-line .note-meta {
      flex-shrink: 0;
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      padding-top: 1px;
    }

    .record-note-line .note-text {
      flex: 1;
      min-width: 0;
      color: #fff;
      text-align: left;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .notes-toggle-btn {
      align-self: flex-start;
      margin-left: 10px;
      padding: 2px 0;
      border: none;
      background: transparent;
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }

    .notes-toggle-btn:hover {
      text-decoration: underline;
    }

    .note-add-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      align-self: center;
    }

    .note-add-label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }

    .note-add-btn {
      width: 26px;
      height: 26px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(61, 139, 253, 0.18);
      color: var(--accent);
      font-size: 18px;
      font-weight: 700;
      font-family: inherit;
      line-height: 1;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
    }

    .note-add-btn:hover {
      background: var(--accent);
      color: #fff;
      transform: scale(1.08);
    }

    .note-add-actions {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 8px 18px;
    }

    .note-add-actions .open-item-draft {
      flex: 1;
      min-width: 0;
    }

    .note-add-btn.is-open {
      background: rgba(74, 222, 128, 0.18);
      color: var(--ok);
    }

    .note-add-btn.is-open:hover {
      background: var(--ok);
      color: #06210f;
    }

    .open-items {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin: 2px 0 2px 2px;
    }

    .open-item,
    .open-item-draft {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 28px;
    }

    .open-item-check {
      appearance: none;
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      margin: 0;
      flex-shrink: 0;
      border: 1px solid var(--muted);
      border-radius: 3px;
      background: var(--muted);
      cursor: pointer;
      display: inline-grid;
      place-content: center;
    }

    .open-item-check:checked {
      border-color: var(--ok);
      background: var(--ok);
    }

    .open-item-check:checked::after {
      content: "";
      width: 4px;
      height: 8px;
      margin-top: -2px;
      border: solid #06210f;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .open-item-check:disabled {
      cursor: default;
    }

    .open-item-text {
      flex: 1;
      min-width: 0;
      color: var(--muted);
      font-size: 14px;

<body>

            顯示已完成

        <svg id="record-links" class="record-links" aria-hidden="true">
          <defs>
            <marker id="record-link-arrow" viewBox="0 0 16 16" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="14.5" refY="8" orient="auto">
              <path d="M1,3.2 L14.5,8 L1,12.8" fill="none" stroke="rgba(255,255,255,0.92)" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="miter"></path>
            </marker>
            <radialGradient id="record-link-grain" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="1"></stop>
              <stop offset="35%" stop-color="#ffffff" stop-opacity="0.9"></stop>

  <div id="vendor-modal" class="vendor-modal" aria-hidden="true">

      <p id="vendor-modal-hint" class="vendor-modal-hint" hidden>拖動左側把手可調整順序</p>
      <div id="vendor-modal-list" class="vendor-modal-list"></div>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://clcqnbnbbtzzuctaspfn.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_1PJYZvRhU8qgCnwit6EG7Q_xjKq49oD";
    const PROFILE_TABLE = "profiles";
    const KILIST_TABLE = "kilist_records";
    const KILIST_LINKS_TABLE = "kilist_links";
    const KILIST_COLUMNS = "id, work_zone, person_id, person_name, item, note, checked_by, checked_at, notes, is_remind, is_pinned, sort_order, created_at";

    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    });

    const pageTitleEl = document.getElementById("page-title");
    const personSelectEl = document.getElementById("person-select");
    const vendorSelectEl = document.getElementById("vendor-select");
    const filterPersonEl = document.getElementById("filter-person");
    const filterVendorEl = document.getElementById("filter-vendor");
    const clearFilterBtnEl = document.getElementById("clear-filter-btn");
    const vendorEditBtnEl = document.getElementById("vendor-edit-btn");
    const vendorModalEl = document.getElementById("vendor-modal");
    const vendorModalCloseEl = document.getElementById("vendor-modal-close");
    const vendorModalInputEl = document.getElementById("vendor-modal-input");
    const vendorModalAddBtnEl = document.getElementById("vendor-modal-add-btn");
    const vendorModalHintEl = document.getElementById("vendor-modal-hint");
    const vendorModalListEl = document.getElementById("vendor-modal-list");
    const sortToggleBtnEl = document.getElementById("sort-toggle-btn");
    const checkedToggleBtnEl = document.getElementById("checked-toggle-btn");
    const noteInputEl = document.getElementById("note-input");
    const recordBtnEl = document.getElementById("record-btn");
    const listEl = document.getElementById("list");
    const recordBoardEl = document.getElementById("record-board");
    const recordLinksEl = document.getElementById("record-links");
    const recordLinkPathsEl = document.getElementById("record-link-paths");

    let showCheckedRecords = false;
    let sortByCreatedAt = false;

    function syncSortToggleBtn() {
      sortToggleBtnEl.textContent = sortByCreatedAt ? "依手動順序" : "依新增時間";
      sortToggleBtnEl.classList.toggle("is-on", sortByCreatedAt);
      sortToggleBtnEl.setAttribute("aria-pressed", sortByCreatedAt ? "true" : "false");
    }

    function syncCheckedToggleBtn() {
      checkedToggleBtnEl.textContent = showCheckedRecords ? "隱藏已完成" : "顯示已完成";
      checkedToggleBtnEl.classList.toggle("is-on", showCheckedRecords);
      checkedToggleBtnEl.setAttribute("aria-pressed", showCheckedRecords ? "true" : "false");
    }

    const VENDOR_STORAGE_KEY = "kilist:vendors";

    const workZone = String(new URLSearchParams(window.location.search).get("zone") || "").trim();
    const LINK_STORAGE_KEY = `kilist:links:${workZone || "_"}`;
    const ORDER_STORAGE_KEY = `kilist:order:${workZone || "_"}`;
    let recordLinks = [];
    let linkSourceId = "";

    function loadRecordLinks() {
      try {
        const parsed = JSON.parse(localStorage.getItem(LINK_STORAGE_KEY) || "[]");
        recordLinks = Array.isArray(parsed)
          ? parsed.filter((link) => link && link.from && link.to && link.from !== link.to)
          : [];
      } catch {
        recordLinks = [];
      }
    }

    function saveRecordLinks() {
      try {
        localStorage.setItem(LINK_STORAGE_KEY, JSON.stringify(recordLinks));
      } catch (err) {
        console.warn("儲存清單連線失敗", err);
      }
    }

    function clearLocalRecordLinks() {
      try {
        localStorage.removeItem(LINK_STORAGE_KEY);
      } catch (_) {}
    }

    let linksSupported = true;
    let savingLink = false;

    function validRecordLinks(links) {
      const ids = new Set(records.map((record) => record.id));
      return links.filter((link) => link && ids.has(link.from) && ids.has(link.to) && link.from !== link.to);
    }

    async function uploadRecordLinks(links) {
      if (!linksSupported) throw new Error("kilist_links");
      if (!workZone || !links.length) return;
      const rows = links.map((link) => ({
        work_zone: workZone,
        from_id: link.from,
        to_id: link.to
      }));
      const { error } = await sb
        .from(KILIST_LINKS_TABLE)
        .upsert(rows, { onConflict: "work_zone,from_id,to_id", ignoreDuplicates: true });
      if (error) throw new Error(error.message);
    }

    async function syncRecordLinks() {
      if (!workZone && !viewerAllZones) return;
      let linkQuery = sb.from(KILIST_LINKS_TABLE).select("from_id, to_id");
      if (!(viewerAllZones && (!workZone || workZone === "0"))) {
        linkQuery = linkQuery.eq("work_zone", workZone);
      }
      const query = await linkQuery;
      if (query.error) {
        const message = query.error.message || "";
        if (/kilist_links|42P01|PGRST205/i.test(message)) {
          linksSupported = false;
          if (recordLinks.length) {
            alert("弧線尚未同步到伺服器，請至 Supabase Dashboard → SQL Editor 執行 SQL/kilist_records.sql");
          }
          return;
        }
        console.error("讀取弧線失敗", query.error);
        return;
      }
      linksSupported = true;
      const serverLinks = validRecordLinks((query.data || []).map((row) => ({
        from: String(row.from_id || ""),
        to: String(row.to_id || "")
      })));
      const localLinks = validRecordLinks(recordLinks);
      if (!serverLinks.length && localLinks.length) {
        recordLinks = localLinks;
        try {
          await uploadRecordLinks(localLinks);
          clearLocalRecordLinks();
        } catch (err) {
          console.error("上傳既有弧線失敗", err);
          alert(`上傳既有弧線失敗：${formatSupabaseError(err)}`);
          saveRecordLinks();
        }
        return;
      }
      recordLinks = serverLinks;
      clearLocalRecordLinks();
    }

    let recordOrder = [];
    let sortOrderSupported = true;
    let movingRecord = false;

    function loadRecordOrder() {
      try {
        const parsed = JSON.parse(localStorage.getItem(ORDER_STORAGE_KEY) || "[]");
        recordOrder = Array.isArray(parsed) ? parsed.filter((id) => typeof id === "string" && id) : [];
      } catch {
        recordOrder = [];
      }
    }

    function clearLocalRecordOrder() {
      recordOrder = [];
      try {
        localStorage.removeItem(ORDER_STORAGE_KEY);
      } catch (_) {}
    }

    function orderTier(record) {
      if (record?.isPinned) return 2;
      if (isRemindHighlight(record)) return 1;
      return 0;
    }

    function compareRecords(a, b) {
      const tierA = orderTier(a);
      const tierB = orderTier(b);
      if (tierA !== tierB) return tierB - tierA;
      if (sortByCreatedAt) {
        return new Date(a.createdAt || 0).getTime() - new Date(b.createdAt || 0).getTime();
      }
      const orderA = Number.isFinite(a.sortOrder) ? a.sortOrder : null;
      const orderB = Number.isFinite(b.sortOrder) ? b.sortOrder : null;
      if (orderA == null && orderB == null) {
        return new Date(a.createdAt || 0).getTime() - new Date(b.createdAt || 0).getTime();
      }
      if (orderA == null) return 1;
      if (orderB == null) return -1;
      if (orderA !== orderB) return orderA - orderB;
      return new Date(a.createdAt || 0).getTime() - new Date(b.createdAt || 0).getTime();
    }

    async function casSortOrder(id, nextOrder, expectedOrder) {
      let query = sb.from(KILIST_TABLE).update({ sort_order: nextOrder }).eq("id", id);
      if (!Number.isFinite(expectedOrder)) query = query.is("sort_order", null);
      else query = query.eq("sort_order", expectedOrder);
      const { data, error } = await query.select("id");
      if (error) throw new Error(error.message);
      return Array.isArray(data) && data.length > 0;
    }

    async function reloadSortOrder(record) {
      const { data, error } = await sb.from(KILIST_TABLE).select("sort_order").eq("id", record.id).maybeSingle();
      if (error) throw new Error(error.message);
      if (!data) return false;
      record.sortOrder = data.sort_order == null || data.sort_order === "" ? null : Number(data.sort_order);
      return true;
    }

    async function uploadSortOrders(list) {
      if (!sortOrderSupported) {
        throw new Error("sort_order");
      }
      for (const record of list) {
        if (!Number.isFinite(record.sortOrder)) continue;
        const saved = await casSortOrder(record.id, record.sortOrder, null);
        if (!saved) await reloadSortOrder(record);
      }
    }

    async function ensureSortOrders() {
      if (!sortOrderSupported) return;
      if (records.every((record) => Number.isFinite(record.sortOrder))) return;
      const ordered = [...records].sort(compareRecords);
      let next = ordered.reduce((max, record) => (
        Number.isFinite(record.sortOrder) ? Math.max(max, record.sortOrder) : max
      ), 0);
      for (const record of ordered) {
        if (Number.isFinite(record.sortOrder)) continue;
        next += 10;
        const saved = await casSortOrder(record.id, next, null);
        if (saved) record.sortOrder = next;
        else await reloadSortOrder(record);
      }
    }

    async function commitSortSwap(currentId, currentOrder, neighborId, neighborOrder) {
      const firstOk = await casSortOrder(currentId, neighborOrder, currentOrder);
      if (!firstOk) return false;
      const secondOk = await casSortOrder(neighborId, currentOrder, neighborOrder);
      if (!secondOk) {
        await casSortOrder(currentId, currentOrder, neighborOrder);
        return false;
      }
      return true;
    }

    async function moveRecord(index, delta) {
      if (movingRecord || sortByCreatedAt) return;
      const entries = getFilteredRecordEntries();
      const pos = entries.findIndex((entry) => entry.index === index);
      const nextPos = pos + delta;
      if (pos < 0 || nextPos < 0 || nextPos >= entries.length) return;
      const current = entries[pos].r;
      const neighbor = entries[nextPos].r;
      if (!current || !neighbor || orderTier(current) !== orderTier(neighbor)) return;
      if (!sortOrderSupported) {
        alert(formatSupabaseError(new Error("sort_order")));
        return;
      }
      movingRecord = true;
      try {
        await ensureSortOrders();
        const currentOrder = current.sortOrder;
        const neighborOrder = neighbor.sortOrder;
        if (!Number.isFinite(currentOrder) || !Number.isFinite(neighborOrder) || currentOrder === neighborOrder) {
          renderRecords();
          return;
        }
        current.sortOrder = neighborOrder;
        neighbor.sortOrder = currentOrder;
        renderRecords();
        const ok = await commitSortSwap(current.id, currentOrder, neighbor.id, neighborOrder);
        if (!ok) {
          await reloadSortOrder(current);
          await reloadSortOrder(neighbor);
          renderRecords();
          alert("順序剛被其他人調整，已改為最新順序。");
          return;
        }
        clearLocalRecordOrder();
      } catch (err) {
        console.error("上傳清單順序失敗", err);
        alert(`上傳清單順序失敗：${formatSupabaseError(err)}`);
        await reloadSortOrder(current).catch(() => {});
        await reloadSortOrder(neighbor).catch(() => {});
        renderRecords();
      } finally {
        movingRecord = false;
        if (remoteRefreshIds.size) scheduleRemoteRefresh(0);
      }
    }

    function recordHasLink(id) {
      return recordLinks.some((link) => link.from === id || link.to === id);
    }

    function pruneRecordLinks() {
      const ids = new Set(records.map((record) => record.id));
      const next = recordLinks.filter((link) => ids.has(link.from) && ids.has(link.to));
      if (linkSourceId && !ids.has(linkSourceId)) linkSourceId = "";
      if (next.length === recordLinks.length) return;
      const removed = recordLinks.filter((link) => !ids.has(link.from) || !ids.has(link.to));
      recordLinks = next;
      if (!linksSupported || !workZone) {
        saveRecordLinks();
        return;
      }
      removed.forEach((link) => {
        sb.from(KILIST_LINKS_TABLE)
          .delete()
          .eq("work_zone", workZone)
          .eq("from_id", link.from)
          .eq("to_id", link.to)
          .then(({ error }) => {
            if (error) console.warn("刪除失效弧線失敗", error);
          });
      });
    }
    if (workZone && workZone !== "0") {
      pageTitleEl.textContent = `Kilist（工區 ${workZone}）`;
      document.title = `Kilist（工區 ${workZone}）`;
    }

    let zonePersons = [];
    let vendorList = [];

    function loadVendorList() {
      try {
        const raw = localStorage.getItem(VENDOR_STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        vendorList = Array.isArray(parsed)
          ? parsed.map((v) => String(v || "").trim()).filter(Boolean)
          : [];
      } catch {
        vendorList = [];
      }
    }

    function saveVendorList() {
      try {
        localStorage.setItem(VENDOR_STORAGE_KEY, JSON.stringify(vendorList));
      } catch (err) {
        console.warn("儲存廠商清單失敗", err);
      }
    }

    function mergeVendorsFromRecords(rows) {
      const known = new Set(vendorList);
      let changed = false;
      (rows || []).forEach((row) => {
        const name = String(row.item || "").trim();
        if (name && !known.has(name)) {
          known.add(name);
          vendorList.push(name);
          changed = true;
        }
      });
      if (changed) saveVendorList();
    }

    function fillVendorSelect(selectEl, selectedValue, options = {}) {
      const {
        placeholder = "請選擇廠商",
        allowEmpty = true
      } = options;
      const prev = selectedValue != null ? String(selectedValue) : selectEl.value;
      selectEl.innerHTML = "";
      if (allowEmpty) {
        const first = document.createElement("option");
        first.value = "";
        first.textContent = placeholder;
        selectEl.appendChild(first);
      }
      vendorList.forEach((name) => {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        selectEl.appendChild(option);
      });
      if (prev && [...selectEl.options].some((o) => o.value === prev)) {
        selectEl.value = prev;
      } else {
        selectEl.value = "";
      }
    }

    function refreshVendorSelects(preserveFilter = true) {
      const filterPrev = preserveFilter ? filterVendorEl.value : "";
      fillVendorSelect(vendorSelectEl, vendorSelectEl.value, {
        placeholder: "請選擇廠商"
      });
      fillVendorSelect(filterVendorEl, filterPrev, {
        placeholder: "全部廠商"
      });
    }

    function renderVendorModalList() {
      if (vendorModalHintEl) vendorModalHintEl.hidden = !vendorList.length;
      if (!vendorList.length) {

    function moveVendorDragItem(clientY) {
      if (!vendorDrag) return;
      const item = vendorDrag.item;
      const listRect = vendorModalListEl.getBoundingClientRect();
      if (clientY < listRect.top + 32) vendorModalListEl.scrollTop -= 16;
      else if (clientY > listRect.bottom - 32) vendorModalListEl.scrollTop += 16;

      const items = [...vendorModalListEl.querySelectorAll(".vendor-modal-item")];
      const dragIndex = items.indexOf(item);
      if (dragIndex < 0 || !items.length) return;
      const firstRect = items[0].getBoundingClientRect();
      const lastRect = items[items.length - 1].getBoundingClientRect();
      let targetIndex = dragIndex;
      if (clientY <= firstRect.top) {
        targetIndex = 0;
      } else if (clientY >= lastRect.bottom) {
        targetIndex = items.length - 1;
      } else {
        for (let i = 0; i < items.length; i += 1) {
          if (i === dragIndex) continue;
          const rect = items[i].getBoundingClientRect();
          const mid = rect.top + rect.height / 2;
          if (i < dragIndex && clientY < mid) {
            targetIndex = i;
            break;
          }
          if (i > dragIndex && clientY > mid) targetIndex = i;
        }
      }
      if (targetIndex === dragIndex) return;
      const target = items[targetIndex];
      if (dragIndex < targetIndex) target.after(item);
      else target.before(item);
    }

    async function loadRecords() {
      if (!workZone && !viewerAllZones) {
        renderRecords();

      const generation = ++loadGeneration;
      try {
        let columns = KILIST_COLUMNS;
        let query = await scopeKilistZone(
          sb.from(KILIST_TABLE).select(columns)
        ).order("created_at", { ascending: true });
        if (generation !== loadGeneration) return;
        if (query.error && /sort_order/i.test(query.error.message || "")) {
          sortOrderSupported = false;
          columns = KILIST_COLUMNS.replace(", sort_order", "");
          query = await scopeKilistZone(
            sb.from(KILIST_TABLE).select(columns)
          ).order("created_at", { ascending: true });
          if (generation !== loadGeneration) return;
        }
        if (query.error) throw new Error(query.error.message);
        if (generation !== loadGeneration) return;
        if (movingRecord || addingRecord || savingLink || records.some(isRecordBusy)) return;
        records.length = 0;
        (query.data || []).forEach((row) => records.push(normalizeRow(row)));
        const importedLocalOrder = applyImportedLocalOrder();
        mergeVendorsFromRecords(records);
        refreshVendorSelects();
        await syncRecordLinks();
        if (generation !== loadGeneration) return;
        renderRecords();
        if (importedLocalOrder && sortOrderSupported) {
          try {
            await uploadSortOrders(records);
            clearLocalRecordOrder();

    function applyImportedLocalOrder() {
      if (!recordOrder.length || records.some((record) => Number.isFinite(record.sortOrder))) {
        if (records.some((record) => Number.isFinite(record.sortOrder))) clearLocalRecordOrder();
        return false;
      }
      const byId = new Map(records.map((record) => [record.id, record]));
      const sequence = [];
      const seen = new Set();
      recordOrder.forEach((id) => {
        const record = byId.get(id);
        if (!record || seen.has(record)) return;
        sequence.push(record);
        seen.add(record);
      });
      records
        .filter((record) => !seen.has(record))
        .sort((a, b) => new Date(a.createdAt || 0).getTime() - new Date(b.createdAt || 0).getTime())
        .forEach((record) => sequence.push(record));
      sequence.forEach((record, index) => {
        record.sortOrder = (index + 1) * 10;
      });
      return true;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")

    function formatTime(date) {

    let linkDrawFrame = 0;

    function linkPoint(dot, boardRect) {
      const rect = dot.getBoundingClientRect();
      return {
        x: rect.left + rect.width / 2 - boardRect.left,
        y: rect.top + rect.height / 2 - boardRect.top
      };
    }

    function shortenToward(from, to, distance) {
      const dx = to.x - from.x;
      const dy = to.y - from.y;
      const length = Math.hypot(dx, dy) || 1;
      return {
        x: to.x - (dx / length) * distance,
        y: to.y - (dy / length) * distance
      };
    }

    function circleArc(start, through, end) {
      const ax = start.x;
      const ay = start.y;
      const bx = through.x;
      const by = through.y;
      const cx = end.x;
      const cy = end.y;
      const d = 2 * (ax * (by - cy) + bx * (cy - ay) + cx * (ay - by));
      if (!Number.isFinite(d) || Math.abs(d) < 0.01) {
        return `L ${cx.toFixed(1)} ${cy.toFixed(1)}`;
      }
      const a2 = ax * ax + ay * ay;
      const b2 = bx * bx + by * by;
      const c2 = cx * cx + cy * cy;
      const ux = (a2 * (by - cy) + b2 * (cy - ay) + c2 * (ay - by)) / d;
      const uy = (a2 * (cx - bx) + b2 * (ax - cx) + c2 * (bx - ax)) / d;
      const radius = Math.hypot(ax - ux, ay - uy);
      const cross = (bx - ax) * (cy - ay) - (by - ay) * (cx - ax);
      const sweep = cross > 0 ? 1 : 0;
      return `A ${radius.toFixed(1)} ${radius.toFixed(1)} 0 0 ${sweep} ${cx.toFixed(1)} ${cy.toFixed(1)}`;
    }

    function drawRecordLinks() {
      if (!recordLinkPathsEl || !recordBoardEl) return;
      if (!listEl.classList.contains("record-list")) {
        recordLinkPathsEl.innerHTML = "";
        window.cancelAnimationFrame(linkParticleFrame);
        return;
      }
      const boardRect = recordBoardEl.getBoundingClientRect();
      const points = new Map();
      listEl.querySelectorAll(".link-dot").forEach((dot) => {
        if (dot.dataset.id) points.set(dot.dataset.id, linkPoint(dot, boardRect));
      });
      const drawable = [];
      recordLinks.forEach((link) => {
        const start = points.get(link.from);
        const end = points.get(link.to);
        if (!start || !end) return;
        const dy = Math.abs(end.y - start.y);
        drawable.push({ start, end, dy });
      });
      const nearestDy = drawable.reduce((min, link) => link.dy > 0 ? Math.min(min, link.dy) : min, Infinity);
      const baseRight = Number.isFinite(nearestDy) ? nearestDy * 0.1 : 0;
      recordLinkPathsEl.innerHTML = drawable.map((link) => {
        const origin = { x: link.start.x, y: link.start.y };
        const target = { x: link.end.x, y: link.end.y };
        const scale = nearestDy > 0 && link.dy > 0 ? link.dy / nearestDy : 1;
        const right = Math.min(baseRight * scale * 1.5, 345);
        const through = {
          x: (origin.x + target.x) / 2 + right,
          y: (origin.y + target.y) / 2
        };
        const tip = shortenToward(through, target, 7);
        const path = `M ${origin.x.toFixed(1)} ${origin.y.toFixed(1)} ${circleArc(origin, through, tip)}`;
        return `<path class="record-link-line" d="${path}" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.6" marker-end="url(#record-link-arrow)"></path><circle class="record-link-particle" r="2.6" fill="url(#record-link-grain)"></circle><circle class="record-link-particle" r="2.6" fill="url(#record-link-grain)"></circle>`;
      }).join("");
      window.cancelAnimationFrame(linkParticleFrame);
      const particles = [...recordLinkPathsEl.querySelectorAll(".record-link-particle")];
      const motions = [...recordLinkPathsEl.querySelectorAll(".record-link-line")].map((line, index) => {
        const pair = particles.slice(index * 2, index * 2 + 2);
        const length = line.getTotalLength();
        return pair.length === 2 && length ? { line, particles: pair, length, duration: Math.max(1200, length * 4.5) * 4 } : null;
      }).filter(Boolean);
      if (!motions.length) return;
      const started = performance.now();
      const moveParticles = (now) => {
        motions.forEach((item) => {
          item.particles.forEach((particle, index) => {
            if (!particle.isConnected) return;
            const progress = ((now - started) / item.duration + index * 0.5) % 1;
            const point = item.line.getPointAtLength(item.length * progress);
            particle.setAttribute("cx", point.x.toFixed(1));
            particle.setAttribute("cy", point.y.toFixed(1));
          });
        });
        if (motions.some((item) => item.particles.some((particle) => particle.isConnected))) {
          linkParticleFrame = window.requestAnimationFrame(moveParticles);
        }
      };
      linkParticleFrame = window.requestAnimationFrame(moveParticles);
    }

    function refreshLinkDots() {
      listEl.querySelectorAll(".link-dot").forEach((dot) => {
        const id = dot.dataset.id || "";
        const isSource = id === linkSourceId;
        dot.classList.toggle("is-source", isSource);
        dot.classList.toggle("is-linked", recordHasLink(id));
        dot.setAttribute("aria-pressed", isSource ? "true" : "false");
        if (isSource) dot.title = "再點一次可取消選取";
        else if (linkSourceId) dot.title = "點此完成連線";
        else dot.title = "點此開始連線";
      });
    }

    async function toggleRecordLink(id) {
      if (!id || savingLink) return;
      if (!linkSourceId) {
        linkSourceId = id;
        refreshLinkDots();
        return;
      }
      if (linkSourceId === id) {
        linkSourceId = "";
        refreshLinkDots();
        return;
      }
      const from = linkSourceId;
      const existing = recordLinks.findIndex((link) => link.from === from && link.to === id);
      const removed = existing >= 0;
      if (removed) recordLinks.splice(existing, 1);
      else recordLinks.push({ from, to: id });
      linkSourceId = "";
      refreshLinkDots();
      scheduleDrawLinks();
      if (!workZone || !linksSupported) {
        saveRecordLinks();
        if (workZone && !linksSupported) {
          alert("弧線尚未同步到伺服器，請至 Supabase Dashboard → SQL Editor 執行 SQL/kilist_records.sql");
        }
        return;
      }
      savingLink = true;
      try {
        if (removed) {
          const { error } = await sb
            .from(KILIST_LINKS_TABLE)
            .delete()
            .eq("work_zone", workZone)
            .eq("from_id", from)
            .eq("to_id", id);
          if (error) throw new Error(error.message);
        } else {
          const { error } = await sb
            .from(KILIST_LINKS_TABLE)
            .insert({ work_zone: workZone, from_id: from, to_id: id });
          if (error) throw new Error(error.message);
        }
        clearLocalRecordLinks();
      } catch (err) {
        console.error("上傳弧線失敗", err);
        if (removed) recordLinks.push({ from, to: id });
        else {
          const index = recordLinks.findIndex((link) => link.from === from && link.to === id);
          if (index >= 0) recordLinks.splice(index, 1);
        }
        refreshLinkDots();
        scheduleDrawLinks();
        alert(`上傳弧線失敗：${formatSupabaseError(err)}`);
      } finally {
        savingLink = false;
      }
    }

    const NOTE_PENCIL_SVG = `<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M9.7 2.3 13.7 6.3 5.1 14.9 1.1 15.3 1.5 11.3 9.7 2.3Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path><path d="M8.4 3.6 12.4 7.6" fill="none" stroke="currentColor" stroke-width="1.4"></path></svg>`;

    function renderRecords() {
      if (!records.length) {

          const displayNotes = notesNewestFirst(supplementalNotes(r.notes));
          const NOTES_PREVIEW = 3;
          const hasMoreNotes = displayNotes.length > NOTES_PREVIEW;
          const visibleNotes = r.notesExpanded || !hasMoreNotes

          const notesToggleHtml = hasMoreNotes

                      <button type="button" class="note-add-btn is-open open-add-btn" data-index="${index}" aria-label="新增開項">＋</button>

          const openItems = openItemsOf(r.notes);
          const openItemsHtml = openItems.length
            ? `<div class="open-items">${openItems.map((item) => {

                <div class="open-item${item.checked ? " is-checked" : ""}">

                  ${editingItem
                    ? `<input type="text" class="open-item-input open-item-edit-input" data-index="${index}" data-open-id="${openId}" value="${escapeHtml(item.text || "")}" aria-label="編輯開項說明">
                       <button type="button" class="note-confirm-btn open-item-edit-confirm" data-index="${index}" data-open-id="${openId}">確定</button>
                       <button type="button" class="note-cancel-btn open-item-edit-cancel" data-index="${index}" data-open-id="${openId}">取消</button>`
                    : `<span class="open-item-text">${escapeHtml(item.text || "")}</span>
                       ${item.checked ? `<span class="open-item-check-info">${escapeHtml(item.checkedBy || "")} ${escapeHtml(formatTs(item.checkedAt))}</span>` : ""}
                       <button type="button" class="open-item-edit" data-index="${index}" data-open-id="${openId}" aria-label="編輯開項" title="編輯開項">
                         <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M9.7 2.3 13.7 6.3 5.1 14.9 1.1 15.3 1.5 11.3 9.7 2.3Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path><path d="M8.4 3.6 12.4 7.6" fill="none" stroke="currentColor" stroke-width="1.4"></path></svg>
                       </button>`}
                  <button type="button" class="open-item-remove" data-index="${index}" data-open-id="${openId}" aria-label="刪除開項">×</button>
                </div>`;
              }).join("")}</div>`
            : "";

          const mainContent = r.isEditing
            ? `<div class="record-edit-row">
                <select class="edit-person" data-index="${index}" aria-label="承辦">${buildPersonOptionsHtml(r.personId, r.person)}</select>
                <select class="edit-item" data-index="${index}" aria-label="廠商">${buildVendorOptionsHtml(r.item)}</select>
                <input type="text" class="edit-note" data-index="${index}" value="${escapeHtml(r.note)}" placeholder="內容" aria-label="內容">
                <button type="button" class="edit-save-btn" data-index="${index}">儲存</button>
                <button type="button" class="edit-cancel-btn" data-index="${index}">取消</button>
              </div>`
            : `<span class="record-content">${escapeHtml(content)}</span>
              <span class="record-time">${escapeHtml(formatTs(r.createdAt))}</span>
              ${checkInfo}
              <button type="button" class="edit-btn" data-index="${index}">編輯</button>
              <button type="button" class="check-btn ${r.checkedBy ? "is-checked" : ""}" data-index="${index}">
                ${r.checkedBy ? "已完成" : "完成"}
              </button>
              <button type="button" class="remind-btn ${r.isRemind ? "is-on" : ""}" data-index="${index}">
                ${r.isRemind ? "取消提醒" : "提醒"}
              </button>
              ${canPinRecords()
                ? `<button type="button" class="pin-btn ${r.isPinned ? "is-on" : ""}" data-index="${index}">
                    ${r.isPinned ? "取消置頂" : "置頂"}
                  </button>`
                : ""}
              ${canDeleteRecords() ? `<button type="button" class="delete-btn" data-index="${index}">刪除</button>` : ""}`;

          const itemClass = [
            "record-item",
            r.isPinned ? "is-pinned" : "",
            isRemindHighlight(r) ? "is-remind" : "",
            r.checkedBy ? "is-checked" : ""
          ].filter(Boolean).join(" ");

          const pos = entries.findIndex((entry) => entry.index === index);
          const canUp = !sortByCreatedAt && pos > 0 && orderTier(entries[pos - 1].r) === orderTier(r);
          const canDown = !sortByCreatedAt && pos >= 0 && pos < entries.length - 1 && orderTier(entries[pos + 1].r) === orderTier(r);
          const orderTitle = sortByCreatedAt ? "依新增時間排序時無法調整順序" : "";
          const linkTitle = linkSourceId === r.id
            ? "再點一次可取消選取"
            : linkSourceId
              ? "點此完成連線"
              : "點此開始連線";
          return `
          <div class="${itemClass}">
            <div class="record-order">
              <button type="button" class="order-btn order-up" data-index="${index}" aria-label="上移" title="${orderTitle || "上移"}" ${canUp ? "" : "disabled"}>
                <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3.2 10.2 8 5.2 12.8 10.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
              </button>
              <button type="button" class="order-btn order-down" data-index="${index}" aria-label="下移" title="${orderTitle || "下移"}" ${canDown ? "" : "disabled"}>
                <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3.2 5.8 8 10.8 12.8 5.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
              </button>
            </div>
            <button type="button" class="${linkDotClass(r.id)}" data-id="${escapeHtml(r.id)}" aria-label="連線" aria-pressed="${linkSourceId === r.id ? "true" : "false"}" title="${escapeHtml(linkTitle)}"></button>
            <div class="record-main">
              ${mainContent}

            ${openItemsHtml}

        })
        .join("");
      scheduleDrawLinks();
    }

    function linkDotClass(id) {
      const classes = ["link-dot"];
      if (id === linkSourceId) classes.push("is-source");
      if (recordHasLink(id)) classes.push("is-linked");
      return classes.join(" ");
    }

    const NOTE_FONT_SIZES = new Set(["100%", "125%", "150%", "175%", "200%"]);
    const noteSelectionMap = new WeakMap();

    function normalizeNoteColor(value) {
      const raw = String(value || "").trim();
      if (/^#(?:[0-9a-f]{3}|[0-9a-f]{6})$/i.test(raw)) return raw;
      const rgb = raw.match(/^rgba?\(\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})/i);
      if (!rgb) return "";
      const nums = rgb.slice(1, 4).map(Number);
      if (nums.some((n) => n > 255)) return "";
      return `rgb(${nums.join(", ")})`;
    }

    function sanitizeNoteHtml(html) {
      const template = document.createElement("template");
      template.innerHTML = String(html || "");
      const allowed = new Set(["B", "STRONG", "I", "EM", "U", "SPAN", "DIV", "P", "BR", "BLOCKQUOTE", "FONT"]);
      const dropped = new Set(["SCRIPT", "STYLE", "IFRAME", "OBJECT", "EMBED", "LINK", "META"]);
      const clean = (node) => {
        [...node.childNodes].forEach((child) => {
          if (child.nodeType === Node.TEXT_NODE) {
            child.textContent = child.textContent.replace(/\u200b/g, "");
            return;
          }
          if (child.nodeType !== Node.ELEMENT_NODE) {
            child.remove();
            return;
          }
          if (dropped.has(child.tagName)) {
            child.remove();
            return;
          }
          clean(child);
          if (!allowed.has(child.tagName)) {
            const parent = child.parentNode;
            while (child.firstChild) parent.insertBefore(child.firstChild, child);
            child.remove();
            return;
          }
          const style = {};
          const fontSize = child.style?.fontSize || "";
          if (NOTE_FONT_SIZES.has(fontSize)) style.fontSize = fontSize;
          const color = normalizeNoteColor(child.style?.color || child.getAttribute("color") || "");
          if (color) style.color = color;
          const weight = child.style?.fontWeight || "";
          if (weight === "bold" || weight === "700") style.fontWeight = "700";
          if (child.style?.fontStyle === "italic") style.fontStyle = "italic";
          const decoration = `${child.style?.textDecoration || ""} ${child.style?.textDecorationLine || ""}`;
          if (decoration.includes("underline")) style.textDecoration = "underline";
          const margin = child.style?.marginLeft || "";
          if (/^\d+(?:\.\d+)?px$/.test(margin)) {
            const amount = Number.parseFloat(margin);
            if (amount > 0 && amount <= 240) style.marginLeft = `${amount}px`;
          }
          [...child.attributes].forEach((attr) => child.removeAttribute(attr.name));
          Object.entries(style).forEach(([key, value]) => {
            child.style[key] = value;
          });
        });
      };
      clean(template.content);
      return template.innerHTML.replace(/\u200b/g, "").trim();
    }

    function notePlainText(html) {
      const holder = document.createElement("div");
      holder.innerHTML = String(html || "");
      return (holder.textContent || "").replace(/\u200b/g, "").trim();
    }

    function decodeHtmlEntities(value) {
      const holder = document.createElement("textarea");
      holder.innerHTML = String(value || "");
      return holder.value;
    }

    function renderNoteText(text) {
      const raw = String(text || "");
      if (!/<\/?(b|strong|i|em|u|span|div|p|br|blockquote|font)\b/i.test(raw)) {
        return escapeHtml(decodeHtmlEntities(raw));
      }
      return sanitizeNoteHtml(raw);
    }

    let noteSelectionLock = false;
    let noteSelectionFrozen = false;

    function rememberNoteSelection(editor) {
      if (noteSelectionLock || noteSelectionFrozen) return;
      const selection = window.getSelection();
      if (!selection || !selection.rangeCount || !editor) return;
      const range = selection.getRangeAt(0);
      if (range.commonAncestorContainer !== editor && !editor.contains(range.commonAncestorContainer)) return;
      noteSelectionMap.set(editor, range.cloneRange());
    }

    function focusNoteEditor(editor) {
      if (!editor) return;
      const range = noteSelectionMap.get(editor);
      noteSelectionLock = true;
      editor.focus();
      if (range) {
        try {
          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
        } catch (_) {
          noteSelectionMap.delete(editor);
        }
      }
      noteSelectionLock = false;
    }

    function syncNoteToolbar(editor) {
      const toolbar = editor?.closest(".note-editor")?.querySelector(".note-toolbar");
      if (!toolbar) return;
      ["bold", "italic", "underline"].forEach((command) => {
        const button = toolbar.querySelector(`[data-cmd="${command}"]`);
        let active = false;
        try {
          active = document.queryCommandState(command);
        } catch (_) {}
        button?.classList.toggle("is-on", active);
        button?.setAttribute("aria-pressed", active ? "true" : "false");
      });
    }

    function applyNoteFontSize(editor, size) {
      if (!editor || !NOTE_FONT_SIZES.has(size)) return;
      focusNoteEditor(editor);
      const selection = window.getSelection();
      if (!selection || !selection.rangeCount) return;
      const range = selection.getRangeAt(0);
      if (range.commonAncestorContainer !== editor && !editor.contains(range.commonAncestorContainer)) return;
      const span = document.createElement("span");
      span.style.fontSize = size;
      if (range.collapsed) {
        span.appendChild(document.createTextNode("\u200b"));
        range.insertNode(span);
        const caret = document.createRange();
        caret.setStart(span.firstChild, 1);
        caret.collapse(true);
        selection.removeAllRanges();
        selection.addRange(caret);
      } else {
        span.appendChild(range.extractContents());
        range.insertNode(span);
        selection.removeAllRanges();
        const next = document.createRange();
        next.selectNodeContents(span);
        next.collapse(false);
        selection.addRange(next);
      }
      editor.dataset.empty = notePlainText(editor.innerHTML) ? "false" : "true";
      rememberNoteSelection(editor);
    }

    function savedNoteRange(editor) {
      const saved = editor ? noteSelectionMap.get(editor) : null;
      if (!saved) return null;
      try {
        const range = saved.cloneRange();
        if (range.commonAncestorContainer !== editor && !editor.contains(range.commonAncestorContainer)) return null;
        return range;
      } catch (_) {
        noteSelectionMap.delete(editor);
        return null;
      }
    }

    function rangeCoversElement(range, element) {
      const probe = document.createRange();
      probe.selectNodeContents(element);
      return range.compareBoundaryPoints(Range.START_TO_START, probe) === 0
        && range.compareBoundaryPoints(Range.END_TO_END, probe) === 0;
    }

    function holdNoteSelection(editor) {
      if (!editor) return;
      const selection = window.getSelection();
      if (selection && selection.rangeCount) {
        const range = selection.getRangeAt(0);
        const inside = range.commonAncestorContainer === editor || editor.contains(range.commonAncestorContainer);
        if (inside && !range.collapsed) noteSelectionMap.set(editor, range.cloneRange());
      }
      noteSelectionFrozen = true;
    }

    function restoreNoteSelection(editor) {
      const range = savedNoteRange(editor);
      if (!editor || !range) return;
      noteSelectionLock = true;
      editor.focus();
      try {
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        noteSelectionMap.set(editor, range.cloneRange());
      } catch (_) {
        noteSelectionMap.delete(editor);
      }
      noteSelectionLock = false;
    }

    function applyNoteColor(editor, color) {
      const normalized = normalizeNoteColor(color);
      if (!editor || !normalized) return;
      const range = savedNoteRange(editor);
      if (!range || range.collapsed) return;
      const ancestor = range.commonAncestorContainer.nodeType === 1
        ? range.commonAncestorContainer
        : range.commonAncestorContainer.parentElement;
      if (ancestor?.dataset?.noteColor === "1" && rangeCoversElement(range, ancestor)) {
        ancestor.style.color = normalized;
      } else {
        const span = document.createElement("span");
        span.dataset.noteColor = "1";
        span.style.color = normalized;
        span.appendChild(range.extractContents());
        range.insertNode(span);
        const next = document.createRange();
        next.selectNodeContents(span);
        noteSelectionMap.set(editor, next.cloneRange());
      }
      editor.dataset.empty = notePlainText(editor.innerHTML) ? "false" : "true";
    }

    function applyNoteCommand(editor, command, value) {
      if (!editor) return;
      if (command === "color") {
        applyNoteColor(editor, value);
        return;
      }
      focusNoteEditor(editor);
      if (command === "bold" || command === "italic" || command === "underline" || command === "indent" || command === "outdent") {
        document.execCommand("styleWithCSS", false, false);
        document.execCommand(command, false, null);
      }
      editor.dataset.empty = notePlainText(editor.innerHTML) ? "false" : "true";
      rememberNoteSelection(editor);
      syncNoteToolbar(editor);
    }

    function cancelNote(index) {
      const record = records[index];
      if (!record) return;
      record.isAddingNote = false;
      queueRemoteRefresh(record.id);
      renderRecords();
    }

    function beginRecordSave(record) {
      if (!record || record._saving) return false;
      record._saving = true;
      return true;
    }

    function enqueueRecordSave(id, task) {
      const prev = recordSaveChain.get(id) || Promise.resolve();
      const run = prev.catch(() => {}).then(task);
      const tracked = run.finally(() => {
        if (recordSaveChain.get(id) === tracked) recordSaveChain.delete(id);
      });
      recordSaveChain.set(id, tracked);
      return run;
    }

    async function finishRecordSave(record, task) {
      try {
        await enqueueRecordSave(record.id, task);
      } finally {
        record._saving = false;
      }
    }

    function cloneNotes(notes) {
      return JSON.parse(JSON.stringify(Array.isArray(notes) ? notes : []));
    }

    function noteIdentity(note) {
      if (note?.id) return `id:${note.id}`;
      return `legacy:${note?.kind || "text"}|${note?.at || ""}|${note?.by || ""}|${note?.text || ""}`;
    }

    function noteConflict(message) {
      const err = new Error(message);
      err.code = "NOTE_CONFLICT";
      return err;
    }

    function replaceNote(notes, key, mapper) {
      const index = notes.findIndex((note) => noteIdentity(note) === key);
      if (index < 0) {
        const err = new Error("這則內容已變更或已被刪除，請再確認。");
        err.code = "NOTE_MISSING";
        throw err;
      }
      const nextNote = mapper(notes[index]);
      if (nextNote === notes[index]) return notes;
      const next = notes.slice();
      next[index] = nextNote;
      return next;
    }

    function removeNoteByKey(notes, key) {
      const next = notes.filter((note) => noteIdentity(note) !== key);
      return next.length === notes.length ? notes : next;
    }

    async function commitNotes(record, mutate) {
      for (let attempt = 0; attempt < 4; attempt += 1) {
        const { data, error } = await sb.from(KILIST_TABLE).select("notes").eq("id", record.id).maybeSingle();
        if (error) throw new Error(error.message);
        if (!data) {
          const index = records.indexOf(record);
          if (index >= 0) records.splice(index, 1);
          throw new Error("這筆資料已不存在");
        }
        const serverNotes = cloneNotes(data.notes);
        const nextNotes = mutate(serverNotes);
        if (nextNotes === serverNotes) {
          record.notes = serverNotes;
          return;
        }
        if (notesRpcSupported) {
          const rpc = await sb.rpc("kilist_update_notes", {
            p_id: record.id,
            p_expected: serverNotes,
            p_next: nextNotes
          });
          if (rpc.error) {
            const msg = rpc.error.message || "";
            if (/kilist_update_notes|PGRST202|schema cache|Could not find the function/i.test(msg)) {
              notesRpcSupported = false;
              if (!notesRpcWarned) {
                notesRpcWarned = true;
                alert("多人同時編輯補充說明的保護尚未啟用。請至 Supabase Dashboard → SQL Editor 執行 SQL/kilist_records.sql 後重新整理。");
              }
            } else {
              throw new Error(msg);
            }
          } else if (rpc.data === true || rpc.data === "true") {
            record.notes = nextNotes;
            return;
          } else if (notesRpcSupported) {
            continue;
          }
        }
        const updated = await sb.from(KILIST_TABLE).update({ notes: nextNotes }).eq("id", record.id).select("notes");
        if (updated.error) throw new Error(updated.error.message);
        record.notes = Array.isArray(updated.data?.[0]?.notes) ? updated.data[0].notes : nextNotes;
        return;
      }
      throw new Error("這筆資料剛被其他人更新，請再試一次");
    }

    async function recoverRecord(record, err) {
      const message = String(err?.message || "");
      const shouldRefresh = err?.code === "NOTE_CONFLICT"
        || err?.code === "NOTE_MISSING"
        || err?.code === "STALE_RECORD"
        || /已不存在|剛被其他人/.test(message);
      if (!shouldRefresh || !record) return;
      try {
        await refreshRecordFromServer(record);
      } catch (refreshErr) {
        console.warn("重新讀取資料失敗", refreshErr);
      }
    }

    function staleRecordError() {
      const err = new Error("這筆資料剛被其他人更新，已改為最新內容。");
      err.code = "STALE_RECORD";
      return err;
    }

    async function patchRecord(record, payload, expect) {
      let query = sb.from(KILIST_TABLE).update(payload).eq("id", record.id);
      if (expect) {
        Object.entries(expect).forEach(([key, value]) => {
          if (value == null) query = query.is(key, null);
          else query = query.eq(key, value);
        });
      }
      const { data, error } = await query.select("id");
      if (error) throw new Error(error.message);
      if (!Array.isArray(data) || !data.length) throw staleRecordError();
    }

    async function persistRecordEdits(record, values) {
      const nextPersonId = values.personId || "";
      const nextPerson = values.personName;
      const nextItem = values.item;
      const nextNote = values.note;
      const personChanged = nextPersonId !== (record.personId || "") || nextPerson !== record.person;
      const itemChanged = nextItem !== record.item;
      const noteChanged = nextNote !== record.note;
      if (!personChanged && !itemChanged && !noteChanged) {
        record.isEditing = false;
        renderRecords();
        return;
      }
      const { data: fresh, error } = await sb
        .from(KILIST_TABLE)
        .select("person_id, person_name, item, note")
        .eq("id", record.id)
        .maybeSingle();
      if (error) throw new Error(error.message);
      if (!fresh) {
        const index = records.indexOf(record);
        if (index >= 0) records.splice(index, 1);
        record.isEditing = false;
        renderRecords();
        throw new Error("這筆資料已不存在");
      }
      const serverPersonId = fresh.person_id ? String(fresh.person_id) : "";
      const serverPerson = String(fresh.person_name ?? "").trim();
      const serverItem = String(fresh.item ?? "").trim();
      const serverNote = String(fresh.note ?? "").trim();
      const dirty = {};
      const expect = {};
      const blocked = [];
      if (personChanged) {
        if (serverPersonId !== (record.personId || "") || serverPerson !== record.person) {
          blocked.push("承辦");
          record.personId = serverPersonId;
          record.person = serverPerson;
        } else {
          dirty.person_id = nextPersonId || null;
          dirty.person_name = nextPerson;
          expect.person_id = fresh.person_id;
          expect.person_name = fresh.person_name ?? "";
        }
      }
      if (itemChanged) {
        if (serverItem !== record.item) {
          blocked.push("廠商");
          record.item = serverItem;
        } else {
          dirty.item = nextItem;
          expect.item = fresh.item ?? "";
        }
      }
      if (noteChanged) {
        if (serverNote !== record.note) {
          blocked.push("內容");
          record.note = serverNote;
        } else {
          dirty.note = nextNote;
          expect.note = fresh.note ?? "";
        }
      }
      if (Object.keys(dirty).length) {
        try {
          await patchRecord(record, dirty, expect);
        } catch (err) {
          if (err?.code !== "STALE_RECORD") throw err;
          await refreshRecordFromServer(record);
          record.isEditing = false;
          renderRecords();
          alert("這筆資料剛被其他人更新，已改為最新內容。");
          return;
        }
        if (Object.prototype.hasOwnProperty.call(dirty, "person_name")) {
          record.personId = nextPersonId;
          record.person = nextPerson;
        }
        if (Object.prototype.hasOwnProperty.call(dirty, "item")) {
          record.item = nextItem;
          if (nextItem && !vendorList.includes(nextItem)) {
            vendorList.push(nextItem);
            saveVendorList();
            refreshVendorSelects();
          }
        }
        if (Object.prototype.hasOwnProperty.call(dirty, "note")) record.note = nextNote;
      }
      record.isEditing = false;
      renderRecords();
      if (blocked.length) alert(`這筆的${blocked.join("、")}剛被其他人更新，已保留對方的內容。`);
    }

        id: crypto.randomUUID(),
        text: html,
        by: currentUsername,

    async function saveNoteEdit(index, noteIndex) {
      const record = records[index];
      const note = record?.notes?.[noteIndex];
      if (!record || !note || note.kind === "open" || record._saving) return;
      const input = listEl.querySelector(`.note-edit-input[data-index="${index}"]`);
      const html = sanitizeNoteHtml(input?.innerHTML || "");
      const text = notePlainText(html);
      if (!text) {

      if (!beginRecordSave(record)) return;
      const key = noteIdentity(note);
      const originalText = note.text || "";
      try {
        await finishRecordSave(record, () => commitNotes(record, (notes) => replaceNote(notes, key, (item) => {
          if ((item.text || "") !== originalText) throw noteConflict("這則補充說明剛被其他人更新，已改為最新內容。");
          return { ...item, id: item.id || crypto.randomUUID(), text: html };
        })));
        record.editingNoteIndex = -1;
      } catch (err) {
        console.error("編輯補充說明失敗", err);
        await recoverRecord(record, err);
        record.editingNoteIndex = -1;
        alert(`編輯補充說明失敗：${formatSupabaseError(err)}`);
      }
      renderRecords();
    }

        renderRecords();
        return;
      }
      if (!beginRecordSave(record)) {
        renderRecords();

      const checkedAt = new Date().toISOString();
      try {
        await finishRecordSave(record, () => commitNotes(record, (notes) => replaceNote(notes, `id:${openId}`, (note) => {
          if (checked) {
            if (note.checked) return note;
            return { ...note, checked: true, checkedBy: currentUsername, checkedAt };
          }
          if (!note.checked) return note;
          return { ...note, checked: false, checkedBy: "", checkedAt: "" };
        })));
      } catch (err) {
        console.error("更新補充開項失敗", err);
        await recoverRecord(record, err);
        alert(`更新補充開項失敗：${formatSupabaseError(err)}`);

          record.checkedBy = payload.checked_by;
          record.checkedAt = payload.checked_at || "";

      if (!canDeleteRecords()) {
        alert("僅權限等級 0 或 1 的使用者可刪除紀錄。");
        return;
      }
      const label = [record.person, record.item, record.note].filter(Boolean).join(" | ");
      if (!confirm(`確定要刪除「${label}」嗎？此動作無法復原。`)) return;
      try {
        const { error } = await sb
          .from(KILIST_TABLE)
          .delete()
          .eq("id", record.id);
        if (error) throw new Error(error.message);
        records.splice(index, 1);
        recordLinks = recordLinks.filter((link) => link.from !== record.id && link.to !== record.id);
        if (linkSourceId === record.id) linkSourceId = "";
        if (linksSupported) clearLocalRecordLinks();
        else saveRecordLinks();
        renderRecords();
      } catch (err) {
        console.error("刪除紀錄失敗", err);
        alert(`刪除紀錄失敗：${formatSupabaseError(err)}`);

        e.preventDefault();
