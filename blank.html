<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>69內部進度</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4d;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #3d8bfd;
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: radial-gradient(ellipse 120% 100% at 50% -20%, #1e3a5f 0%, var(--bg) 55%);
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px 16px;
      font-family: "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    .page-title {
      margin: 0 0 14px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--text);
      text-align: center;
    }

    .gear-btn {
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      margin: 0;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: color 0.2s, border-color 0.2s, transform 0.15s;
    }

    .gear-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    .gear-btn:active {
      transform: scale(0.95);
    }

    .gear-btn svg {
      width: 22px;
      height: 22px;
    }

    .table-panel {
      width: 100%;
      --checkbox-col-width: 36px;
      --label-col-width: 140px;
      --data-col-width: 273px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
      overflow: hidden;
    }

    .table-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }

    .table-toolbar button:not(.gear-btn) {
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--accent);
      border-color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }

    .table-toolbar button:not(.gear-btn):hover {
      background: rgba(61, 139, 253, 0.12);
    }

    .toolbar-edit-mode-btn.is-active {
      background: rgba(61, 139, 253, 0.2);
      color: #fff;
    }

    .toolbar-edit-mode-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      color: var(--muted);
      border-color: var(--border);
    }

    .toolbar-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      margin-left: 4px;
      min-width: 0;
      flex: 1;
    }

    .toolbar-active-editors {
      font-size: 12px;
      color: #fbbf24;
      font-weight: 600;
      line-height: 1.35;
    }

    .toolbar-active-editors[hidden] {
      display: none !important;
    }

    .toolbar-cloud-status {
      font-size: 12px;
      color: var(--muted);
      transition: opacity 0.35s ease;
    }

    .toolbar-cloud-status.is-error {
      color: var(--danger);
    }

    .toolbar-cloud-status.is-sync-ok {
      font-size: 16px;
      font-weight: 700;
      color: #22c55e;
    }

    .conflict-banner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(248, 113, 113, 0.35);
      background: rgba(248, 113, 113, 0.12);
      color: #fecaca;
      font-size: 13px;
      line-height: 1.45;
    }

    .conflict-banner[hidden] {
      display: none !important;
    }

    .conflict-banner-text {
      flex: 1;
      min-width: 200px;
    }

    .conflict-reload-btn {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid rgba(248, 113, 113, 0.55);
      background: rgba(248, 113, 113, 0.18);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
    }

    .conflict-reload-btn:hover {
      background: rgba(248, 113, 113, 0.3);
    }

    body:not(.is-edit-mode) .edit-reveal,
    body:not(.is-edit-mode) .data-table .move-btns {
      display: none !important;
    }

    body:not(.is-edit-mode) .header-wrap {
      grid-template-columns: 1fr;
    }

    body:not(.is-edit-mode) .row-label-wrap {
      grid-template-columns: 1fr;
    }

    body:not(.is-edit-mode) .table-header-input,
    body:not(.is-edit-mode) .table-row-label-input {
      pointer-events: none;
      cursor: default;
      background: transparent;
    }

    body:not(.is-edit-mode) .data-table .table-header-input:focus,
    body:not(.is-edit-mode) .data-table .table-row-label-input:focus {
      background: transparent;
    }

    .toolbar-widths {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .width-control {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
      min-width: 220px;
    }

    .width-control input[type="text"] {
      width: 88px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
    }

    .width-control input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    .width-unit {
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .table-wrap {
      overflow-x: hidden;
      overflow-y: auto;
      max-height: calc(100vh - 180px);
      padding-bottom: 18px;
    }

    .data-table {
      width: 100%;
      max-width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
    }

    .data-table col.checkbox-col {
      width: var(--checkbox-col-width);
    }

    .data-table col.label-col {
      width: var(--label-col-width);
    }

    .data-table col.data-col {
      width: var(--data-col-width);
    }

    .data-table th,
    .data-table td {
      border: 1px solid var(--border);
      padding: 0;
      vertical-align: middle;
      overflow: hidden;
    }

    .data-table th {
      background: rgba(255, 255, 255, 0.03);
    }

    .data-table thead th {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--panel);
      box-shadow: 0 1px 0 var(--border);
    }

    .data-table input {
      width: 100%;
      min-width: 0;
      padding: 10px 12px;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
    }

    .data-table input:focus {
      outline: none;
      background: rgba(61, 139, 253, 0.08);
    }

    .data-table .table-header-input,
    .data-table .table-row-label-input {
      font-size: 18px;
      font-weight: 600;
    }

    .data-table .table-row-label-input-standalone {
      font-size: calc(18px * 1.3);
      font-weight: 700;
    }

    .checkbox-corner-cell,
    .data-table .row-checkbox-cell {
      width: var(--checkbox-col-width);
      text-align: center;
      vertical-align: middle;
      background: rgba(255, 255, 255, 0.02);
    }

    .data-table .row-standalone-checkbox {
      width: 16px;
      height: 16px;
      margin: 0;
      cursor: pointer;
      accent-color: var(--accent);
    }

    .data-table .row-standalone-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
    }

    .data-table .row-standalone-wrap .table-row-label-input {
      flex: 1;
      min-width: 0;
    }

    .data-table tr.row-standalone td {
      background: rgba(255, 255, 255, 0.04);
    }

    .data-table .header-wrap,
    .data-table .row-label-wrap {
      display: grid;
      gap: 2px;
      align-items: center;
      padding: 2px;
    }

    .data-table .header-wrap {
      grid-template-columns: 1fr 26px;
    }

    .data-table .row-label-wrap {
      grid-template-columns: 30px 1fr 26px;
    }

    .data-table .move-btns {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .data-table .move-btn {
      width: 26px;
      height: 14px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: transparent;
      color: var(--muted);
      font-size: 10px;
      line-height: 1;
      cursor: pointer;
    }

    .data-table .move-btn:hover:not(:disabled) {
      color: var(--accent);
      border-color: var(--accent);
    }

    .data-table .move-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .data-table .cell-btn {
      display: block;
      width: 100%;
      min-width: 0;
      margin: 0;
      padding: 2px 4px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(180deg, #4d9bff 0%, #3d8bfd 100%);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(61, 139, 253, 0.28);
      transition: transform 0.15s, filter 0.2s, background 0.25s, box-shadow 0.25s;
    }

    .data-table .cell-btn:hover {
      filter: brightness(1.08);
    }

    .data-table .cell-btn:active {
      transform: scale(0.97);
    }

    .data-table .cell-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px;
    }

    .data-table .cell-meta {
      width: 100%;
      text-align: center;
      line-height: 1.35;
    }

    .data-table .cell-meta-date,
    .data-table .cell-meta-operator {
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      word-break: break-word;
    }

    .data-table .cell-meta-operator {
      color: var(--text);
    }

    .data-table .header-wrap button,
    .data-table .row-label-wrap button:not(.move-btn) {
      width: 22px;
      height: 22px;
      margin: 2px;
      flex-shrink: 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: transparent;
      color: var(--danger);
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0;
    }

    .data-table .header-wrap button:hover,
    .data-table .row-label-wrap button:not(.move-btn):hover {
      background: rgba(248, 113, 113, 0.12);
    }

    .corner-cell {
      width: var(--label-col-width);
      background: rgba(255, 255, 255, 0.02);
    }

    .data-table tr.data-row + tr.row-insert-slot th,
    .data-table tr.data-row + tr.row-insert-slot td {
      border-top: none;
    }

    .data-table tr.row-insert-slot th,
    .data-table tr.row-insert-slot td {
      height: 0;
      line-height: 0;
      padding: 0;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      border-top: none;
      border-bottom: none;
      overflow: visible;
      background: transparent;
    }

    .data-table tr.row-insert-slot th {
      position: relative;
      width: var(--label-col-width);
    }

    .data-table .row-insert-btn {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      padding: 0;
      border: 2px solid var(--panel);
      border-radius: 50%;
      background: #22c55e;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      line-height: 1;
      cursor: pointer;
      z-index: 2;
      box-shadow: 0 2px 10px rgba(34, 197, 94, 0.35);
      opacity: 0.55;
      transition: opacity 0.15s, transform 0.15s, box-shadow 0.15s;
    }

    .data-table tr.data-row:hover + tr.row-insert-slot .row-insert-btn,
    .data-table tr.row-insert-slot:hover .row-insert-btn,
    .data-table .row-insert-btn:focus-visible {
      opacity: 1;
    }

    .data-table .row-insert-btn:hover {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.08);
      box-shadow: 0 4px 14px rgba(34, 197, 94, 0.5);
    }

    .data-table tr.row-insert-slot-last .row-insert-btn {
      top: auto;
      bottom: 0;
      transform: translate(-50%, 50%);
    }

    .data-table tr.row-insert-slot-last .row-insert-btn:hover {
      transform: translate(-50%, 50%) scale(1.08);
    }

    .cell-action {
      width: 40px;
      min-width: 40px;
      text-align: center;
      background: rgba(255, 255, 255, 0.02);
    }

    .cell-action button {
      width: 28px;
      height: 28px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--danger);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
    }

    .cell-action button:hover {
      background: rgba(248, 113, 113, 0.12);
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s, visibility 0.2s;
      z-index: 100;
    }

    .overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      width: 100%;
      max-width: 560px;
      max-height: min(85vh, 640px);
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h2 {
      margin: 0;
      font-size: 18px;
    }

    .close-btn {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
    }

    .close-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
    }

    .modal-body {
      padding: 16px 18px;
      overflow-y: auto;
      flex: 1;
    }

    .modal-desc {
      margin: 0 0 14px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }

    .entry-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .entry-row,
    .entry-row-head {
      display: grid;
      grid-template-columns: 34px 46px minmax(0, 1fr) 44px 44px 60px 28px;
      gap: 6px;
      align-items: center;
      width: 100%;
    }

    .entry-row-head {
      margin-bottom: 4px;
      font-size: 13px;
      color: var(--muted);
    }

    .entry-row-head span:nth-child(4),
    .entry-row-head span:nth-child(5),
    .entry-row-head span:nth-child(6) {
      text-align: center;
    }

    .entry-row-default {
      margin-bottom: 8px;
    }

    .move-btns {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .move-btn {
      width: 30px;
      height: 15px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: transparent;
      color: var(--muted);
      font-size: 10px;
      line-height: 1;
      cursor: pointer;
    }

    .move-btn:hover:not(:disabled) {
      color: var(--accent);
      border-color: var(--accent);
    }

    .move-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .color-field {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .transparent-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: var(--text);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    .transparent-toggle input {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .color-input:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .entry-row-head span:nth-child(2) {
      padding-left: 0;
    }

    .color-input {
      width: 56px;
      height: 44px;
      flex-shrink: 0;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      cursor: pointer;
    }

    .color-input::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    .color-input::-webkit-color-swatch {
      border: none;
      border-radius: 6px;
    }

    .color-input::-moz-color-swatch {
      border: none;
      border-radius: 6px;
    }

    .entry-label {
      font-size: 13px;
      color: var(--muted);
      text-align: left;
      white-space: nowrap;
    }

    .entry-row .entry-text-input {
      width: 100%;
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
    }

    .entry-row .entry-text-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .entry-row .color-input {
      width: 44px;
      height: 40px;
    }

    .entry-row .transparent-toggle {
      justify-content: center;
      width: 100%;
    }

    .remove-btn {
      width: 30px;
      height: 30px;
      justify-self: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: transparent;
      color: var(--danger);
      font-size: 18px;
      cursor: pointer;
    }

    .remove-btn:hover {
      background: rgba(248, 113, 113, 0.12);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      padding: 14px 18px 18px;
      border-top: 1px solid var(--border);
    }

    .modal-actions button {
      flex: 1;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }

    .add-btn {
      background: transparent;
      color: var(--accent);
      border-color: var(--accent);
    }

    .add-btn:hover {
      background: rgba(61, 139, 253, 0.12);
    }

    .save-btn {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .save-btn:hover {
      filter: brightness(1.08);
    }

    @media (max-width: 520px) {
      .entry-row,
      .entry-row-head {
        grid-template-columns: 30px 40px minmax(0, 1fr) 40px 40px 56px 26px;
        gap: 5px;
      }

      .entry-row-head {
        display: none;
      }

      .entry-row .color-input {
        width: 48px;
        height: 40px;
      }

      .transparent-toggle {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="page" id="page">
    <h1 class="page-title">69內部進度</h1>
    <div class="table-panel" id="tablePanel">
      <div class="table-toolbar">
        <button type="button" id="addTableRow" class="edit-reveal">新增列</button>
        <button type="button" id="addTableCol" class="edit-reveal">新增欄</button>
        <button type="button" id="editModeToggle" class="toolbar-edit-mode-btn" aria-pressed="false">編輯模式</button>
        <div class="toolbar-meta">
          <span id="activeEditors" class="toolbar-active-editors" hidden></span>
          <span id="cloudStatus" class="toolbar-cloud-status" aria-live="polite"></span>
        </div>
        <div class="toolbar-widths">
          <label class="width-control" for="labelColWidth">
            <span>首欄寬度</span>
            <input type="text" id="labelColWidth" inputmode="numeric" value="140" aria-label="首欄寬度">
            <span class="width-unit">px</span>
          </label>
          <label class="width-control" for="frameWidth">
            <span>框架寬度</span>
            <input type="text" id="frameWidth" inputmode="numeric" value="960" aria-label="框架寬度">
            <span class="width-unit">px</span>
          </label>
          <button class="gear-btn" id="gearBtn" type="button" aria-label="設定">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
