  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    var STORAGE_KEY = "blank-page-click-contents";
    var TABLE_STORAGE_KEY = "blank-page-table-data";
    var SUPABASE_URL = "https://clcqnbnbbtzzuctaspfn.supabase.co";
    var SUPABASE_ANON_KEY = "sb_publishable_1PJYZvRhU8qgCnwit6EG7Q_xjKq49oD";
    var PROFILE_TABLE = "profiles";
    var BLANK_PAGE_STATES_TABLE = "blank_page_states";
    var BLANK_PAGE_KEY = "default";

    var supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    });
    var cloudUserId = null;
    var cachedPermissionLevel = null;
    var cachedUsername = null;
    var cachedWorkZone = null;
    var cloudSyncTimer = null;
    var cloudSyncInFlight = false;
    var suppressCloudSave = false;
    var isEditMode = false;
    var cloudStatusFadeTimer = null;
    var cloudStatusFadeEndHandler = null;
    var lastKnownCloudUpdatedAt = null;
    var lastKnownCloudUpdatedBy = null;
    var hasCloudConflict = false;
    var presenceChannel = null;
    var stateRealtimeChannel = null;
    var presenceHeartbeatTimer = null;

    var defaultAccent = "#3d8bfd";
    var defaultContents = [
      { text: "再點一次", color: "#3d8bfd", textColor: "#ffffff" },
      { text: "繼續", color: "#22c55e", textColor: "#ffffff" },
      { text: "點我", color: "#f59e0b", textColor: "#ffffff" }
    ];
    var defaultBtnText = "點我";
    var defaultBtnTextColor = "#ffffff";
    var defaultTextOnTransparent = "#e7ecf3";
    var defaultTable = {
      headers: ["欄 1", "欄 2", "欄 3"],
      rowLabels: ["列 1", "列 2"],
      rowStandalone: [false, false],
      cells: [
        [
          { text: "按鈕", color: "#3d8bfd" },
          { text: "按鈕", color: "#3d8bfd" },
          { text: "按鈕", color: "#3d8bfd" }
        ],
        [
          { text: "按鈕", color: "#3d8bfd" },
          { text: "按鈕", color: "#3d8bfd" },
          { text: "按鈕", color: "#3d8bfd" }
        ]
      ]
    };

    var defaultFrameWidth = 960;
    var defaultLabelColWidth = 140;

    var state = {
      contents: [],
      defaultBtnText: defaultBtnText,
      defaultBtnColor: defaultAccent,
      defaultBtnTextColor: defaultBtnTextColor,
      clickCount: 0
    };

    var gearBtn = document.getElementById("gearBtn");
    var pageEl = document.getElementById("page");
    var tablePanel = document.getElementById("tablePanel");
    var frameWidthInput = document.getElementById("frameWidth");
    var labelColWidthInput = document.getElementById("labelColWidth");
    var defaultBtnTextInput = document.getElementById("defaultBtnText");
    var defaultBtnTextColorInput = document.getElementById("defaultBtnTextColor");
    var defaultBtnColorInput = document.getElementById("defaultBtnColor");
    var defaultBtnTransparentInput = document.getElementById("defaultBtnTransparent");
    var overlay = document.getElementById("overlay");
    var closeBtn = document.getElementById("closeBtn");
    var entryList = document.getElementById("entryList");
    var addBtn = document.getElementById("addBtn");
    var saveBtn = document.getElementById("saveBtn");
    var dataTable = document.getElementById("dataTable");
    var addTableRowBtn = document.getElementById("addTableRow");
    var addTableColBtn = document.getElementById("addTableCol");
    var editModeToggle = document.getElementById("editModeToggle");
    var cloudStatusEl = document.getElementById("cloudStatus");
    var activeEditorsEl = document.getElementById("activeEditors");
    var conflictBanner = document.getElementById("conflictBanner");
    var conflictBannerText = document.getElementById("conflictBannerText");
    var conflictReloadBtn = document.getElementById("conflictReloadBtn");

    var tableState = {
      headers: [],
      rowLabels: [],
      rowStandalone: [],
      cells: [],
      frameWidth: defaultFrameWidth,
      labelColWidth: defaultLabelColWidth
    };

    function normalizeFrameWidth(value) {
      var width = Number(String(value).replace(/[^\d.]/g, ""));
      if (!width) return defaultFrameWidth;
      return Math.min(1920, Math.max(320, Math.round(width)));
    }

    function normalizeLabelColWidth(value) {
      var width = Number(String(value).replace(/[^\d.]/g, ""));
      if (!width) return defaultLabelColWidth;
      return Math.min(800, Math.max(80, Math.round(width)));
    }

    function formatSupabaseError(err) {
      var msg = err && err.message ? err.message : String(err || "未知錯誤");
      if (/failed to fetch/i.test(msg)) {
        if (window.location.protocol === "file:") {
          return "無法連線 Supabase：請勿用本機檔案直接開啟，改以網站伺服器或已部署網址開啟此頁";
        }
        return "無法連線 Supabase：請確認網路、防火牆，或暫時關閉會阻擋外連的瀏覽器擴充功能";
      }
      if (/blank_page_states|42P01|PGRST205/i.test(msg)) {
        return "資料表尚未建立，請至 Supabase Dashboard → SQL Editor 執行 SQL/blank_page_states.sql";
      }
      return msg;
    }

    function clearCloudStatusFade() {
      if (cloudStatusFadeTimer) {
        clearTimeout(cloudStatusFadeTimer);
        cloudStatusFadeTimer = null;
      }
      if (cloudStatusFadeEndHandler && cloudStatusEl) {
        cloudStatusEl.removeEventListener("transitionend", cloudStatusFadeEndHandler);
        cloudStatusFadeEndHandler = null;
      }
      if (cloudStatusEl) {
        cloudStatusEl.style.opacity = "1";
        cloudStatusEl.classList.remove("is-sync-ok");
      }
    }

    function setCloudStatus(message, isError) {
      if (!cloudStatusEl) return;
      clearCloudStatusFade();
      cloudStatusEl.textContent = message || "";
      cloudStatusEl.classList.toggle("is-error", !!isError);
    }

    function showSyncSuccessStatus() {
      if (!cloudStatusEl) return;
      clearCloudStatusFade();
      cloudStatusEl.classList.remove("is-error");
      cloudStatusEl.classList.add("is-sync-ok");
      cloudStatusEl.textContent = "已同步至雲端";
      cloudStatusEl.style.opacity = "1";
      cloudStatusFadeTimer = setTimeout(function () {
        cloudStatusFadeTimer = null;
        cloudStatusFadeEndHandler = function (e) {
          if (e.propertyName !== "opacity") return;
          cloudStatusEl.removeEventListener("transitionend", cloudStatusFadeEndHandler);
          cloudStatusFadeEndHandler = null;
          cloudStatusEl.textContent = "";
          cloudStatusEl.classList.remove("is-sync-ok");
          cloudStatusEl.style.opacity = "1";
        };
        cloudStatusEl.addEventListener("transitionend", cloudStatusFadeEndHandler);
        cloudStatusEl.style.opacity = "0";
      }, 5000);
    }

    function normalizePermissionLevel(value) {
      if (value === null || value === undefined || value === "") return null;
      var level = Number(String(value).trim());
      return Number.isFinite(level) ? level : null;
    }

    function canUseEditMode() {
      var level = normalizePermissionLevel(cachedPermissionLevel);
      return level === 0 || level === 1;
    }

    function getEditModeBlockReason() {
      if (!cloudUserId) return "請先至 login.html 登入";
      var level = normalizePermissionLevel(cachedPermissionLevel);
      if (level === null) return "無法讀取 permission_level，請確認 profiles 資料";
      if (level !== 0 && level !== 1) {
        return "目前權限等級 " + level + "，僅 0 或 1 可使用編輯模式";
      }
      return "";
    }

    async function resolveAuthUser() {
      var userResult = await supabase.auth.getUser();
      if (userResult.data && userResult.data.user) {
        return userResult.data.user;
      }
      var sessionResult = await supabase.auth.getSession();
      var session = sessionResult.data && sessionResult.data.session;
      return session && session.user ? session.user : null;
    }

    function redirectToLogin() {
      var next = encodeURIComponent("blank.html");
      window.location.href = "./login.html?next=" + next;
    }

    function applyProfileFromRow(profile, userId) {
      cloudUserId = userId;
      cachedUsername = String(profile.username || "").trim();
      cachedPermissionLevel = normalizePermissionLevel(profile.permission_level);
      cachedWorkZone = String(profile["工區"] || "").trim();
      refreshPresenceTrack();
    }

    function parseCloudTime(value) {
      if (!value) return 0;
      var time = new Date(value).getTime();
      return isNaN(time) ? 0 : time;
    }

    function setCloudRevision(row) {
      if (!row) return;
      lastKnownCloudUpdatedAt = row.updated_at || null;
      lastKnownCloudUpdatedBy = row.updated_by || null;
    }

    function clearCloudConflict() {
      hasCloudConflict = false;
      if (conflictBanner) conflictBanner.hidden = true;
      if (conflictBannerText) conflictBannerText.textContent = "";
    }

    function resolveEditorName(userId) {
      if (!userId) return "其他人";
      if (userId === cloudUserId) return "你";
      var editors = getPresenceEditors();
      for (var i = 0; i < editors.length; i++) {
        if (editors[i].userId === userId) {
          return editors[i].username || "其他人";
        }
      }
      return "其他人";
    }

    function showCloudConflict(remoteRow) {
      hasCloudConflict = true;
      if (cloudSyncTimer) {
        clearTimeout(cloudSyncTimer);
        cloudSyncTimer = null;
      }
      var who = resolveEditorName(remoteRow && remoteRow.updated_by);
      var message = "衝突警報：" + who + " 已更新雲端資料，您目前的變更尚未同步，請重新載入以免覆蓋。";
      if (conflictBannerText) conflictBannerText.textContent = message;
      if (conflictBanner) conflictBanner.hidden = false;
      setCloudStatus("偵測到雲端衝突，已暫停自動同步", true);
    }

    async function fetchCloudRevision() {
      var result = await supabase
        .from(BLANK_PAGE_STATES_TABLE)
        .select("updated_at, updated_by")
        .eq("page_key", BLANK_PAGE_KEY)
        .maybeSingle();
      if (result.error) throw result.error;
      return result.data;
    }

    async function detectCloudConflict() {
      if (!lastKnownCloudUpdatedAt) return null;
      var remote = await fetchCloudRevision();
      if (!remote || !remote.updated_at) return null;
      if (parseCloudTime(remote.updated_at) > parseCloudTime(lastKnownCloudUpdatedAt)) {
        return remote;
      }
      return null;
    }

    function getPresenceEditors() {
      if (!presenceChannel) return [];
      var state = presenceChannel.presenceState();
      var map = {};
      Object.keys(state).forEach(function (key) {
        (state[key] || []).forEach(function (meta) {
          var userId = meta.user_id || key;
          if (!map[userId]) {
            map[userId] = {
              userId: userId,
              username: String(meta.username || "").trim() || "使用者"
            };
          }
        });
      });
      return Object.keys(map).map(function (id) {
        return map[id];
      });
    }

    function renderActiveEditors() {
      if (!activeEditorsEl) return;
      var editors = getPresenceEditors();
      if (!editors.length) {
        activeEditorsEl.textContent = "";
        activeEditorsEl.hidden = true;
        return;
      }
      var names = editors.map(function (editor) {
        if (editor.userId === cloudUserId) return "你";
        return editor.username || "使用者";
      });
      activeEditorsEl.textContent = "編輯中：" + names.join("、");
      activeEditorsEl.hidden = false;
    }

    function refreshPresenceTrack() {
      if (!presenceChannel || !cloudUserId) return;
      presenceChannel.track({
        user_id: cloudUserId,
        username: cachedUsername || "使用者"
      });
      renderActiveEditors();
    }

    function teardownRealtime() {
      if (presenceHeartbeatTimer) {
        clearInterval(presenceHeartbeatTimer);
        presenceHeartbeatTimer = null;
      }
      if (presenceChannel) {
        presenceChannel.untrack();
        supabase.removeChannel(presenceChannel);
        presenceChannel = null;
      }
      if (stateRealtimeChannel) {
        supabase.removeChannel(stateRealtimeChannel);
        stateRealtimeChannel = null;
      }
      if (activeEditorsEl) {
        activeEditorsEl.textContent = "";
        activeEditorsEl.hidden = true;
      }
    }

    function setupRealtime() {
      if (!supabase || !cloudUserId) return;
      teardownRealtime();

      presenceChannel = supabase.channel("blank-page:" + BLANK_PAGE_KEY, {
        config: { presence: { key: cloudUserId } }
      });
      presenceChannel.on("presence", { event: "sync" }, renderActiveEditors);
      presenceChannel.on("presence", { event: "join" }, renderActiveEditors);
      presenceChannel.on("presence", { event: "leave" }, renderActiveEditors);
      presenceChannel.subscribe(function (status) {
        if (status === "SUBSCRIBED") {
          refreshPresenceTrack();
        }
      });
      presenceHeartbeatTimer = setInterval(refreshPresenceTrack, 25000);

      stateRealtimeChannel = supabase
        .channel("blank-page-state:" + BLANK_PAGE_KEY)
        .on(
          "postgres_changes",
          {
            event: "UPDATE",
            schema: "public",
            table: BLANK_PAGE_STATES_TABLE,
            filter: "page_key=eq." + BLANK_PAGE_KEY
          },
          function (payload) {
            handleRemoteStateChange(payload.new);
          }
        )
        .subscribe();
    }

    function handleRemoteStateChange(row) {
      if (!row || !row.updated_at) return;
      var remoteAt = parseCloudTime(row.updated_at);
      var knownAt = parseCloudTime(lastKnownCloudUpdatedAt);
      if (!knownAt || remoteAt <= knownAt) return;

      var isOwnSave = row.updated_by && row.updated_by === cloudUserId;
      if (isOwnSave && cloudSyncInFlight) {
        setCloudRevision(row);
        return;
      }

      setCloudRevision(row);
      showCloudConflict(row);
    }

    async function reloadCloudData() {
      clearCloudConflict();
      try {
        await loadFromSupabase();
      } catch (err) {
        setCloudStatus("重新載入失敗：" + formatSupabaseError(err), true);
      }
    }

    function canWriteCloud() {
      if (!cloudUserId) return false;
      var level = normalizePermissionLevel(cachedPermissionLevel);
      if (level === null) return false;
      return level !== 3;
    }

    function syncEditModeUi() {
      if (!editModeToggle) return;
      var allowed = canUseEditMode();
      if (!allowed) {
        isEditMode = false;
        editModeToggle.disabled = true;
        editModeToggle.title = getEditModeBlockReason();
      } else {
        editModeToggle.disabled = false;
        editModeToggle.title = "";
      }
      editModeToggle.hidden = false;
      editModeToggle.setAttribute("aria-pressed", isEditMode ? "true" : "false");
      editModeToggle.textContent = isEditMode ? "完成編輯" : "編輯模式";
      editModeToggle.classList.toggle("is-active", isEditMode);
      if (isEditMode && allowed) {
        document.body.classList.add("is-edit-mode");
      } else {
        document.body.classList.remove("is-edit-mode");
      }
      applyTableColumnWidths();
      applyTableLabelEditability();
    }

    function applyTableLabelEditability() {
      if (!dataTable) return;
      var editable = isEditMode && canUseEditMode();
      dataTable.querySelectorAll(".table-header-input, .table-row-label-input").forEach(function (input) {
        input.readOnly = !editable;
      });
    }

    function setEditMode(on) {
      isEditMode = !!on;
      syncEditModeUi();
    }

    function applyClickStateFromCloud(clickState) {
      if (!clickState || typeof clickState !== "object") return;
      if (Array.isArray(clickState.contents) && clickState.contents.length) {
        state.contents = clickState.contents.map(normalizeItem).filter(Boolean);
      }
      state.defaultBtnText = String(clickState.defaultBtnText || defaultBtnText).trim() || defaultBtnText;
      state.defaultBtnColor = normalizeColor(clickState.defaultBtnColor);
      state.defaultBtnTextColor = normalizeTextColor(
        clickState.defaultBtnTextColor,
        isTransparentColor(clickState.defaultBtnColor) ? defaultTextOnTransparent : defaultBtnTextColor
      );
      state.clickCount = Number(clickState.clickCount) || 0;
    }

    function buildCloudPayload() {
      return {
        page_key: BLANK_PAGE_KEY,
        click_state: {
          contents: state.contents,
          defaultBtnText: state.defaultBtnText,
          defaultBtnColor: state.defaultBtnColor,
          defaultBtnTextColor: state.defaultBtnTextColor,
          clickCount: state.clickCount
        },
        table_state: tableState,
        updated_at: new Date().toISOString(),
        updated_by: cloudUserId
      };
    }

    function scheduleCloudSave() {
      if (suppressCloudSave || hasCloudConflict || !supabase || !canWriteCloud()) return;
      if (cloudSyncTimer) clearTimeout(cloudSyncTimer);
      cloudSyncTimer = setTimeout(function () {
        saveToSupabase();
      }, 1200);
    }

    async function loadProfile() {
      if (!supabase) return;
      var user = null;
      try {
        user = await resolveAuthUser();
        if (!user) {
          cloudUserId = null;
          cachedPermissionLevel = null;
          cachedUsername = null;
          cachedWorkZone = null;
          syncEditModeUi();
          redirectToLogin();
          return;
        }
        var profileResult = await supabase
          .from(PROFILE_TABLE)
          .select("id, username, permission_level, approved, 工區")
          .eq("id", user.id)
          .maybeSingle();
        if (profileResult.error) {
          throw profileResult.error;
        }
        var profile = profileResult.data;
        if (!profile) {
          cloudUserId = user.id;
          cachedPermissionLevel = null;
          cachedUsername = null;
          cachedWorkZone = null;
          setCloudStatus("找不到 profiles 資料（id=" + user.id + "）", true);
          syncEditModeUi();
          return;
        }
        if (profile.approved === false) {
          applyProfileFromRow(profile, user.id);
          setCloudStatus("帳號尚未核准", true);
          syncEditModeUi();
          return;
        }
        applyProfileFromRow(profile, user.id);
        var statusText = "已登入：" + (cachedUsername || user.id);
        statusText += "（權限 " + (cachedPermissionLevel === null ? "未設定" : cachedPermissionLevel) + "）";
        if (cachedWorkZone) statusText += "｜工區 " + cachedWorkZone;
        setCloudStatus(statusText);
        syncEditModeUi();
      } catch (err) {
        if (user && user.id) cloudUserId = user.id;
        cachedPermissionLevel = null;
        cachedUsername = null;
        cachedWorkZone = null;
        setCloudStatus("讀取權限失敗：" + formatSupabaseError(err), true);
        syncEditModeUi();
      }
    }

    async function loadFromSupabase() {
      try {
        await loadProfile();
        if (!cloudUserId) return;
        var statusPrefix = cloudStatusEl ? cloudStatusEl.textContent.split("｜")[0] : "";
        setCloudStatus((statusPrefix || "已連線") + "｜讀取雲端資料中…");
        var result = await supabase
          .from(BLANK_PAGE_STATES_TABLE)
          .select("click_state, table_state, updated_at, updated_by")
          .eq("page_key", BLANK_PAGE_KEY)
          .maybeSingle();
        if (result.error) {
          throw result.error;
        }
      if (result.data) {
        suppressCloudSave = true;
        clearCloudConflict();
        setCloudRevision(result.data);
        if (result.data.click_state) {
          applyClickStateFromCloud(result.data.click_state);
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            contents: state.contents,
            defaultBtnText: state.defaultBtnText,
            defaultBtnColor: state.defaultBtnColor,
            defaultBtnTextColor: state.defaultBtnTextColor,
            clickCount: state.clickCount
          }));
        }
        if (result.data.table_state) {
          tableState = normalizeTable(result.data.table_state);
          applyFrameWidth(tableState.frameWidth);
          applyLabelColWidth(tableState.labelColWidth);
          localStorage.setItem(TABLE_STORAGE_KEY, JSON.stringify(tableState));
        }
        suppressCloudSave = false;
        renderTable();
        var doneText = "已登入：" + (cachedUsername || cloudUserId);
        doneText += "（權限 " + (cachedPermissionLevel === null ? "未設定" : cachedPermissionLevel) + "）";
        if (cachedWorkZone) doneText += "｜工區 " + cachedWorkZone;
        doneText += "｜已載入雲端資料";
        setCloudStatus(doneText);
        setupRealtime();
        return;
      }
        var localText = "已登入：" + (cachedUsername || cloudUserId);
        localText += "（權限 " + (cachedPermissionLevel === null ? "未設定" : cachedPermissionLevel) + "）";
        if (cachedWorkZone) localText += "｜工區 " + cachedWorkZone;
        localText += "｜尚無雲端資料，使用本機資料";
        setCloudStatus(localText);
        setupRealtime();
      } catch (err) {
        setCloudStatus("雲端讀取失敗：" + formatSupabaseError(err), true);
      }
    }

    async function saveToSupabase() {
      if (!supabase || !canWriteCloud()) return;
      if (hasCloudConflict) return;
      if (cloudSyncInFlight) return;
      cloudSyncInFlight = true;
      try {
        var conflict = await detectCloudConflict();
        if (conflict) {
          setCloudRevision(conflict);
          showCloudConflict(conflict);
          return;
        }
        var payload = buildCloudPayload();
        var result = await supabase
          .from(BLANK_PAGE_STATES_TABLE)
          .upsert(payload, { onConflict: "page_key" });
        if (result.error) throw result.error;
        setCloudRevision({
          updated_at: payload.updated_at,
          updated_by: payload.updated_by
        });
        clearCloudConflict();
        showSyncSuccessStatus();
      } catch (err) {
        setCloudStatus("雲端同步失敗：" + formatSupabaseError(err), true);
      } finally {
        cloudSyncInFlight = false;
      }
    }

    function applyTableColumnWidths() {
      var count = tableState.headers.length;
      var frameWidth = tableState.frameWidth;
      var checkboxWidth = isEditMode ? 36 : 0;
      var minDataCol = 48;

      if (!count) {
        tablePanel.style.setProperty("--checkbox-col-width", checkboxWidth + "px");
        tablePanel.style.setProperty("--label-col-width", tableState.labelColWidth + "px");
        return;
      }

      var maxLabel = Math.max(80, frameWidth - checkboxWidth - count * minDataCol);
      var labelWidth = Math.min(tableState.labelColWidth, maxLabel);
      var remaining = frameWidth - checkboxWidth - labelWidth;
      var dataColWidth = Math.floor(remaining / count);
      var checkboxPercent = (checkboxWidth / frameWidth) * 100;
      var labelPercent = (labelWidth / frameWidth) * 100;
      var dataPercent = (dataColWidth / frameWidth) * 100;

      tableState.labelColWidth = labelWidth;
      labelColWidthInput.value = String(labelWidth);
      tablePanel.style.setProperty("--checkbox-col-width", checkboxPercent + "%");
      tablePanel.style.setProperty("--label-col-width", labelPercent + "%");
      tablePanel.style.setProperty("--data-col-width", dataPercent + "%");

      var checkboxColEl = dataTable.querySelector("col.checkbox-col");
      if (checkboxColEl) checkboxColEl.style.width = checkboxPercent + "%";
      var labelColEl = dataTable.querySelector("col.label-col");
      if (labelColEl) labelColEl.style.width = labelPercent + "%";
      dataTable.querySelectorAll("col.data-col").forEach(function (col) {
        col.style.width = dataPercent + "%";
      });
    }

    function applyFrameWidth(width) {
      var next = normalizeFrameWidth(width);
      pageEl.style.maxWidth = next + "px";
      frameWidthInput.value = String(next);
      tableState.frameWidth = next;
      applyTableColumnWidths();
    }

    function applyLabelColWidth(width) {
      tableState.labelColWidth = normalizeLabelColWidth(width);
      labelColWidthInput.value = String(tableState.labelColWidth);
      applyTableColumnWidths();
    }

    function commitFrameWidth() {
      applyFrameWidth(frameWidthInput.value);
      persistTableState();
    }

    function commitLabelColWidth() {
      applyLabelColWidth(labelColWidthInput.value);
      persistTableState();
    }

    function isTransparentColor(color) {
      return String(color || "").trim().toLowerCase() === "transparent";
    }

    function normalizeColor(color) {
      var value = String(color || "").trim();
      if (isTransparentColor(value)) return "transparent";
      if (/^#[0-9a-fA-F]{6}$/.test(value)) return value;
      return defaultAccent;
    }

    function normalizeTextColor(color, fallback) {
      var value = String(color || "").trim();
      if (/^#[0-9a-fA-F]{6}$/.test(value)) return value;
      return fallback || defaultBtnTextColor;
    }

    function resolveTextColor(textColor, bgColor) {
      return normalizeTextColor(
        textColor,
        isTransparentColor(bgColor) ? defaultTextOnTransparent : defaultBtnTextColor
      );
    }

    function readColorValue(colorInput, transparentInput) {
      if (transparentInput && transparentInput.checked) return "transparent";
      return normalizeColor(colorInput ? colorInput.value : defaultAccent);
    }

    function setupColorField(colorInput, transparentInput, colorValue) {
      var transparent = isTransparentColor(colorValue);
      transparentInput.checked = transparent;
      colorInput.value = transparent ? defaultAccent : normalizeColor(colorValue);
      colorInput.disabled = transparent;
      transparentInput.onchange = function () {
        colorInput.disabled = transparentInput.checked;
      };
    }

    function setupTextColorField(colorInput, colorValue, bgColor) {
      colorInput.value = normalizeTextColor(
        colorValue,
        isTransparentColor(bgColor) ? defaultTextOnTransparent : defaultBtnTextColor
      );
    }

    function normalizeItem(item) {
      if (item && typeof item === "object") {
        var text = String(item.text || item.button || "").trim();
        if (!text) return null;
        var color = normalizeColor(item.color);
        return {
          text: text,
          color: color,
          textColor: normalizeTextColor(
            item.textColor,
            isTransparentColor(color) ? defaultTextOnTransparent : defaultBtnTextColor
          )
        };
      }
      var value = String(item || "").trim();
      if (!value) return null;
      return { text: value, color: defaultAccent, textColor: defaultBtnTextColor };
    }

    function hexToRgb(hex) {
      if (isTransparentColor(hex)) return { r: 61, g: 139, b: 253 };
      var value = normalizeColor(hex).slice(1);
      return {
        r: parseInt(value.slice(0, 2), 16),
        g: parseInt(value.slice(2, 4), 16),
        b: parseInt(value.slice(4, 6), 16)
      };
    }

    function lightenColor(hex, amount) {
      var rgb = hexToRgb(hex);
      var mix = function (channel) {
        return Math.min(255, Math.round(channel + (255 - channel) * amount));
      };
      return "rgb(" + mix(rgb.r) + ", " + mix(rgb.g) + ", " + mix(rgb.b) + ")";
    }

    function colorShadow(hex, alpha) {
      var rgb = hexToRgb(hex);
      return "rgba(" + rgb.r + ", " + rgb.g + ", " + rgb.b + ", " + alpha + ")";
    }

    function applyCellButtonStyle(button, text, color, textColor) {
      button.textContent = text || "按鈕";
      var resolvedTextColor = resolveTextColor(textColor, color);
      if (isTransparentColor(color)) {
        button.style.background = "transparent";
        button.style.boxShadow = "none";
        button.style.border = "1px solid var(--border)";
        button.style.color = resolvedTextColor;
        return;
      }
      button.style.border = "none";
      button.style.color = resolvedTextColor;
      var base = normalizeColor(color);
      button.style.background = "linear-gradient(180deg, " + lightenColor(base, 0.18) + " 0%, " + base + " 100%)";
      button.style.boxShadow = "0 6px 18px " + colorShadow(base, 0.28);
    }

    function normalizeCell(cell, fallbackText) {
      if (cell && typeof cell === "object") {
        var color = normalizeColor(cell.color);
        return {
          text: String(cell.text || fallbackText || "按鈕").trim() || "按鈕",
          color: color,
          textColor: normalizeTextColor(
            cell.textColor,
            isTransparentColor(color) ? defaultTextOnTransparent : defaultBtnTextColor
          ),
          clickCount: Number(cell.clickCount) || 0,
          lastOperatedAt: cell.lastOperatedAt || null,
          lastOperator: String(cell.lastOperator || "").trim()
        };
      }
      var value = String(cell || fallbackText || "按鈕").trim();
      return {
        text: value || "按鈕",
        color: defaultAccent,
        textColor: defaultBtnTextColor,
        clickCount: 0,
        lastOperatedAt: null,
        lastOperator: ""
      };
    }

    function pad2(value) {
      return value < 10 ? "0" + value : String(value);
    }

    function formatOperationDate(value) {
      var date = value instanceof Date ? value : new Date(value);
      if (isNaN(date.getTime())) return "";
      var year = String(date.getFullYear()).slice(-2);
      return year + "/" + pad2(date.getMonth() + 1) + "/" + pad2(date.getDate());
    }

    function getCurrentOperatorName() {
      return String(cachedUsername || "").trim();
    }

    function getDisplayOperatorName(stored) {
      var trimmed = String(stored || "").trim();
      if (trimmed && trimmed !== "未設定") return trimmed;
      return getCurrentOperatorName();
    }

    function updateCellMeta(cell, metaEl) {
      if (!metaEl) return;
      var dateEl = metaEl.querySelector(".cell-meta-date");
      var operatorEl = metaEl.querySelector(".cell-meta-operator");
      if (!cell.lastOperatedAt) {
        metaEl.hidden = true;
        if (dateEl) dateEl.textContent = "";
        if (operatorEl) operatorEl.textContent = "";
        return;
      }
      metaEl.hidden = false;
      if (dateEl) dateEl.textContent = formatOperationDate(cell.lastOperatedAt);
      if (operatorEl) operatorEl.textContent = getDisplayOperatorName(cell.lastOperator);
    }

    function buildCellWrap(cell, rowIndex, colIndex) {
      var wrap = document.createElement("div");
      wrap.className = "cell-wrap";

      var button = document.createElement("button");
      button.type = "button";
      button.className = "cell-btn";
      applyCellDisplay(cell, button);

      var meta = document.createElement("div");
      meta.className = "cell-meta";
      var dateEl = document.createElement("div");
      dateEl.className = "cell-meta-date";
      var operatorEl = document.createElement("div");
      operatorEl.className = "cell-meta-operator";
      meta.appendChild(dateEl);
      meta.appendChild(operatorEl);
      updateCellMeta(cell, meta);

      button.addEventListener("click", function () {
        handleCellButtonClick(rowIndex, colIndex, button, meta);
      });

      wrap.appendChild(button);
      wrap.appendChild(meta);
      return wrap;
    }

    function createEmptyCell() {
      return {
        text: state.defaultBtnText || "按鈕",
        color: state.defaultBtnColor || defaultAccent,
        textColor: state.defaultBtnTextColor || defaultBtnTextColor,
        clickCount: 0
      };
    }

    function getCellButtonDisplay(cell) {
      if (!state.contents.length) {
        return {
          text: state.defaultBtnText,
          color: state.defaultBtnColor,
          textColor: state.defaultBtnTextColor
        };
      }
      if (!cell.clickCount) {
        return {
          text: state.defaultBtnText,
          color: state.defaultBtnColor,
          textColor: state.defaultBtnTextColor
        };
      }
      var index = ((cell.clickCount - 1) % state.contents.length + state.contents.length) % state.contents.length;
      var item = state.contents[index];
      return {
        text: item.text || state.defaultBtnText,
        color: item.color || state.defaultBtnColor,
        textColor: item.textColor || state.defaultBtnTextColor
      };
    }

    function applyCellDisplay(cell, button) {
      var display = getCellButtonDisplay(cell);
      cell.text = display.text;
      cell.color = display.color;
      cell.textColor = display.textColor;
      applyCellButtonStyle(button, display.text, display.color, display.textColor);
    }

    function handleCellButtonClick(rowIndex, colIndex, button, metaEl) {
      if (!state.contents.length) {
        openModal();
        return;
      }
      var cell = tableState.cells[rowIndex][colIndex];
      cell.clickCount = (cell.clickCount || 0) + 1;
      cell.lastOperatedAt = new Date().toISOString();
      cell.lastOperator = getCurrentOperatorName();
      applyCellDisplay(cell, button);
      updateCellMeta(cell, metaEl);
      persistTableState();
    }

    function cloneTable(table) {
      return {
        headers: table.headers.slice(),
        rowLabels: table.rowLabels.slice(),
        rowStandalone: Array.isArray(table.rowStandalone)
          ? table.rowStandalone.slice()
          : table.rowLabels.map(function () { return false; }),
        cells: table.cells.map(function (row) {
          return row.map(function (cell) {
            return {
              text: cell.text,
              color: cell.color,
              textColor: cell.textColor,
              clickCount: cell.clickCount || 0,
              lastOperatedAt: cell.lastOperatedAt || null,
              lastOperator: String(cell.lastOperator || "").trim()
            };
          });
        }),
        frameWidth: normalizeFrameWidth(table.frameWidth),
        labelColWidth: normalizeLabelColWidth(table.labelColWidth)
      };
    }

    function normalizeRowStandalone(rowStandalone, rowCount) {
      var result = Array.isArray(rowStandalone) ? rowStandalone.slice(0, rowCount) : [];
      while (result.length < rowCount) {
        result.push(false);
      }
      return result.map(Boolean);
    }

    function ensureTableShape(table) {
      var headers = table.headers.length ? table.headers : ["欄 1"];
      var rowLabels = table.rowLabels.length ? table.rowLabels : ["列 1"];
      var cells = rowLabels.map(function (_, rowIndex) {
        var sourceRow = table.cells[rowIndex] || [];
        return headers.map(function (_, colIndex) {
          return normalizeCell(sourceRow[colIndex], "按鈕");
        });
      });

      return {
        headers: headers.map(function (value, index) {
          return String(value || ("欄 " + (index + 1)));
        }),
        rowLabels: rowLabels.map(function (value, index) {
          return String(value || ("列 " + (index + 1)));
        }),
        rowStandalone: normalizeRowStandalone(table.rowStandalone, rowLabels.length),
        cells: cells,
        frameWidth: normalizeFrameWidth(table.frameWidth),
        labelColWidth: normalizeLabelColWidth(table.labelColWidth)
      };
    }

    function normalizeTable(table) {
      if (!table || typeof table !== "object") {
        return cloneTable(defaultTable);
      }

      var frameWidth = normalizeFrameWidth(table.frameWidth);
      var labelColWidth = normalizeLabelColWidth(table.labelColWidth);

      if (Array.isArray(table.cells)) {
        var shaped = ensureTableShape({
          headers: Array.isArray(table.headers) ? table.headers : defaultTable.headers.slice(),
          rowLabels: Array.isArray(table.rowLabels) ? table.rowLabels : defaultTable.rowLabels.slice(),
          rowStandalone: Array.isArray(table.rowStandalone) ? table.rowStandalone : [],
          cells: table.cells,
          frameWidth: frameWidth,
          labelColWidth: labelColWidth
        });
        shaped.frameWidth = frameWidth;
        shaped.labelColWidth = labelColWidth;
        return shaped;
      }

      var headers = Array.isArray(table.headers) ? table.headers.map(String) : defaultTable.headers.slice();
      var legacyRows = Array.isArray(table.rows) ? table.rows : defaultTable.cells.slice();
      return ensureTableShape({
        headers: headers,
        rowLabels: legacyRows.map(function (_, index) {
          return "列 " + (index + 1);
        }),
        rowStandalone: Array.isArray(table.rowStandalone) ? table.rowStandalone : [],
        cells: legacyRows.map(function (row) {
          return Array.isArray(row) ? row.map(function (cell) {
            return normalizeCell(cell, "按鈕");
          }) : [];
        }),
        frameWidth: frameWidth,
        labelColWidth: labelColWidth
      });
    }

    function loadTableState() {
      try {
        var raw = localStorage.getItem(TABLE_STORAGE_KEY);
        if (raw) {
          tableState = normalizeTable(JSON.parse(raw));
          applyFrameWidth(tableState.frameWidth);
          applyLabelColWidth(tableState.labelColWidth);
          return;
        }
      } catch (e) {}
      tableState = cloneTable(defaultTable);
      applyFrameWidth(tableState.frameWidth);
      applyLabelColWidth(tableState.labelColWidth);
    }

    function persistTableState() {
      localStorage.setItem(TABLE_STORAGE_KEY, JSON.stringify(tableState));
      scheduleCloudSave();
    }

    function syncTableFromDom() {
      var headerInputs = dataTable.querySelectorAll(".table-header-input");
      var rowLabelInputs = dataTable.querySelectorAll(".table-row-label-input");
      var rowCheckboxes = dataTable.querySelectorAll(".row-standalone-checkbox");

      tableState.headers = Array.prototype.map.call(headerInputs, function (input) {
        return input.value;
      });
      tableState.rowLabels = Array.prototype.map.call(rowLabelInputs, function (input) {
        return input.value;
      });
      if (rowCheckboxes.length) {
        tableState.rowStandalone = Array.prototype.map.call(rowCheckboxes, function (checkbox) {
          return !!checkbox.checked;
        });
      }
    }

    function moveTableRow(rowIndex, direction) {
      syncTableFromDom();
      var target = rowIndex + direction;
      if (target < 0 || target >= tableState.cells.length) return;
      var tempLabel = tableState.rowLabels[rowIndex];
      tableState.rowLabels[rowIndex] = tableState.rowLabels[target];
      tableState.rowLabels[target] = tempLabel;
      var tempCells = tableState.cells[rowIndex];
      tableState.cells[rowIndex] = tableState.cells[target];
      tableState.cells[target] = tempCells;
      var tempStandalone = tableState.rowStandalone[rowIndex];
      tableState.rowStandalone[rowIndex] = tableState.rowStandalone[target];
      tableState.rowStandalone[target] = tempStandalone;
      renderTable();
      persistTableState();
    }

    function createRowLabelInput(rowIndex) {
      var rowLabelInput = document.createElement("input");
      rowLabelInput.type = "text";
      rowLabelInput.value = tableState.rowLabels[rowIndex] || ("列 " + (rowIndex + 1));
      rowLabelInput.placeholder = "列名稱";
      rowLabelInput.className = "table-row-label-input";
      rowLabelInput.readOnly = !isEditMode || !canUseEditMode();
      rowLabelInput.addEventListener("input", function () {
        syncTableFromDom();
        persistTableState();
      });
      return rowLabelInput;
    }

    function createRowStandaloneCheckbox(rowIndex) {
      var checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.className = "row-standalone-checkbox edit-reveal";
      checkbox.checked = !!tableState.rowStandalone[rowIndex];
      checkbox.setAttribute("aria-label", "第 " + (rowIndex + 1) + " 列獨立顯示");
      checkbox.addEventListener("change", function () {
        syncTableFromDom();
        tableState.rowStandalone[rowIndex] = checkbox.checked;
        renderTable();
        persistTableState();
      });
      return checkbox;
    }

    function appendRowInsertSlot(tbody, insertIndex) {
      var insertTr = document.createElement("tr");
      insertTr.className = "row-insert-slot edit-reveal";
      if (insertIndex === tableState.cells.length) {
        insertTr.classList.add("row-insert-slot-last");
      }

      var insertCheckboxTd = document.createElement("td");
      insertCheckboxTd.className = "edit-reveal";
      insertTr.appendChild(insertCheckboxTd);

      var insertTh = document.createElement("th");
      var insertBtn = document.createElement("button");
      insertBtn.type = "button";
      insertBtn.className = "row-insert-btn edit-reveal";
      insertBtn.textContent = "＋";
      var aria;
      if (insertIndex === 0) {
        aria = "在第 1 列前插入新列";
      } else if (insertIndex === tableState.cells.length) {
        aria = "在最底部插入新列";
      } else {
        // insertIndex 是 0-based 的目標列索引，顯示用 1-based
        aria = "在第 " + (insertIndex + 1) + " 列前插入新列";
      }
      insertBtn.setAttribute("aria-label", aria);
      insertBtn.addEventListener("click", function () {
        insertTableRowAt(insertIndex);
      });
      insertTh.appendChild(insertBtn);
      insertTr.appendChild(insertTh);

      tableState.headers.forEach(function () {
        var spacer = document.createElement("td");
        insertTr.appendChild(spacer);
      });

      tbody.appendChild(insertTr);
    }

    function renderTable() {
      tableState = ensureTableShape(tableState);
      dataTable.innerHTML = "";

      var colgroup = document.createElement("colgroup");
      var checkboxCol = document.createElement("col");
      checkboxCol.className = "checkbox-col edit-reveal";
      colgroup.appendChild(checkboxCol);
      var labelCol = document.createElement("col");
      labelCol.className = "label-col";
      colgroup.appendChild(labelCol);
      tableState.headers.forEach(function () {
        var dataCol = document.createElement("col");
        dataCol.className = "data-col";
        colgroup.appendChild(dataCol);
      });
      dataTable.appendChild(colgroup);

      var thead = document.createElement("thead");
      var headRow = document.createElement("tr");

      var checkboxCorner = document.createElement("th");
      checkboxCorner.className = "checkbox-corner-cell edit-reveal";
      headRow.appendChild(checkboxCorner);

      var corner = document.createElement("th");
      corner.className = "corner-cell";
      headRow.appendChild(corner);

      tableState.headers.forEach(function (header, colIndex) {
        var th = document.createElement("th");
        var wrap = document.createElement("div");
        wrap.className = "header-wrap";

        var input = document.createElement("input");
        input.type = "text";
        input.value = header;
        input.placeholder = "欄位名稱";
        input.className = "table-header-input";
        input.readOnly = !isEditMode || !canUseEditMode();
        input.addEventListener("input", function () {
          syncTableFromDom();
          persistTableState();
        });

        var remove = document.createElement("button");
        remove.type = "button";
        remove.className = "edit-reveal";
        remove.textContent = "×";
        remove.setAttribute("aria-label", "刪除第 " + (colIndex + 1) + " 欄");
        remove.addEventListener("click", function () {
          if (tableState.headers.length <= 1) return;
          syncTableFromDom();
          tableState.headers.splice(colIndex, 1);
          tableState.cells = tableState.cells.map(function (row) {
            row.splice(colIndex, 1);
            return row;
          });
          renderTable();
          persistTableState();
        });

        wrap.appendChild(input);
        wrap.appendChild(remove);
        th.appendChild(wrap);
        headRow.appendChild(th);
      });

      thead.appendChild(headRow);
      dataTable.appendChild(thead);

      var tbody = document.createElement("tbody");
      var totalCols = 2 + tableState.headers.length;

      // 最頂：在第一列之前可插入
      appendRowInsertSlot(tbody, 0);
      tableState.cells.forEach(function (row, rowIndex) {
        var tr = document.createElement("tr");
        var isStandalone = !!tableState.rowStandalone[rowIndex];

        if (isStandalone) {
          tr.className = "data-row row-standalone";
          var mergedCell = document.createElement("td");
          mergedCell.colSpan = totalCols;

          var standaloneWrap = document.createElement("div");
          standaloneWrap.className = "row-standalone-wrap";
          standaloneWrap.appendChild(createRowStandaloneCheckbox(rowIndex));

          var standaloneLabelInput = createRowLabelInput(rowIndex);
          standaloneLabelInput.classList.add("table-row-label-input-standalone");
          standaloneWrap.appendChild(standaloneLabelInput);
          mergedCell.appendChild(standaloneWrap);
          tr.appendChild(mergedCell);
          tbody.appendChild(tr);

          if (rowIndex < tableState.cells.length - 1) {
            appendRowInsertSlot(tbody, rowIndex + 1);
          }
          return;
        }

        tr.className = "data-row";

        var checkboxCell = document.createElement("td");
        checkboxCell.className = "row-checkbox-cell edit-reveal";
        checkboxCell.appendChild(createRowStandaloneCheckbox(rowIndex));
        tr.appendChild(checkboxCell);

        var labelCell = document.createElement("th");
        var labelWrap = document.createElement("div");
        labelWrap.className = "row-label-wrap";

        var moveWrap = document.createElement("div");
        moveWrap.className = "move-btns edit-reveal";

        var upBtn = document.createElement("button");
        upBtn.type = "button";
        upBtn.className = "move-btn edit-reveal";
        upBtn.textContent = "↑";
        upBtn.setAttribute("aria-label", "上移第 " + (rowIndex + 1) + " 列");
        upBtn.disabled = rowIndex === 0;
        upBtn.addEventListener("click", function () {
          moveTableRow(rowIndex, -1);
        });

        var downBtn = document.createElement("button");
        downBtn.type = "button";
        downBtn.className = "move-btn edit-reveal";
        downBtn.textContent = "↓";
        downBtn.setAttribute("aria-label", "下移第 " + (rowIndex + 1) + " 列");
        downBtn.disabled = rowIndex === tableState.cells.length - 1;
        downBtn.addEventListener("click", function () {
          moveTableRow(rowIndex, 1);
        });

        moveWrap.appendChild(upBtn);
        moveWrap.appendChild(downBtn);

        var rowLabelInput = createRowLabelInput(rowIndex);

        var removeRow = document.createElement("button");
        removeRow.type = "button";
        removeRow.className = "edit-reveal";
        removeRow.textContent = "×";
        removeRow.setAttribute("aria-label", "刪除第 " + (rowIndex + 1) + " 列");
        removeRow.addEventListener("click", function () {
          if (tableState.cells.length <= 1) return;
          syncTableFromDom();
          tableState.rowLabels.splice(rowIndex, 1);
          tableState.rowStandalone.splice(rowIndex, 1);
          tableState.cells.splice(rowIndex, 1);
          renderTable();
          persistTableState();
        });

        labelWrap.appendChild(moveWrap);
        labelWrap.appendChild(rowLabelInput);
        labelWrap.appendChild(removeRow);
        labelCell.appendChild(labelWrap);
        tr.appendChild(labelCell);

        row.forEach(function (cell, colIndex) {
          var td = document.createElement("td");
          td.appendChild(buildCellWrap(cell, rowIndex, colIndex));
          tr.appendChild(td);
        });

        tbody.appendChild(tr);

        if (rowIndex < tableState.cells.length - 1) {
          appendRowInsertSlot(tbody, rowIndex + 1);
        }
      });

      // 最底：在最後一列之後可插入
      appendRowInsertSlot(tbody, tableState.cells.length);
      dataTable.appendChild(tbody);
      applyTableColumnWidths();
    }

    function addTableColumn() {
      syncTableFromDom();
      tableState.headers.push("欄 " + (tableState.headers.length + 1));
      tableState.cells = tableState.cells.map(function (row) {
        row.push(createEmptyCell());
        return row;
      });
      renderTable();
      persistTableState();
    }

    function insertTableRowAt(insertIndex) {
      syncTableFromDom();
      tableState.rowLabels.splice(insertIndex, 0, "列 " + (tableState.rowLabels.length + 1));
      tableState.rowStandalone.splice(insertIndex, 0, false);
      tableState.cells.splice(insertIndex, 0, tableState.headers.map(function () {
        return createEmptyCell();
      }));
      renderTable();
      persistTableState();
    }

    function addTableRow() {
      syncTableFromDom();
      insertTableRowAt(tableState.rowLabels.length);
    }

    function loadState() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          var parsed = JSON.parse(raw);
          if (Array.isArray(parsed.contents) && parsed.contents.length) {
            state.contents = parsed.contents.map(normalizeItem).filter(Boolean);
            state.defaultBtnText = String(parsed.defaultBtnText || defaultBtnText).trim() || defaultBtnText;
            state.defaultBtnColor = normalizeColor(parsed.defaultBtnColor);
            state.defaultBtnTextColor = normalizeTextColor(
              parsed.defaultBtnTextColor,
              isTransparentColor(parsed.defaultBtnColor) ? defaultTextOnTransparent : defaultBtnTextColor
            );
            state.clickCount = Number(parsed.clickCount) || 0;
            if (state.contents.length) return;
          }
        }
      } catch (e) {}
      state.contents = defaultContents.map(function (item) {
        return { text: item.text, color: item.color, textColor: item.textColor };
      });
      state.defaultBtnText = defaultBtnText;
      state.defaultBtnColor = defaultAccent;
      state.defaultBtnTextColor = defaultBtnTextColor;
      state.clickCount = 0;
    }

    function persistState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        contents: state.contents,
        defaultBtnText: state.defaultBtnText,
        defaultBtnColor: state.defaultBtnColor,
        defaultBtnTextColor: state.defaultBtnTextColor,
        clickCount: state.clickCount
      }));
      scheduleCloudSave();
    }

    function readEntriesFromDom() {
      var rows = entryList.querySelectorAll(".entry-row:not(.entry-row-default)");
      return Array.prototype.map.call(rows, function (row) {
        var textInput = row.querySelector(".entry-text-input");
        var textColorInput = row.querySelector(".entry-text-color-input");
        var colorInput = row.querySelector(".entry-bg-color-input");
        var transparentInput = row.querySelector(".entry-transparent-input");
        var bgColor = readColorValue(colorInput, transparentInput);
        return {
          text: textInput ? textInput.value.trim() : "",
          color: bgColor,
          textColor: normalizeTextColor(
            textColorInput ? textColorInput.value : "",
            isTransparentColor(bgColor) ? defaultTextOnTransparent : defaultBtnTextColor
          )
        };
      });
    }

    function moveEntry(index, direction) {
      var items = readEntriesFromDom();
      var target = index + direction;
      if (target < 0 || target >= items.length) return;
      var temp = items[index];
      items[index] = items[target];
      items[target] = temp;
      state.contents = items;
      renderEntryList();
    }

    function renderEntryList() {
      entryList.innerHTML = "";
      defaultBtnTextInput.value = state.defaultBtnText;
      setupTextColorField(defaultBtnTextColorInput, state.defaultBtnTextColor, state.defaultBtnColor);
      setupColorField(defaultBtnColorInput, defaultBtnTransparentInput, state.defaultBtnColor);

      state.contents.forEach(function (item, i) {
        var row = document.createElement("div");
        row.className = "entry-row";

        var moveWrap = document.createElement("div");
        moveWrap.className = "move-btns";

        var upBtn = document.createElement("button");
        upBtn.type = "button";
        upBtn.className = "move-btn";
        upBtn.textContent = "↑";
        upBtn.setAttribute("aria-label", "上移第 " + (i + 1) + " 項");
        upBtn.disabled = i === 0;
        upBtn.addEventListener("click", function () {
          moveEntry(i, -1);
        });

        var downBtn = document.createElement("button");
        downBtn.type = "button";
        downBtn.className = "move-btn";
        downBtn.textContent = "↓";
        downBtn.setAttribute("aria-label", "下移第 " + (i + 1) + " 項");
        downBtn.disabled = i === state.contents.length - 1;
        downBtn.addEventListener("click", function () {
          moveEntry(i, 1);
        });

        moveWrap.appendChild(upBtn);
        moveWrap.appendChild(downBtn);

        var label = document.createElement("div");
        label.className = "entry-label";
        label.textContent = "第 " + (i + 1) + " 次";

        var input = document.createElement("input");
        input.type = "text";
        input.value = item.text;
        input.placeholder = "按鈕文字";
        input.className = "entry-text-input";

        var textColorField = document.createElement("div");
        textColorField.className = "color-field";

        var textColorInput = document.createElement("input");
        textColorInput.type = "color";
        textColorInput.className = "color-input entry-text-color-input";
        textColorInput.setAttribute("aria-label", "第 " + (i + 1) + " 次字色");
        setupTextColorField(textColorInput, item.textColor, item.color);

        var colorField = document.createElement("div");
        colorField.className = "color-field";

        var colorInput = document.createElement("input");
        colorInput.type = "color";
        colorInput.className = "color-input entry-bg-color-input";
        colorInput.setAttribute("aria-label", "第 " + (i + 1) + " 次底色");

        var transparentLabel = document.createElement("label");
        transparentLabel.className = "transparent-toggle";
        var transparentInput = document.createElement("input");
        transparentInput.type = "checkbox";
        transparentInput.className = "entry-transparent-input";
        transparentLabel.appendChild(transparentInput);
        transparentLabel.appendChild(document.createTextNode("透明"));

        setupColorField(colorInput, transparentInput, item.color);
        textColorField.appendChild(textColorInput);
        colorField.appendChild(colorInput);

        var remove = document.createElement("button");
        remove.className = "remove-btn";
        remove.type = "button";
        remove.setAttribute("aria-label", "刪除第 " + (i + 1) + " 項");
        remove.textContent = "×";
        remove.addEventListener("click", function () {
          var items = readEntriesFromDom();
          items.splice(i, 1);
          state.contents = items;
          renderEntryList();
        });

        row.appendChild(moveWrap);
        row.appendChild(label);
        row.appendChild(input);
        row.appendChild(textColorField);
        row.appendChild(colorField);
        row.appendChild(transparentLabel);
        row.appendChild(remove);
        entryList.appendChild(row);
      });
    }

    function collectEntriesFromForm() {
      return readEntriesFromDom().filter(function (item) {
        return item.text;
      });
    }

    function openModal() {
      renderEntryList();
      overlay.classList.add("open");
      overlay.setAttribute("aria-hidden", "false");
    }

    function closeModal() {
      overlay.classList.remove("open");
      overlay.setAttribute("aria-hidden", "true");
    }

    gearBtn.addEventListener("click", openModal);
    closeBtn.addEventListener("click", closeModal);

    overlay.addEventListener("click", function (e) {
      if (e.target === overlay) closeModal();
    });

    addBtn.addEventListener("click", function () {
      var items = readEntriesFromDom();
      items.push({ text: "", color: defaultAccent, textColor: defaultBtnTextColor });
      state.contents = items;
      renderEntryList();
      var inputs = entryList.querySelectorAll(".entry-text-input");
      var last = inputs[inputs.length - 1];
      if (last) last.focus();
    });

    saveBtn.addEventListener("click", function () {
      if (hasCloudConflict) {
        alert("雲端資料已有衝突，請先重新載入雲端資料後再儲存。");
        return;
      }
      var items = collectEntriesFromForm();
      if (!items.length) {
        alert("請至少保留一項內容");
        return;
      }
      state.defaultBtnText = defaultBtnTextInput.value.trim() || defaultBtnText;
      state.defaultBtnColor = readColorValue(defaultBtnColorInput, defaultBtnTransparentInput);
      state.defaultBtnTextColor = normalizeTextColor(
        defaultBtnTextColorInput.value,
        isTransparentColor(state.defaultBtnColor) ? defaultTextOnTransparent : defaultBtnTextColor
      );
      state.contents = items;
      tableState.cells.forEach(function (row) {
        row.forEach(function (cell) {
          if (cell.clickCount > 0 && state.contents.length) {
            cell.clickCount = ((cell.clickCount - 1) % state.contents.length) + 1;
          } else {
            cell.clickCount = 0;
          }
        });
      });
      persistState();
      renderTable();
      closeModal();
    });

    frameWidthInput.addEventListener("change", commitFrameWidth);
    frameWidthInput.addEventListener("blur", commitFrameWidth);
    frameWidthInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        commitFrameWidth();
        frameWidthInput.blur();
      }
    });

    labelColWidthInput.addEventListener("change", commitLabelColWidth);
    labelColWidthInput.addEventListener("blur", commitLabelColWidth);
    labelColWidthInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        commitLabelColWidth();
        labelColWidthInput.blur();
      }
    });

    addTableRowBtn.addEventListener("click", function () {
      if (!isEditMode) return;
      addTableRow();
    });
    addTableColBtn.addEventListener("click", function () {
      if (!isEditMode) return;
      addTableColumn();
    });

    if (editModeToggle) {
      editModeToggle.addEventListener("click", function () {
        if (!canUseEditMode()) {
          alert("權限不足：僅權限等級 0 或 1 可使用編輯模式。");
          return;
        }
        if (!isEditMode) {
          setEditMode(true);
          return;
        }
        setEditMode(false);
        if (hasCloudConflict) {
          alert("雲端資料已有衝突，請先重新載入雲端資料後再儲存。");
          return;
        }
        saveToSupabase();
      });
    }

    if (conflictReloadBtn) {
      conflictReloadBtn.addEventListener("click", function () {
        reloadCloudData();
      });
    }

    window.addEventListener("beforeunload", function () {
      if (presenceChannel) presenceChannel.untrack();
    });

    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible") {
        refreshPresenceTrack();
      }
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && overlay.classList.contains("open")) closeModal();
    });

    async function bootstrap() {
      loadState();
      loadTableState();
      renderTable();
      syncEditModeUi();
      try {
        await loadFromSupabase();
      } catch (err) {
        setCloudStatus("雲端連線失敗：" + formatSupabaseError(err), true);
      }
    }

    supabase.auth.onAuthStateChange(function (event) {
      if (event === "SIGNED_IN" || event === "TOKEN_REFRESHED") {
        loadFromSupabase().catch(function (err) {
          setCloudStatus("雲端連線失敗：" + formatSupabaseError(err), true);
        });
      }
      if (event === "SIGNED_OUT") {
        teardownRealtime();
        redirectToLogin();
      }
    });

    bootstrap();
  </script>
</body>
</html>
